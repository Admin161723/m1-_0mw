<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب مسدود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(160deg, #1c0a0a 0%, #2b0d0d 50%, #180808 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .wrap {
            width: 100%;
            max-width: 400px;
        }
        .top-icon {
            text-align: center;
            margin-bottom: 20px;
        }
        .ban-circle {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c62828);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: 0 0 40px rgba(255, 60, 60, 0.45);
            animation: beat 1.6s ease-in-out infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            color: #ff8a80;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 24px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 120, 120, 0.25);
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(8px);
            margin-bottom: 14px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .row:last-child { border-bottom: none; padding-bottom: 0; }
        .row:first-child { padding-top: 0; }
        .row .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }
        .row .value {
            font-size: 15px;
            font-weight: 700;
            color: white;
            text-align: left;
            max-width: 60%;
            word-break: break-word;
        }
        .row .value.red { color: #ff8a80; }
        .timer-box {
            background: linear-gradient(135deg, #b71c1c, #8e0000);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 14px;
            box-shadow: 0 6px 25px rgba(180, 0, 0, 0.35);
        }
        .timer-box .t-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 8px;
        }
        .timer-box .t-value {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            direction: ltr;
            font-family: 'Courier New', monospace;
        }
        .timer-box .t-value.perm {
            font-size: 20px;
            font-family: 'Vazirmatn', sans-serif;
            letter-spacing: 0;
        }
        .btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            transition: background 0.2s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.98); }
        .loading { text-align: center; padding: 30px; color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="top-icon"><div class="ban-circle">🚫</div></div>
    <div class="title">حساب شما مسدود شد</div>
    <div class="subtitle">به دلیل تخلف از قوانین بازی</div>

    <div id="loading" class="loading">در حال بارگذاری...</div>

    <div id="content" style="display:none;">
        <div class="card">
            <div class="row">
                <span class="label">مسدود شده توسط</span>
                <span class="value" id="by">-</span>
            </div>
            <div class="row">
                <span class="label">دلیل مسدودی</span>
                <span class="value red" id="reason">-</span>
            </div>
            <div class="row">
                <span class="label">مدت محرومیت</span>
                <span class="value" id="duration">-</span>
            </div>
        </div>

        <div class="timer-box">
            <div class="t-label">زمان باقی مانده</div>
            <div class="t-value" id="timer">--:--:--</div>
        </div>

        <button class="btn" onclick="location.href='index.html'">بازگشت به ورود</button>
    </div>
</div>

<script>
const REDIS_URL = "https://smooth-werewolf-200782.upstash.io";
const REDIS_TOKEN = "gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA";

const DURATION_LABELS = {
    '1h': '۱ ساعت', '1d': '۱ روز', '7d': '۷ روز',
    '2w': '۲ هفته', '1m': '۱ ماه', '3m': '۳ ماه',
    'permanent': 'دائمی'
};

async function init() {
    const params = new URLSearchParams(location.search);
    let phone = params.get('phone');
    if (!phone) {
        try {
            const lg = localStorage.getItem('currentLoggedInUser');
            if (lg) phone = JSON.parse(lg).phone;
        } catch(e) {}
    }

    if (!phone) {
        showInfo({
            bannedBy: params.get('by') || 'مدیریت',
            reason: params.get('reason') || 'نامشخص',
            duration: params.get('duration') || 'permanent',
            expiresAt: params.get('expires')
        });
        return;
    }

    try {
        const res = await fetch(REDIS_URL + '/get/ban:' + encodeURIComponent(phone), {
            headers: { 'Authorization': 'Bearer ' + REDIS_TOKEN }
        });
        const data = await res.json();
        const ban = data.result ? JSON.parse(data.result) : null;

        if (!ban || !ban.isBanned) {
            location.href = 'index.html';
            return;
        }

        showInfo(ban);
        startTimer(ban);
        startUnbanCheck(phone);
    } catch(e) {
        document.getElementById('loading').innerText = 'خطا در اتصال';
    }
}

function showInfo(ban) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('by').innerText = ban.bannedBy || 'مدیریت';
    document.getElementById('reason').innerText = ban.reason || 'نامشخص';
    document.getElementById('duration').innerText = DURATION_LABELS[ban.duration] || ban.duration || 'نامشخص';

    const isPermanent = ban.duration === 'permanent' || ban.duration === 'دائمی' || !ban.expiresAt;
    if (isPermanent) {
        const t = document.getElementById('timer');
        t.innerText = 'دائمی';
        t.classList.add('perm');
    }
}

function startTimer(ban) {
    if (!ban.expiresAt) return;
    const expires = new Date(ban.expiresAt).getTime();

    function update() {
        const diff = expires - Date.now();
        if (diff <= 0) { location.href = 'index.html'; return; }
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        let text;
        if (d > 0) {
            text = d + ' روز ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        } else {
            text = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        document.getElementById('timer').innerText = text;
    }
    update();
    setInterval(update, 1000);
}

function startUnbanCheck(phone) {
    setInterval(async () => {
        try {
            const res = await fetch(REDIS_URL + '/get/ban:' + encodeURIComponent(phone), {
                headers: { 'Authorization': 'Bearer ' + REDIS_TOKEN }
            });
            const data = await res.json();
            const ban = data.result ? JSON.parse(data.result) : null;
            if (!ban || !ban.isBanned) location.href = 'index.html';
        } catch(e) {}
    }, 5000);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
