  .clan-logo-box img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .user-info{flex:1;min-width:0;overflow:hidden;}
  .user-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
  .user-name{color:white;font-weight:900;word-break:break-word;white-space:normal;line-height:1.3;max-width:100%;font-size:15px;}

  document.addEventListener('gesturechange',e=>e.preventDefault());
  document.addEventListener('gestureend',e=>e.preventDefault());

  let lastTouchEnd=0;
  document.addEventListener('touchend',function(e){const now=(new Date()).getTime();if(now-lastTouchEnd<=300){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();}}lastTouchEnd=now;},false);

  /* ========= DATABASE (ONLY Upstash) ========= */
  const UPSTASH_OLD_URL="https://smooth-werewolf-200782.upstash.io";
  const UPSTASH_OLD_TOKEN="gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA";
  const UPSTASH_NEW_URL="https://holy-hamster-122717.upstash.io";

  async function upstashGet(url,token,k){
    try{
      const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
      const r=await fetch(url+'/get/'+encodeURIComponent(k),{headers:{'Authorization':'Bearer '+token},signal:c.signal,cache:'no-store'});
      clearTimeout(t);if(!r.ok)return null;
      const d=await r.json();
      if(d&&d.result){try{return JSON.parse(d.result);}catch(e){return d.result;}}
      return null;
    }catch(e){return null;}
  }
  async function upstashSet(url,token,k,v){
    try{
      const jv=JSON.stringify(v);
      const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
      const r=await fetch(url+'/set/'+encodeURIComponent(k)+'/'+encodeURIComponent(jv),{headers:{'Authorization':'Bearer '+token},signal:c.signal});
      clearTimeout(t);return r.ok;
    }catch(e){return false;}
  }
  async function redisGet(key){
    let v=await upstashGet(UPSTASH_OLD_URL,UPSTASH_OLD_TOKEN,key);
    if(v!==null)return v;
    v=await upstashGet(UPSTASH_NEW_URL,UPSTASH_NEW_TOKEN,key);
    if(v!==null)return v;
    if(key==='police_groups'){try{const b=localStorage.getItem('police_groups_backup');if(b)return JSON.parse(b);}catch(e){}}
    return null;
  }
  async function redisSet(key,value){
    if(key==='police_groups'){try{localStorage.setItem('police_groups_backup',JSON.stringify(value));}catch(e){}}
    const r=await Promise.allSettled([
      upstashSet(UPSTASH_OLD_URL,UPSTASH_OLD_TOKEN,key,value),
      upstashSet(UPSTASH_NEW_URL,UPSTASH_NEW_TOKEN,key,value)
    ]);
    return r.some(x=>x.status==='fulfilled'&&x.value===true);
  }
  async function getAllUsers(){return await redisGet('all_users')||{};}
  async function getGroups(){
    let g=await redisGet('police_groups');
    if(!g||g.length===0){try{const b=localStorage.getItem('police_groups_backup');if(b)g=JSON.parse(b);}catch(e){}}
    return g||[];
  }
  async function saveGroups(g){return await redisSet('police_groups',g);}

  /* ========= TICK SYSTEM ========= */

  function getTickImage(rank){if(rank<1||rank>20)return null;return TICK_LEVELS[rank-1].img;}

  /* Auto upgrade tick when clan level fills next requirement */
  function checkAndAutoUpgradeTick(group,clanLevel){
    let rank=parseInt(group.tickRank)||0;
    let startLevel=parseInt(group.tickStartLevel)||1;
    let changed=false;
    while(rank<20){
      const need=TICK_LEVELS[rank].need;
      if(clanLevel-startLevel>=need){
        rank++;
        startLevel+=need;
        changed=true;
      }else{break;}
    }
    if(changed){
      group.tickRank=rank;
      group.tickStartLevel=startLevel;
    }
    return changed;
  }

  let currentUserPhone=null;
  let currentUserGroup=null;

  function calculateClanStats(group,allUsers){
    let totalPoints=parseInt(group.extraPoints)||0;
    const members=group.members||[];
    members.forEach(mid=>{
      const u=allUsers[mid];
      if(u){totalPoints+=(parseInt(u.cups)||0)*2+(parseInt(u.hours)||0)*20;}
    });
    let level=Math.floor(totalPoints/1000)+1;
    if(level>1000)level=1000;
    const cur=totalPoints-((level-1)*1000);
    const pct=Math.min(100,(cur/1000)*100);
    return{totalPoints,level,currentLevelPoints:cur,percentage:pct};
  }

  async function updateTimer(){
    const config=await getTournamentConfig();
    const countdownEl=document.getElementById('countdown');
    if(!config||!config.endTime){countdownEl.textContent='مسابقه‌ای تنظیم نشده است';return;}
    const now=Date.now();const end=config.endTime;
    if(now>=end){countdownEl.textContent='مسابقه پایان یافت!';countdownEl.style.color='#4CAF50';return;}
    const diff=end-now;
    const days=Math.floor(diff/(1000*60*60*24));
    const hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    const minutes=Math.floor((diff%(1000*60*60))/(1000*60));
    const seconds=Math.floor((diff%(1000*60))/1000);
    countdownEl.textContent=`${days} روز ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
  }

  async function loadLeaderboard(){
    const leaderboard=document.getElementById('leaderboard');
    leaderboard.innerHTML='<div class="empty-state">در حال بارگذاری از سرور...<div class="loading-spinner"></div></div>';
    const [allUsers,groups]=await Promise.all([getAllUsers(),getGroups()]);

    // Auto upgrade ticks based on clan level
    let anyChanged=false;
    for(const g of groups){
      const stats=calculateClanStats(g,allUsers);
      if(checkAndAutoUpgradeTick(g,stats.level))anyChanged=true;
    }
    if(anyChanged)await saveGroups(groups);

    const clansWithStats=groups.map(group=>({group,stats:calculateClanStats(group,allUsers)}));

    /* SORT: tickRank first (higher = better), then verified, then level, then totalPoints */
    clansWithStats.sort((a,b)=>{
      const aTick=parseInt(a.group.tickRank)||0;
      const bTick=parseInt(b.group.tickRank)||0;
      if(bTick!==aTick)return bTick-aTick;
      const aV=a.group.verified===true?1:0;
      const bV=b.group.verified===true?1:0;
      if(bV!==aV)return bV-aV;
      if(b.stats.level!==a.stats.level)return b.stats.level-a.stats.level;
      return b.stats.totalPoints-a.stats.totalPoints;
    });

    const topClans=clansWithStats.slice(0,200);

    if(topClans.length===0){
      leaderboard.innerHTML='<div class="empty-state">هنوز کلنی ثبت‌نام نکرده است</div>';
      return;
    }

    leaderboard.innerHTML=topClans.map((item,index)=>createClanItem(item.group,item.stats,index+1,allUsers)).join('');
  }

  function createClanItem(group,stats,rank,allUsers){
    const isCurrentUserClan=currentUserGroup&&currentUserGroup.id===group.id;

    let nameStyle='';
    const colorData=getColorByCode(group.colorCode);
    if(colorData){nameStyle=`color:${colorData.hex};`;}

    // Two separate ticks:
    // 1) verified tick (TikK2.png) — verified flag
    // 2) rank tick (from TICK_LEVELS) — tickRank 1..20
    const verifyTickHtml=group.verified?`<img src="${CLAN_TICK_IMG}" class="clan-verify-tick" onerror="this.style.display='none'">`:'';
    const tickRank=parseInt(group.tickRank)||0;
    const rankTickHtml=tickRank>0?`<img src="${getTickImage(tickRank)}" class="clan-tick" onerror="this.style.display='none'">`:'';

    const logoSrc=group.logo||'20.webp';
    const logoHtml=`<img src="${logoSrc}" onerror="this.src='20.webp'">`;

    let rankHtml='';
    if(rank===1)rankHtml='<img src="26.webp" class="rank-medal" onerror="this.style.display=\'none\'">';
    else if(rank===2)rankHtml='<img src="27.webp" class="rank-medal" onerror="this.style.display=\'none\'">';
    else if(rank===3)rankHtml='<img src="28.webp" class="rank-medal" onerror="this.style.display=\'none\'">';
    else rankHtml=`<div class="rank-badge">${toPersianNum(rank)}</div>`;

    return `
      <div class="rank-item ${rank<=3?'top-'+rank:''} ${isCurrentUserClan?'current-user':''}" onclick="showClanMembers('${group.id}')">
        <div class="rank-number">${toPersianNum(rank)}</div>
        <div class="clan-logo-box">${logoHtml}</div>
        <div class="user-info">
          <div class="user-name-row">
            <span class="user-name" style="${nameStyle}">${group.name||'بدون نام'}</span>
            ${verifyTickHtml}
            ${rankTickHtml}
          </div>
          <div class="clan-level-box">
            <div class="clan-level-header">
              <span class="clan-level-badge">سطح ${toPersianNum(stats.level)}</span>
              <span>${toPersianNum(stats.currentLevelPoints)} / ${toPersianNum(1000)}</span>
            </div>
            <div class="clan-progress-bg">
              <div class="clan-progress-fill" style="width:${stats.percentage}%"></div>
            </div>
            <div class="clan-level-footer">
              <span>مجموع امتیاز: ${toPersianNum(stats.totalPoints)}</span>
              <span>تا سطح بعدی: ${toPersianNum(1000-stats.currentLevelPoints)}</span>
            </div>
          </div>
        </div>
        ${rankHtml}
      </div>
    `;
  }

  async function showClanMembers(groupId){
    playClick();
    const [groups,allUsers]=await Promise.all([getGroups(),getAllUsers()]);
    const group=groups.find(g=>g.id===groupId);
    if(!group)return;

    document.getElementById('modalClanName').textContent=`اعضای کلن: ${group.name}`;
    const list=document.getElementById('modalClanMembersList');
    list.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.7);">در حال بارگذاری...<div class="loading-spinner"></div></div>';
    document.getElementById('clanMembersModal').classList.add('active');

    let membersHtml='';
    if(group.members&&group.members.length>0){
      const sortedMembers=[...group.members].sort((a,b)=>{
        if(a===group.owner)return-1;if(b===group.owner)return 1;
        const aDep=(group.deputies||[]).includes(a)?1:0;
        const bDep=(group.deputies||[]).includes(b)?1:0;
        return bDep-aDep;
      });

      for(const phone of sortedMembers){
        const u=allUsers[phone]||{name:'کاربر',avatar:'Mafia2.png',level:1,cups:0,hours:0};
        const isOwner=phone===group.owner;
        const isDeputy=(group.deputies||[]).includes(phone);
        let roleText='عضو',roleColor='#a0aec0';
        if(isOwner){roleText='مدیر کلن';roleColor='#ffd700';}
        else if(isDeputy){roleText='معاون';roleColor='#4a9eff';}

        const isVideo=u.avatar&&(u.avatar.endsWith('.webm')||u.avatar.endsWith('.mp4'));
        const avatarHtml=isVideo
          ?`<video src="${u.avatar}" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>`
          :`<img src="${u.avatar||'Mafia2.png'}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='Mafia2.png'">`;

        const userColor=getColorByCode(u.colorCode);
        const nameStyle=userColor?('color:'+userColor.hex+';'):'';

        membersHtml+=`
          <div class="member-card-modal">
            <div class="member-avatar-modal">${avatarHtml}</div>
            <div class="member-info-modal">
              <div class="member-name-modal" style="${nameStyle}">${u.name||'کاربر'}</div>
              <div class="member-role-modal" style="color:${roleColor}">${roleText}</div>
              <div class="member-stats-modal">
                <span class="member-cups-badge">${toPersianNum(u.cups||0)} کاپ</span>
                <span>${toPersianNum(u.hours||0)} ساعت</span>
                <span>سطح ${toPersianNum(u.level||1)}</span>
              </div>
            </div>
          </div>
        `;
      }
    }else{
      membersHtml='<div style="text-align:center;color:rgba(255,255,255,0.6);padding:20px;">عضوی یافت نشد</div>';
    }
    list.innerHTML=membersHtml;
  }

  async function refreshLeaderboard(){
    playClick();
    const btn=document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    await loadLeaderboard();
    btn.classList.remove('spinning');
    showToast('رتبه‌بندی به‌روز شد');
  }

  function goBack(){playClick();window.location.href='Safe Asli.html';}

  document.addEventListener('DOMContentLoaded',async()=>{
    const loggedIn=localStorage.getItem('currentLoggedInUser');
    if(!loggedIn){showToast('ابتدا وارد شوید','error');setTimeout(()=>window.location.href='index.html',1500);return;}
    try{
      const userInfo=JSON.parse(loggedIn);
      currentUserPhone=userInfo.phone;
      const groups=await getGroups();
      currentUserGroup=groups.find(g=>g.members&&g.members.includes(currentUserPhone))||null;
      await loadLeaderboard();
      updateTimer();
      setInterval(updateTimer,1000);
      setInterval(async()=>{
        if(document.visibilityState==='visible'){
          await loadLeaderboard();
          await updateTimer();
        }
      },10000);
    }catch(e){showToast('خطا در بارگذاری','error');console.error(e);}
  });

  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible'){
      await loadLeaderboard();
      await updateTimer();
    }
  });
</script>
