<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061a3a">
<title>برترین کلن‌ها</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  html {
    width: 100% !important; height: 100% !important;
    overflow: hidden !important; position: fixed !important;
    top: 0; left: 0; right: 0; bottom: 0;
    overscroll-behavior: none !important;
    background: #061a3a !important; touch-action: none !important;
  }

  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(180deg, #0a2a5a 0%, #061a3a 100%) !important;
    width: 100% !important; height: 100% !important;
    position: fixed !important; top: 0; left: 0;
    display: flex; justify-content: center;
    overflow: hidden !important; touch-action: none !important;
    color: white;
  }

  .page-wrapper {
    width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
    background: linear-gradient(180deg, #0a2a5a 0%, #061a3a 100%);
    position: relative; display: flex; flex-direction: column;
    overflow: hidden !important; touch-action: none !important;
  }

  .header {
    background: linear-gradient(180deg, #1e4a8a 0%, #163d75 100%);
    padding: 15px; display: flex; align-items: center; justify-content: center;
    position: relative; border-bottom: 2px solid #2a5a9a;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0; z-index: 10;
  }

  .back-btn, .refresh-btn {
    position: absolute; width: 40px; height: 40px;
    background: rgba(255,255,255,0.15); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: white; font-size: 24px;
    border: 2px solid rgba(255,255,255,0.2); transition: all 0.2s;
  }
  .back-btn { left: 15px; }
  .refresh-btn { right: 15px; font-size: 20px; }
  .back-btn:active, .refresh-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .header-title {
    color: white; font-size: 20px; font-weight: 900;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .tournament-timer {
    background: rgba(0,0,0,0.4); padding: 12px; text-align: center;
    font-size: 15px; font-weight: 900; color: #ffd700;
    border-bottom: 1px solid rgba(255,215,0,0.3);
    display: flex; justify-content: center; align-items: center; gap: 8px;
    flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .leaderboard {
    padding: 15px; padding-bottom: 30px; flex: 1;
    overflow-y: auto; overflow-x: hidden;
    overscroll-behavior: contain !important;
    -webkit-overflow-scrolling: auto; touch-action: pan-y;
  }

  .rank-item {
    background: linear-gradient(180deg, #2a7acc, #1a5aaa);
    border-radius: 12px; padding: 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    border: 2px solid #3a8adc; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s; cursor: pointer;
  }
  .rank-item:active { transform: scale(0.98); }

  .rank-item.top-1 { background: linear-gradient(180deg, #ffd700, #ff8c00); border-color: #ffd700; }
  .rank-item.top-2 { background: linear-gradient(180deg, #c0c0c0, #808080); border-color: #c0c0c0; }
  .rank-item.top-3 { background: linear-gradient(180deg, #cd7f32, #8b4513); border-color: #cd7f32; }
  .rank-item.current-user {
    border: 3px solid #4a9eff !important;
    box-shadow: 0 0 20px rgba(74,158,255,0.6);
  }

  .rank-number {
    width: 40px; height: 40px; background: rgba(0,0,0,0.3);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: white; flex-shrink: 0;
  }
  .rank-item.top-1 .rank-number, .rank-item.top-2 .rank-number, .rank-item.top-3 .rank-number {
    background: rgba(255,255,255,0.3); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  .clan-logo-box {
    width: 55px; height: 55px; border-radius: 12px;
    background: #fffef9; border: 1px solid rgba(255,255,255,0.3);
    overflow: hidden; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .clan-logo-box img {
    width: 100%; height: 100%; object-fit: contain; padding: 4px;
  }

  .user-info { flex: 1; min-width: 0; overflow: hidden; }

  .user-name-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px; flex-wrap: wrap;
  }

  .user-name {
    color: white; font-weight: 900; word-break: break-word;
    white-space: normal; line-height: 1.3;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    max-width: 100%; font-size: 15px;
  }

  .clan-tick {
    width: 36px; height: 36px; object-fit: contain; flex-shrink: 0;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
  }

  .user-level {
    color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 700;
    margin-bottom: 4px;
  }

  .clan-level-box {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 8px;
  }
  .clan-level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.9); }
  .clan-level-badge { background: linear-gradient(180deg, #bc6c25, #8b5e3c); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; }
  .clan-progress-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; position: relative; }
  .clan-progress-fill { height: 100%; background: linear-gradient(90deg, #bc6c25, #ffd700); border-radius: 4px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .rank-item.top-1 .clan-progress-fill, .rank-item.top-2 .clan-progress-fill, .rank-item.top-3 .clan-progress-fill {
    background: linear-gradient(90deg, #fff, #ffd700);
  }
  .clan-level-footer { font-size: 10px; color: rgba(255,255,255,0.7); margin-top: 4px; font-weight: 700; display: flex; justify-content: space-between; }

  .rank-medal {
    width: 45px; height: 45px; object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); flex-shrink: 0;
  }

  .rank-badge {
    width: 40px; height: 40px; background: rgba(255,255,255,0.15);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: white; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.2);
  }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: rgba(255,255,255,0.6); font-size: 16px;
  }

  .loading-spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-left: 8px;
  }

  .toast {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(180deg, #4CAF50 0%, #45a049 100%);
    padding: 12px 24px; border-radius: 10px;
    font-weight: 700; font-size: 14px; opacity: 0;
    transition: all 0.3s; z-index: 2000; pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: linear-gradient(180deg, #f44336 0%, #da190b 100%); }

  .leaderboard::-webkit-scrollbar { width: 4px; }
  .leaderboard::-webkit-scrollbar-thumb { background: rgba(74,158,255,0.4); border-radius: 2px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: linear-gradient(180deg, #1a3a6a, #0f2545);
    border-radius: 20px; width: 100%; max-width: 380px;
    max-height: 85vh; overflow: hidden;
    border: 2px solid #3a8adc; display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-header {
    background: linear-gradient(180deg, #2a5a9a, #1a3a6a);
    padding: 16px; text-align: center; position: relative;
    border-bottom: 1px solid #3a8adc;
  }
  .modal-title { color: white; font-size: 16px; font-weight: 900; }
  .modal-close {
    position: absolute; top: 12px; left: 12px;
    width: 32px; height: 32px; background: rgba(255,255,255,0.15);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px; color: white; border: none;
  }
  .modal-body { padding: 15px; overflow-y: auto; flex: 1; }

  .member-card-modal {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; background: rgba(255,255,255,0.05);
    border-radius: 12px; margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: background 0.2s;
  }
  .member-card-modal:active { background: rgba(255,255,255,0.1); }
  .member-avatar-modal {
    width: 50px; height: 50px; border-radius: 50%; overflow: hidden;
    border: 2px solid #fff; flex-shrink: 0; background: #1a3a6a;
  }
  .member-avatar-modal img, .member-avatar-modal video {
    width: 100%; height: 100%; object-fit: cover;
  }
  .member-info-modal { flex: 1; min-width: 0; }
  .member-name-modal {
    color: #fff; font-weight: 900; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .member-role-modal { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .member-stats-modal { color: rgba(255,255,255,0.7); font-size: 11px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px; }
  .member-cups-badge {
    background: rgba(255,215,0,0.2); color: #ffd700;
    padding: 3px 8px; border-radius: 8px; font-size: 11px;
    font-weight: 900;
  }
</style>
</head>
<body>

<div class="page-wrapper">
  <div class="header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="header-title">برترین کلن‌ها</div>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshLeaderboard()">↻</button>
  </div>

  <div class="tournament-timer" id="tournamentTimer">
    <span>پایان مسابقه:</span>
    <span id="countdown">--:--:--</span>
  </div>

  <div class="leaderboard" id="leaderboard">
    <div class="empty-state">در حال بارگذاری از سرور...<div class="loading-spinner"></div></div>
  </div>
</div>

<div class="modal-overlay" id="clanMembersModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalClanName">اعضای کلن</div>
      <button class="modal-close" onclick="closeModal('clanMembersModal')">✕</button>
    </div>
    <div class="modal-body" id="modalClanMembersList">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="clickSound" preload="auto">
    <source src="denielcz-immersivecontrol-button-click-sound-463065.mp3" type="audio/mpeg">
</audio>

<script>
  const clickSound = document.getElementById('clickSound');
  function playClick() {
    try {
      if (clickSound) {
        clickSound.currentTime = 0;
        clickSound.volume = 0.3;
        clickSound.play().catch(() => {});
      }
    } catch (e) {}
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());

  document.addEventListener('touchmove', function(e) {
    const target = e.target;
    const leaderboard = document.getElementById('leaderboard');
    if (target !== leaderboard && !leaderboard.contains(target)) {
      e.preventDefault();
    }
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
      }
    }
    lastTouchEnd = now;
  }, false);

  document.addEventListener('contextmenu', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault(); return false;
    }
  });

  document.addEventListener('selectstart', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
    }
  });

  document.addEventListener('copy', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
  });
  document.addEventListener('cut', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
  });
  document.addEventListener('dragstart', e => e.preventDefault());

  function preventOverscroll(el) {
    if (!el) return;
    el.addEventListener('touchstart', function() {
      if (el.scrollTop <= 0) el.scrollTop = 1;
      if (el.scrollTop + el.clientHeight >= el.scrollHeight) {
        el.scrollTop = el.scrollHeight - el.clientHeight - 1;
      }
    }, { passive: true });
  }

  function showToast(message, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = message;
    t.className = 'toast show' + (type === 'error' ? ' error' : '');
    setTimeout(() => { t.classList.remove('show'); }, 3000);
  }

  function closeModal(id) {
    playClick();
    document.getElementById(id).classList.remove('active');
  }

  const UPSTASH_OLD_URL = "https://smooth-werewolf-200782.upstash.io";
  const UPSTASH_OLD_TOKEN = "gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA";
  const UPSTASH_NEW_URL = "https://holy-hamster-122717.upstash.io";
  const UPSTASH_NEW_TOKEN = "gQAAAAAAAd9dAAIgcDFlNmYwM2VkZDJiM2Y0YWI2ODBmNmIyMTZjMmRkMTZmNg";
  const JSONBIN_KEY = "$2a$10$G8pgSWnFz4w/.voj3lfBPuJL7luRXAXiR/fIufC3YIB4.qRkZSjSS";
  const JSONBIN_ID1 = "6a310a04da38895dfec86661";
  const JSONBIN_ID2 = "6a53f4c8f5f4af5e298541fe";

  async function upstashGet(url, token, k) {
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 5000);
      const r = await fetch(url + '/get/' + encodeURIComponent(k), { headers: { 'Authorization': 'Bearer ' + token }, signal: c.signal });
      clearTimeout(t);
      if (!r.ok) return null;
      const d = await r.json();
      if (d && d.result) { try { return JSON.parse(d.result); } catch (e) { return d.result; } }
      return null;
    } catch (e) { return null; }
  }

  async function jsonbinRead(binId) {
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 5000);
      const r = await fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', { headers: { 'X-Master-Key': JSONBIN_KEY }, signal: c.signal });
      clearTimeout(t);
      if (!r.ok) return null;
      const d = await r.json();
      return d.record || {};
    } catch (e) { return null; }
  }

  async function redisGet(key) {
    let v = await upstashGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, key);
    if (v !== null) return v;
    v = await upstashGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, key);
    if (v !== null) return v;
    const b1 = await jsonbinRead(JSONBIN_ID1);
    if (b1 && b1[key] !== undefined) return b1[key];
    const b2 = await jsonbinRead(JSONBIN_ID2);
    if (b2 && b2[key] !== undefined) return b2[key];
    return null;
  }

  async function getAllUsers() { return await redisGet('all_users') || {}; }
  async function getGroups() { return await redisGet('police_groups') || []; }
  async function getTournamentConfig() { return await redisGet('tournament_config') || {}; }

  function toPersianNum(num) {
    const persian = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    return (num || 0).toString().replace(/[0-9]/g, w => persian[+w]);
  }

  const COLOR_CODES = {
    1:{name:'سفید',hex:'#FFFFFF',text:'#000'},2:{name:'مشکی',hex:'#000000',text:'#fff'},
    3:{name:'قرمز',hex:'#FF0000',text:'#fff'},4:{name:'سبز',hex:'#008000',text:'#fff'},
    5:{name:'آبی',hex:'#0000FF',text:'#fff'},6:{name:'زرد',hex:'#FFD700',text:'#000'},
    7:{name:'نارنجی',hex:'#FFA500',text:'#000'},8:{name:'صورتی',hex:'#FF69B4',text:'#fff'},
    9:{name:'بنفش',hex:'#800080',text:'#fff'},10:{name:'قهوه‌ای',hex:'#8B4513',text:'#fff'},
    11:{name:'خاکستری',hex:'#808080',text:'#fff'},12:{name:'طلایی',hex:'#FFD700',text:'#000'}
  };
  function getColorByCode(code) {
    if (!code) return null;
    const n = parseInt(code);
    if (n >= 1 && n <= 100) return COLOR_CODES[n] || null;
    return null;
  }

  const CREATOR_PHONE = '09904844031';
  const CLAN_TICK_IMG = 'TikK2.png';

  let currentUserPhone = null;
  let currentUserGroup = null;

  function calculateClanStats(group, allUsers) {
    let totalPoints = parseInt(group.extraPoints) || 0;
    const members = group.members || [];
    members.forEach(memberId => {
      const u = allUsers[memberId];
      if (u) {
        const cups = parseInt(u.cups) || 0;
        const hours = parseInt(u.hours) || 0;
        totalPoints += (cups * 2) + (hours * 20);
      }
    });

    let level = Math.floor(totalPoints / 1000) + 1;
    if (level > 1000) level = 1000;

    const currentLevelPoints = totalPoints - ((level - 1) * 1000);
    const percentage = Math.min(100, (currentLevelPoints / 1000) * 100);

    return { totalPoints, level, currentLevelPoints, percentage };
  }

  async function updateTimer() {
    const config = await getTournamentConfig();
    const countdownEl = document.getElementById('countdown');

    if (!config || !config.endTime) {
      countdownEl.textContent = 'مسابقه‌ای تنظیم نشده است';
      return;
    }

    const now = Date.now();
    const end = config.endTime;

    if (now >= end) {
      countdownEl.textContent = 'مسابقه پایان یافت!';
      countdownEl.style.color = '#4CAF50';
      return;
    }

    const diff = end - now;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    countdownEl.textContent = `${days} روز ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
  }

  async function loadLeaderboard() {
    const leaderboard = document.getElementById('leaderboard');
    leaderboard.innerHTML = '<div class="empty-state">در حال بارگذاری از سرور...<div class="loading-spinner"></div></div>';

    const [allUsers, groups] = await Promise.all([getAllUsers(), getGroups()]);

    const clansWithStats = groups.map(group => ({
      group,
      stats: calculateClanStats(group, allUsers)
    }));

    clansWithStats.sort((a, b) => {
      if (b.stats.level !== a.stats.level) {
        return b.stats.level - a.stats.level;
      }
      return b.stats.totalPoints - a.stats.totalPoints;
    });

    const topClans = clansWithStats.slice(0, 200);

    if (topClans.length === 0) {
      leaderboard.innerHTML = '<div class="empty-state">هنوز کلنی ثبت‌نام نکرده است</div>';
      return;
    }

    leaderboard.innerHTML = topClans.map((item, index) => createClanItem(item.group, item.stats, index + 1, allUsers)).join('');
    preventOverscroll(leaderboard);
  }

  function createClanItem(group, stats, rank, allUsers) {
    const isCurrentUserClan = currentUserGroup && currentUserGroup.id === group.id;

    let nameStyle = '';
    const isOwnerCreator = (group.owner === CREATOR_PHONE);
    const colorData = isOwnerCreator ? getColorByCode(group.colorCode) : null;
    if (colorData) {
      nameStyle = `color: ${colorData.hex}; text-shadow: 0 1px 3px rgba(0,0,0,0.4);`;
    }

    const tickHtml = group.verified ? `<img src="${CLAN_TICK_IMG}" class="clan-tick" onerror="this.style.display='none'">` : '';

    const logoSrc = group.logo || '20.webp';
    const logoHtml = `<img src="${logoSrc}" onerror="this.src='20.webp'">`;

    let rankHtml = '';
    if (rank === 1) rankHtml = '<img src="26.webp" class="rank-medal" onerror="this.style.display=\'none\'">';
    else if (rank === 2) rankHtml = '<img src="27.webp" class="rank-medal" onerror="this.style.display=\'none\'">';
    else if (rank === 3) rankHtml = '<img src="28.webp" class="rank-medal" onerror="this.style.display=\'none\'">';
    else rankHtml = `<div class="rank-badge">${toPersianNum(rank)}</div>`;

    return `
      <div class="rank-item ${rank <= 3 ? 'top-' + rank : ''} ${isCurrentUserClan ? 'current-user' : ''}" onclick="showClanMembers('${group.id}')">
        <div class="rank-number">${toPersianNum(rank)}</div>
        <div class="clan-logo-box">
          ${logoHtml}
        </div>
        <div class="user-info">
          <div class="user-name-row">
            <span class="user-name" style="${nameStyle}">${group.name || 'بدون نام'}</span>
            ${tickHtml}
          </div>
          <div class="clan-level-box">
            <div class="clan-level-header">
              <span class="clan-level-badge">سطح ${toPersianNum(stats.level)}</span>
              <span>${toPersianNum(stats.currentLevelPoints)} / ${toPersianNum(1000)}</span>
            </div>
            <div class="clan-progress-bg">
              <div class="clan-progress-fill" style="width: ${stats.percentage}%"></div>
            </div>
            <div class="clan-level-footer">
              <span>مجموع امتیاز: ${toPersianNum(stats.totalPoints)}</span>
              <span>تا سطح بعدی: ${toPersianNum(1000 - stats.currentLevelPoints)}</span>
            </div>
          </div>
        </div>
        ${rankHtml}
      </div>
    `;
  }

  async function showClanMembers(groupId) {
    playClick();
    const [groups, allUsers] = await Promise.all([getGroups(), getAllUsers()]);
    const group = groups.find(g => g.id === groupId);
    if (!group) return;

    document.getElementById('modalClanName').textContent = `اعضای کلن: ${group.name}`;
    const list = document.getElementById('modalClanMembersList');
    list.innerHTML = '<div style="text-align:center; padding:20px; color:rgba(255,255,255,0.7);">در حال بارگذاری...<div class="loading-spinner"></div></div>';
    document.getElementById('clanMembersModal').classList.add('active');

    let membersHtml = '';

    if (group.members && group.members.length > 0) {
      const sortedMembers = [...group.members].sort((a, b) => {
        if (a === group.owner) return -1;
        if (b === group.owner) return 1;
        const aDep = (group.deputies || []).includes(a) ? 1 : 0;
        const bDep = (group.deputies || []).includes(b) ? 1 : 0;
        return bDep - aDep;
      });

      for (const phone of sortedMembers) {
        const u = allUsers[phone] || { name: 'کاربر', avatar: 'Mafia2.png', level: 1, score: 0, cups: 0, hours: 0 };
        const isOwner = phone === group.owner;
        const isDeputy = (group.deputies || []).includes(phone);

        let roleText = 'عضو';
        let roleColor = '#a0aec0';

        if (isOwner) { roleText = 'مدیر کلن'; roleColor = '#ffd700'; }
        else if (isDeputy) { roleText = 'معاون'; roleColor = '#4a9eff'; }

        const isVideo = u.avatar && (u.avatar.endsWith('.webm') || u.avatar.endsWith('.mp4'));
        const avatarHtml = isVideo
          ? `<video src="${u.avatar}" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>`
          : `<img src="${u.avatar || 'Mafia2.png'}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='Mafia2.png'">`;

        membersHtml += `
          <div class="member-card-modal">
            <div class="member-avatar-modal">
              ${avatarHtml}
            </div>
            <div class="member-info-modal">
              <div class="member-name-modal">${u.name || 'کاربر'}</div>
              <div class="member-role-modal" style="color:${roleColor}">${roleText}</div>
              <div class="member-stats-modal">
                <span class="member-cups-badge">${toPersianNum(u.cups || 0)} کاپ</span>
                <span>${toPersianNum(u.hours || 0)} ساعت</span>
                <span>سطح ${toPersianNum(u.level || 1)}</span>
              </div>
            </div>
          </div>
        `;
      }
    } else {
      membersHtml = '<div style="text-align:center; color:rgba(255,255,255,0.6); padding:20px;">عضوی یافت نشد</div>';
    }

    list.innerHTML = membersHtml;
  }

  async function refreshLeaderboard() {
    playClick();
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    await loadLeaderboard();
    btn.classList.remove('spinning');
    showToast('رتبه‌بندی به‌روز شد');
  }

  function goBack() {
    playClick();
    window.location.href = 'Safe Asli Bazi.html';
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const loggedIn = localStorage.getItem('currentLoggedInUser');
    if (!loggedIn) {
      showToast('ابتدا وارد شوید', 'error');
      setTimeout(() => window.location.href = 'index.html', 1500);
      return;
    }

    try {
      const userInfo = JSON.parse(loggedIn);
      currentUserPhone = userInfo.phone;

      const groups = await getGroups();
      currentUserGroup = groups.find(g => g.members && g.members.includes(currentUserPhone)) || null;

      await loadLeaderboard();
      updateTimer();

      setInterval(updateTimer, 1000);
      
      setInterval(async () => {
        if (document.visibilityState === 'visible') {
          await loadLeaderboard();
          await updateTimer();
        }
      }, 10000);

    } catch (e) {
      showToast('خطا در بارگذاری', 'error');
      console.error(e);
    }
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      await loadLeaderboard();
      await updateTimer();
    }
  });
</script>

</body>
</html>
