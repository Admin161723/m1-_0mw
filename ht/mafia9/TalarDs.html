<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست مایک</title>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
<style>
  body { 
    background: #0d2135; 
    color: white; 
    font-family: Tahoma; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding: 20px;
  }
  .mic-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    background: #333;
    color: white;
    font-size: 30px;
    cursor: pointer;
    margin: 20px;
  }
  .mic-btn.active {
    background: #4CAF50;
    box-shadow: 0 0 20px #4CAF50;
  }
  .status {
    margin-top: 20px;
    padding: 10px;
    background: #1a3a5f;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <h1>تست سیستم صوتی</h1>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
  <div class="status" id="status">وضعیت: آماده</div>
  <div id="log" style="margin-top:20px; max-width:400px; word-break:break-all;"></div>

<script>
  let agoraClient = null;
  let localAudioTrack = null;
  let isMicOn = false;
  const APP_ID = "562fb91f42ae4cfc8490c54e4db1fa46";
  
  function log(msg) {
    document.getElementById('log').innerHTML += '<br>' + msg;
    console.log(msg);
  }

  async function toggleMic() {
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    
    try {
      if (!agoraClient) {
        log('در حال اتصال به Agora...');
        status.textContent = 'وضعیت: در حال اتصال...';
        
        agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        await agoraClient.join(APP_ID, "test_room", null, "test_user");
        log('متصل شد!');
      }
      
      if (!localAudioTrack) {
        log('در حال فعال‌سازی مایک...');
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        await agoraClient.publish(localAudioTrack);
        isMicOn = true;
        btn.classList.add('active');
        status.textContent = 'وضعیت: مایکروفون باز ✅';
        log('مایکروفون فعال شد');
      } else {
        isMicOn = !isMicOn;
        await localAudioTrack.setMuted(!isMicOn);
        
        if (isMicOn) {
          btn.classList.add('active');
          status.textContent = 'وضعیت: مایکروفون باز ✅';
          log('مایکروفون باز شد');
        } else {
          btn.classList.remove('active');
          status.textContent = 'وضعیت: مایکروفون بسته 🔇';
          log('مایکروفون بسته شد');
        }
      }
    } catch (err) {
      log('خطا: ' + err.message);
      status.textContent = 'وضعیت: خطا - ' + err.message;
      console.error(err);
    }
  }
  
  log('صفحه لود شد. روی دکمه مایک کلیک کن...');
</script>
</body>
</html>
