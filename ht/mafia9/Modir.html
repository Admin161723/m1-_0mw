/* ============================================================ */
/*  localStorage Cache                                            */
/* ============================================================ */
function saveCache(users) {
  try {
    const trimmed = {};
    for (const phone in users) {
      const u = users[phone];
      if (!u) continue;
      if (!u.rank || !MANAGEMENT_ROLES.includes(u.rank.trim())) continue;
      trimmed[phone] = {
        name: u.name || '',
        rank: u.rank || '',
        avatar: u.avatar || '',
        exclusiveAvatar: u.exclusiveAvatar || '',
        useExclusive: u.useExclusive === true,
        currentTemplate: u.currentTemplate || '',
        lastUpdatedAt: u.lastUpdatedAt || 0
      };
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify({ users: trimmed, savedAt: Date.now() }));
  } catch(e) {
    try { localStorage.removeItem(CACHE_KEY); } catch(e2) {}
  }
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.users) return null;
    if (parsed.savedAt && (Date.now() - parsed.savedAt) > CACHE_MAX_AGE) {
      localStorage.removeItem(CACHE_KEY);
      return null;
    }
    return parsed.users;
  } catch(e) { return null; }
}

/* ============================================================ */
/*  srcHash                                                       */
/* ============================================================ */
function srcHash(s) {
  if (!s || typeof s !== 'string') return '0_0';
  const len = s.length;
  if (len < 500) {
    let h = 0;
    for (let i = 0; i < len; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h & h; }
    return h + '_' + len;
  }
  let h = 0;
  for (let i = 0; i < 300; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h & h; }
  for (let i = Math.max(0, len - 300); i < len; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h = h & h; }
  return h + '_' + len;
}

let fbDb = null;
let fbReady = false;

function initFirebase() {
  try {
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    fbDb = firebase.database();
    fbReady = true;
    setupRealtimeListeners();
    return true;
  } catch(e) { return false; }
}

function setupRealtimeListeners() {
  if (!fbReady || !fbDb) return;

  try {
    var userUpdatesRef = fbDb.ref('user_updates');
    var handler = function(snap) {
      var val = snap.val();
      if (!val || !val.at) return;
      if (Date.now() - val.at > 120000) return;
      forceReload();
    };
    userUpdatesRef.on('child_added', handler);
    userUpdatesRef.on('child_changed', handler);
  } catch(e) {}

  try {
    fbDb.ref('signals').on('child_added', function(userSnap) {
      userSnap.ref.limitToLast(2).on('child_added', function(sigSnap) {
        var sig = sigSnap.val();
        if (!sig) return;
        if (Date.now() - (sig.time || 0) > 120000) return;
        var types = ['admin_edit','user_updated','banned','unbanned','codes_reset',
                     'force_refresh','user_banned','updated','prize_received',
                     'deleted','force_login','force_logout'];
        if (types.indexOf(sig.type) > -1) forceReload();
      });
    });
  } catch(e) {}
}

function forceReload() {
  __lastRenderedKey = '';
  fetchAndRender();
}

/* ============================================================ */
/*  Redis                                                         */
/* ============================================================ */
async function upstashGet(url, token, k) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 6000);
    const r = await fetch(url + '/get/' + encodeURIComponent(k), {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: c.signal, cache: 'no-store'
    });
    clearTimeout(t);
    if (!r.ok) return null;
    const d = await r.json();
    if (d && d.result) { try { return JSON.parse(d.result); } catch (e) { return d.result; } }
    return null;
  } catch (e) { throw e; }
}

async function getAllUsers() {
  const results = await Promise.allSettled([
    upstashGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, 'all_users'),
    upstashGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, 'all_users')
  ]);

  const v1 = results[0].status === 'fulfilled' ? results[0].value : null;
  const v2 = results[1].status === 'fulfilled' ? results[1].value : null;

  if (results[0].status === 'rejected' && results[1].status === 'rejected') {
    throw new Error('Network error');
  }

  const merged = {};
  let hasAnyData = false;

  if (v1 && typeof v1 === 'object') {
    for (const k in v1) if (v1[k]) { merged[k] = v1[k]; hasAnyData = true; }
  }
  if (v2 && typeof v2 === 'object') {
    for (const k in v2) {
      if (!merged[k]) { merged[k] = v2[k]; hasAnyData = true; continue; }
      const t1 = merged[k].lastUpdatedAt || 0;
      const t2 = v2[k].lastUpdatedAt || 0;
      if (t2 > t1) merged[k] = v2[k];
    }
  }

  if (!hasAnyData && !v1 && !v2) return null;
  return merged;
}

/* ============================================================ */
/*  Helpers                                                       */
/* ============================================================ */
function isVideoSrc(src) {
  if (!src || typeof src !== 'string') return false;
  if (src.indexOf('data:video') === 0) return true;
  if (src.indexOf('blob:') === 0) return true;
  const lower = src.toLowerCase();
  return lower.indexOf('.webm') > -1 || lower.indexOf('.mp4') > -1 ||
         lower.indexOf('.mov') > -1 || lower.indexOf('.ogg') > -1 ||
         lower.indexOf('.m4v') > -1;
}

function getDisplayAvatar(phone, userData) {
  if (userData.exclusiveAvatar && userData.useExclusive === true) return userData.exclusiveAvatar;
  if (userData.avatar) return userData.avatar;
  return 'Mafia2.png';
}

function getAvatarFrame(userData) {
  return userData.currentTemplate || null;
}

function applyTick(img, cands) {
  if (!img || !cands || !cands.length) return;
  let i = 0;
  (function nx() {
    if (i >= cands.length) { img.style.display = 'none'; return; }
    const s = cands[i++];
    const t = new Image();
    t.onload = function() { img.src = s; img.style.display = 'inline-block'; };
    t.onerror = nx;
    t.src = s;
  })();
}

function createAvatarElement(src) {
  if (!src) src = 'Mafia2.png';
  if (isVideoSrc(src)) {
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.autoplay = true;
    v.loop = true;
    v.setAttribute('muted', 'muted');
    v.setAttribute('playsinline', 'playsinline');
    v.setAttribute('webkit-playsinline', 'webkit-playsinline');
    v.setAttribute('autoplay', '');
    v.setAttribute('loop', '');
    v.setAttribute('preload', 'auto');
    v.src = src;
    try { v.load(); } catch(e) {}
    try { const p = v.play(); if (p && p.catch) p.catch(function(){}); } catch(e) {}
    return v;
  }
  const img = document.createElement('img');
  img.src = src;
  img.onerror = function() { this.style.display = 'none'; };
  return img;
}

function destroyAvatarElement(el) {
  if (!el) return;
  try {
    if (el.tagName === 'VIDEO') {
      el.pause();
      el.removeAttribute('src');
      try { el.load(); } catch(e) {}
    }
  } catch(e) {}
  try { if (el.parentNode) el.parentNode.removeChild(el); } catch(e) {}
}

/*  ساخت و به‌روزرسانی کارت                                        */
/* ============================================================ */
function buildMemberCard(phone, userData) {
  const card = document.createElement('div');
  card.className = 'member-card';
  card.dataset.phone = phone;

  const cardTplWrap = document.createElement('div');
  cardTplWrap.className = 'card-template';
  const cardTplImg = document.createElement('img');
  cardTplImg.src = getCardTemplate(userData.rank);
  cardTplImg.onerror = function() { this.style.display = 'none'; };
  cardTplWrap.appendChild(cardTplImg);
  card.appendChild(cardTplWrap);

  const avatarContainer = document.createElement('div');
  avatarContainer.className = 'avatar-container';

  const avatarCircle = document.createElement('div');
  avatarCircle.className = 'avatar-circle';
  const avatarSrc = getDisplayAvatar(phone, userData);
  avatarCircle.dataset.avatarHash = srcHash(avatarSrc);
  avatarCircle.appendChild(createAvatarElement(avatarSrc));
  avatarContainer.appendChild(avatarCircle);

  const frameSrc = getAvatarFrame(userData);
  if (frameSrc) {
    const frameImg = document.createElement('img');
    frameImg.className = 'avatar-frame';
    frameImg.src = frameSrc;
    frameImg.alt = '';
    frameImg.onerror = function() { this.style.display = 'none'; };
    avatarContainer.appendChild(frameImg);
  }
  card.appendChild(avatarContainer);

  const infoDiv = document.createElement('div');
  infoDiv.className = 'member-info';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'member-name';
  nameDiv.appendChild(document.createTextNode(userData.name || 'کاربر'));

  const roleKey = (userData.rank || '').trim();
  const tickCandidates = ROLE_TICK_MAP[roleKey];
  if (tickCandidates && tickCandidates.length) {
    const tickImg = document.createElement('img');
    tickImg.className = 'role-tick';
    tickImg.alt = '';
    tickImg.src = '';
    nameDiv.appendChild(tickImg);
    applyTick(tickImg, tickCandidates);
  }
  infoDiv.appendChild(nameDiv);

  const roleDiv = document.createElement('div');
  roleDiv.className = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
  roleDiv.textContent = userData.rank || 'کاربر';
  infoDiv.appendChild(roleDiv);

  card.appendChild(infoDiv);
  return card;
}

function updateCardInPlace(card, userData) {
  const phone = card.dataset.phone;

  const cardTplImg = card.querySelector('.card-template img');
  const newCardTpl = getCardTemplate(userData.rank);
  if (cardTplImg) {
    const currentSrc = cardTplImg.getAttribute('src') || '';
    if (!currentSrc.endsWith(newCardTpl)) {
      cardTplImg.src = newCardTpl;
      cardTplImg.style.display = '';
    }
  }

  const avatarCircle = card.querySelector('.avatar-circle');
  const newAvatarSrc = getDisplayAvatar(phone, userData);
  const newHash = srcHash(newAvatarSrc);
  if (avatarCircle) {
    const currentHash = avatarCircle.dataset.avatarHash || '0_0';
    if (currentHash !== newHash) {
      const oldEl = avatarCircle.firstElementChild;
      destroyAvatarElement(oldEl);
      while (avatarCircle.firstChild) {
        try { avatarCircle.removeChild(avatarCircle.firstChild); } catch(e) { break; }
      }
      avatarCircle.dataset.avatarHash = newHash;
      avatarCircle.appendChild(createAvatarElement(newAvatarSrc));
    }
  }

  const avatarContainer = card.querySelector('.avatar-container');
  if (avatarContainer) {
    let frameImg = avatarContainer.querySelector('.avatar-frame');
    const newFrame = getAvatarFrame(userData);
    if (newFrame) {
      if (!frameImg) {
        frameImg = document.createElement('img');
        frameImg.className = 'avatar-frame';
        frameImg.alt = '';
        frameImg.onerror = function() { this.style.display = 'none'; };
        avatarContainer.appendChild(frameImg);
      }
      const currentFrameSrc = frameImg.getAttribute('src') || '';
      if (currentFrameSrc !== newFrame) {
        frameImg.style.display = '';
        frameImg.src = newFrame;
      }
    } else {
      if (frameImg) frameImg.remove();
    }
  }

  const nameDiv = card.querySelector('.member-name');
  if (nameDiv) {
    const roleKey = (userData.rank || '').trim();
    const currentName = nameDiv.firstChild ? nameDiv.firstChild.nodeValue : '';
    const newName = userData.name || 'کاربر';
    if (currentName !== newName) {
      while (nameDiv.firstChild) nameDiv.removeChild(nameDiv.firstChild);
      nameDiv.appendChild(document.createTextNode(newName));
      const tickCandidates = ROLE_TICK_MAP[roleKey];
      if (tickCandidates && tickCandidates.length) {
        const tickImg = document.createElement('img');
        tickImg.className = 'role-tick';
        tickImg.alt = '';
        tickImg.src = '';
        nameDiv.appendChild(tickImg);
        applyTick(tickImg, tickCandidates);
      }
    }
  }

  const roleDiv = card.querySelector('.member-role');
  if (roleDiv) {
    const roleKey = (userData.rank || '').trim();
    const newRoleText = userData.rank || 'کاربر';
    const newRoleClass = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
    if (roleDiv.textContent !== newRoleText) roleDiv.textContent = newRoleText;
    if (roleDiv.className !== newRoleClass) roleDiv.className = newRoleClass;
  }
}

let __lastRenderedKey = '';
let __hasRendered = false;

function renderTeam(users) {
  const grid = document.getElementById('managementGrid');
  if (!grid) return;
  if (!users || typeof users !== 'object') return;

  const entries = Object.entries(users);
  const managementUsers = entries.filter(([p, u]) =>
    u && u.rank && MANAGEMENT_ROLES.includes(u.rank.trim())
  );

  managementUsers.sort((a, b) => {
    const rA = ROLE_ORDER[(a[1].rank || '').trim()] ?? 99;
    const rB = ROLE_ORDER[(b[1].rank || '').trim()] ?? 99;
    return rA - rB;
  });

  if (managementUsers.length === 0) {
    if (grid.querySelector('.member-card')) return;
    if (__lastRenderedKey !== '__empty__') {
      grid.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <div>هنوز عضوی در تیم مدیریت وجود ندارد</div>
        </div>`;
      __lastRenderedKey = '__empty__';
    }
    return;
  }

  const key = managementUsers.map(([p, u]) =>
    p + '@' + (u.rank || '') + '@' + (u.name || '') + '@' +
    srcHash(u.avatar || '') + '@' + srcHash(u.exclusiveAvatar || '') + '@' +
    (u.useExclusive ? '1' : '0') + '@' + (u.currentTemplate || '')
  ).join('||');

  if (key === __lastRenderedKey) return;
  __lastRenderedKey = key;
  __hasRendered = true;

  const emptyEl = grid.querySelector('.empty-state');
  if (emptyEl) emptyEl.remove();

  const existingCards = {};
  grid.querySelectorAll('.member-card').forEach(c => { existingCards[c.dataset.phone] = c; });
  const newPhones = managementUsers.map(([p]) => p);

  Object.keys(existingCards).forEach(phone => {
    if (!newPhones.includes(phone)) {
      const circle = existingCards[phone].querySelector('.avatar-circle');
      if (circle) destroyAvatarElement(circle.firstElementChild);
      existingCards[phone].remove();
      delete existingCards[phone];
    }
  });

  let lastCard = null;
  managementUsers.forEach(([phone, user]) => {
    let card = existingCards[phone];
    if (card) {
      updateCardInPlace(card, user);
    } else {
      card = buildMemberCard(phone, user);
    }
    if (lastCard) {
      if (lastCard.nextSibling !== card) grid.insertBefore(card, lastCard.nextSibling);
    } else {
      if (grid.firstChild !== card) grid.insertBefore(card, grid.firstChild);
    }
    lastCard = card;
  });
}

/* ============================================================ */
/*  fetch + render                                                */
/* ============================================================ */
async function fetchAndRender() {
  // ⚠️ اگه آفلاینیم، fetch نکن (offline-guard خودش overlay رو نشون می‌ده)
  if (isOffline()) return;

  let users = null;
  try {
    users = await getAllUsers();
  } catch(e) {
    // خطای شبکه - offline-guard خودش مدیریت می‌کنه
    return;
  }

  if (users && typeof users === 'object' && Object.keys(users).length > 0) {
    renderTeam(users);
    saveCache(users);
  } else {
    if (!__hasRendered) {
      const grid = document.getElementById('managementGrid');
      if (grid && !grid.querySelector('.member-card')) {
        grid.innerHTML = `<div class="empty-state"><div>اتصال برقرار نشد. لطفاً صفحه را رفرش کنید</div></div>`;
      }
    }
  }
}

/* ============================================================ */
/*  Boot                                                          */
/* ============================================================ */
async function boot() {
  // ═══ 1) کش فوری ═══
  const cached = loadCache();
  if (cached && Object.keys(cached).length > 0) {
    renderTeam(cached);
  }

  // ═══ 2) Firebase ═══
  initFirebase();

  // ═══ 3) fetch از Redis ═══
  await fetchAndRender();

  // ═══ 4) polling پشتیبان ═══
  setInterval(() => {
    if (!isOffline()) {
      fetchAndRender();
    }
  }, 5000);

  // ═══ 5) وقتی از آفلاین درومدیم، رفرش کن ═══
  window.addEventListener('online', () => {
    setTimeout(() => {
      __lastRenderedKey = '';
      fetchAndRender();
    }, 500);
  });
}

function playClickSound() {
  try {
    const s = document.getElementById('clickSound');
    if (s) { s.currentTime = 0; s.volume = 0.3; s.play().catch(() => {}); }
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      playClickSound();
      if (document.referrer && document.referrer.indexOf('Safe') > -1) {
        window.history.back();
      } else {
        window.location.href = 'Safe Asli Bazi.html';
      }
    });
  }

  boot();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (!isOffline()) {
        fetchAndRender();
      }
    }
  });

  window.addEventListener('load', () => {
    setTimeout(() => { if (!fbReady) initFirebase(); }, 500);
  });
});

window.addEventListener('focus', () => {
  if (!isOffline()) {
    fetchAndRender();
  }
});
</script>
