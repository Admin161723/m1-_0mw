  .bg-image{position:fixed;inset:0;background-image:url('53.jpg');background-size:cover;background-position:center;z-index:-1;}
  .bg-image::after{content:'';position:absolute;inset:0;background:rgba(4,18,40,0.75);}

  .card-template{
    width:100%;

    aspect-ratio:3/4;
    overflow:hidden;
    background:linear-gradient(180deg,#1e4a8a,#12356a);
  }
  .card-template img{
    position:absolute;

    height:108%;

    pointer-events:none;

  .avatar-container{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:88px;height:88px;z-index:10;pointer-events:none;}
  .avatar-circle{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:3px solid rgba(255,255,255,0.9);overflow:hidden;background:#1a3a6a;box-shadow:0 4px 15px rgba(0,0,0,.5);z-index:1;}
  .avatar-circle img,.avatar-circle video{width:100%;height:100%;object-fit:cover;}
  .avatar-frame{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:5;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));}

  .member-info{position:absolute;bottom:0;left:0;right:0;padding:40px 8px 12px;text-align:center;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0.85) 40%,rgba(0,0,0,0.95) 100%);z-index:5;}
  .member-name{color:#fff;font-size:13px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 4px rgba(0,0,0,0.9);flex-wrap:wrap;}
  .member-role{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:0.5px;}

  .role-creator{background:linear-gradient(180deg,#ffd700,#ff8c00);color:#000;}
  .role-support{background:linear-gradient(180deg,#4a9eff,#2a7acc);color:#fff;}
  .role-supervisor{background:linear-gradient(180deg,#9c27b0,#7b1fa2);color:#fff;}
  .role-admin-senior{background:linear-gradient(180deg,#e91e63,#c2185b);color:#fff;}
  .role-admin{background:linear-gradient(180deg,#f44336,#d32f2f);color:#fff;}
  .role-observer-senior{background:linear-gradient(180deg,#00bcd4,#0097a7);color:#fff;}
  .role-observer{background:linear-gradient(180deg,#4caf50,#388e3c);color:#fff;}

  .role-tick{width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8));}

  .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.6);font-size:14px;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:15px;}
  .empty-icon{width:60px;height:60px;fill:rgba(255,255,255,0.3);}

  @media (max-width:768px){
    .management-grid{grid-template-columns:repeat(3,1fr);gap:12px;padding:15px;}
    .avatar-container{width:74px;height:74px;top:6%;}
    .avatar-circle{width:54px;height:54px;top:10px;border-width:2.5px;}

    .member-role{font-size:9px;padding:2px 8px;}
    .header h1{font-size:18px;}
    .role-tick{width:14px;height:14px;}
  }
</style>

/* ============================================================ */
/*  Firebase - اتصال زنده                                         */
/* ============================================================ */
let fbDb = null;
let fbReady = false;

function initFirebase() {
  try {
    if (typeof firebase === 'undefined') {
      console.warn('Firebase SDK not loaded');
      return false;
    }
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    fbDb = firebase.database();
    fbReady = true;
    setupRealtimeListeners();
    return true;
  } catch(e) {
    console.error('Firebase init error:', e);
    return false;
  }
}

function setupRealtimeListeners() {
  if (!fbReady || !fbDb) return;

  // ═══ 1) گوش دادن به user_updates (هر تغییر کاربر) ═══
  try {
    fbDb.ref('user_updates').on('value', function(snap) {
      // debounce برای جلوگیری از چند بار رفرش
      if (window.__updateDebounce) clearTimeout(window.__updateDebounce);
      window.__updateDebounce = setTimeout(() => {
        forceReload();
      }, 150);
    });
  } catch(e) { console.warn('user_updates listener error:', e); }

  // ═══ 2) گوش دادن به signals/global ═══
  try {
    fbDb.ref('signals/global').limitToLast(3).on('child_added', function(snap) {
      const sig = snap.val();
      if (!sig) return;
      const age = Date.now() - (sig.time || 0);
      if (age > 60000) return; // قدیمی‌تر از ۱ دقیقه رد کن
      const types = ['admin_edit','user_updated','banned','unbanned','codes_reset','force_refresh','user_banned'];
      if (types.includes(sig.type)) {
        forceReload();
      }
    });
  } catch(e) { console.warn('signals listener error:', e); }

  // ═══ 3) گوش دادن به signals/user_* (برای همه مقام‌دارها) ═══
  // از اونجایی که همه کاربران رو نمی‌شناسیم، به کل نود signals گوش می‌دیم
  // ولی این می‌تونه سنگین باشه. پس فقط به user_updates اتکا می‌کنیم.
  // (بالاتر پوشش داده شد)

  console.log('✅ Firebase realtime listeners active');
}

function forceReload() {

}

/* ============================================================ */
/*  Redis                                                         */
/* ============================================================ */
async function upstashGet(url, token, k) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 6000);
    const r = await fetch(url + '/get/' + encodeURIComponent(k), {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: c.signal, cache: 'no-store'
    });
    clearTimeout(t);
    if (!r.ok) return null;
    const d = await r.json();
    if (d && d.result) {
      try { return JSON.parse(d.result); } catch (e) { return d.result; }
    }
    return null;
  } catch (e) { return null; }
}

async function getAllUsers() {
  const results = await Promise.allSettled([
    upstashGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, 'all_users'),
    upstashGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, 'all_users')
  ]);

  const v1 = results[0].status === 'fulfilled' ? results[0].value : null;
  const v2 = results[1].status === 'fulfilled' ? results[1].value : null;

  const merged = {};
  let hasAnyData = false;

  if (v1 && typeof v1 === 'object') {
    for (const k in v1) if (v1[k]) { merged[k] = v1[k]; hasAnyData = true; }
  }
  if (v2 && typeof v2 === 'object') {
    for (const k in v2) {
      if (!merged[k]) {
        merged[k] = v2[k];
        hasAnyData = true;
        continue;
      }
      const t1 = merged[k].lastUpdatedAt || 0;
      const t2 = v2[k].lastUpdatedAt || 0;
      if (t2 > t1) merged[k] = v2[k];
    }
  }

  // اگر هیچ دیتایی نیومد، null برگردون (نه آبجکت خالی)
  if (!hasAnyData && !v1 && !v2) return null;
  return merged;
}

/* ============================================================ */
/*  Helpers                                                       */
/* ============================================================ */
function isVideoSrc(src) {
  if (!src || typeof src !== 'string') return false;
  if (src.indexOf('data:video') === 0) return true;
  if (src.indexOf('blob:') === 0) return true;
  const lower = src.toLowerCase();
  return lower.indexOf('.webm') > -1 || lower.indexOf('.mp4') > -1 ||
         lower.indexOf('.mov') > -1 || lower.indexOf('.ogg') > -1 ||
         lower.indexOf('.m4v') > -1;
}

function normalizeUrl(url) {
  if (!url) return '';
  if (typeof url !== 'string') return '';
  if (url.startsWith('data:') || url.startsWith('blob:')) return url;
  try {
    const u = new URL(url, location.href);
    return u.pathname + u.search;
  } catch(e) { return url; }
}

function sameSrc(a, b) {
  return normalizeUrl(a) === normalizeUrl(b);
}

function getDisplayAvatar(phone, userData) {
  if (userData.exclusiveAvatar && userData.useExclusive === true) return userData.exclusiveAvatar;
  if (userData.avatar) return userData.avatar;
  return 'Mafia2.png';
}

function getAvatarFrame(userData) {
  return userData.currentTemplate || null;
}

function applyTick(img, cands) {
  if (!img || !cands || !cands.length) return;
  let i = 0;
  (function nx() {
    if (i >= cands.length) { img.style.display = 'none'; return; }
    const s = cands[i++];
    const t = new Image();
    t.onload = function() { img.src = s; img.style.display = 'inline-block'; };
    t.onerror = nx;
    t.src = s;
  })();
}

function createAvatarElement(src) {
  if (!src) src = 'Mafia2.png';
  if (isVideoSrc(src)) {
    const v = document.createElement('video');
    v.src = src;
    v.autoplay = true;
    v.loop = true;
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('muted', 'muted');
    v.setAttribute('playsinline', 'playsinline');
    v.setAttribute('webkit-playsinline', 'webkit-playsinline');
    v.setAttribute('preload', 'auto');
    return v;
  }
  const img = document.createElement('img');
  img.src = src;
  img.onerror = function() { this.style.display = 'none'; };
  return img;
}

/* ============================================================ */
/*  ساخت کارت                                                     */
/* ============================================================ */
function buildMemberCard(phone, userData) {
  const card = document.createElement('div');
  card.className = 'member-card';
  card.dataset.phone = phone;

  // قالب کارت
  const cardTplWrap = document.createElement('div');
  cardTplWrap.className = 'card-template';
  const cardTplImg = document.createElement('img');
  cardTplImg.src = getCardTemplate(userData.rank);
  cardTplImg.onerror = function() { this.style.display = 'none'; };
  cardTplWrap.appendChild(cardTplImg);
  card.appendChild(cardTplWrap);

  // کانتینر آواتار
  const avatarContainer = document.createElement('div');
  avatarContainer.className = 'avatar-container';

  const avatarCircle = document.createElement('div');
  avatarCircle.className = 'avatar-circle';
  avatarCircle.appendChild(createAvatarElement(getDisplayAvatar(phone, userData)));
  avatarContainer.appendChild(avatarCircle);

  const frameSrc = getAvatarFrame(userData);
  if (frameSrc) {
    const frameImg = document.createElement('img');
    frameImg.className = 'avatar-frame';
    frameImg.src = frameSrc;
    frameImg.alt = '';
    frameImg.onerror = function() { this.style.display = 'none'; };
    avatarContainer.appendChild(frameImg);
  }
  card.appendChild(avatarContainer);

  // اطلاعات
  const infoDiv = document.createElement('div');
  infoDiv.className = 'member-info';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'member-name';
  nameDiv.appendChild(document.createTextNode(userData.name || 'کاربر'));

  const roleKey = (userData.rank || '').trim();
  const tickCandidates = ROLE_TICK_MAP[roleKey];
  if (tickCandidates && tickCandidates.length) {
    const tickImg = document.createElement('img');
    tickImg.className = 'role-tick';
    tickImg.alt = '';
    tickImg.src = '';
    nameDiv.appendChild(tickImg);
    applyTick(tickImg, tickCandidates);
  }
  infoDiv.appendChild(nameDiv);

  const roleDiv = document.createElement('div');
  roleDiv.className = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
  roleDiv.textContent = userData.rank || 'کاربر';
  infoDiv.appendChild(roleDiv);

  card.appendChild(infoDiv);
  return card;
}

/* ============================================================ */
/*  به‌روزرسانی درجا                                               */
/* ============================================================ */
function updateCardInPlace(card, userData) {
  const phone = card.dataset.phone;

  // قالب کارت
  const cardTplImg = card.querySelector('.card-template img');
  const newCardTpl = getCardTemplate(userData.rank);
  if (cardTplImg && !sameSrc(cardTplImg.getAttribute('src'), newCardTpl)) {
    cardTplImg.src = newCardTpl;
  }

  // آواتار
  const avatarCircle = card.querySelector('.avatar-circle');
  const newAvatarSrc = getDisplayAvatar(phone, userData);
  if (avatarCircle) {
    const currentEl = avatarCircle.firstElementChild;
    const currentSrc = currentEl ? currentEl.getAttribute('src') : null;
    const newIsVideo = isVideoSrc(newAvatarSrc);
    const currentIsVideo = currentEl && currentEl.tagName === 'VIDEO';

    if (!sameSrc(currentSrc, newAvatarSrc) || newIsVideo !== currentIsVideo) {
      // پاک کردن و ساخت جدید
      while (avatarCircle.firstChild) avatarCircle.removeChild(avatarCircle.firstChild);
      avatarCircle.appendChild(createAvatarElement(newAvatarSrc));
    }
  }

  // قالب دور آواتار
  const avatarContainer = card.querySelector('.avatar-container');
  if (avatarContainer) {
    let frameImg = avatarContainer.querySelector('.avatar-frame');
    const newFrame = getAvatarFrame(userData);
    if (newFrame) {
      if (!frameImg) {
        frameImg = document.createElement('img');
        frameImg.className = 'avatar-frame';
        frameImg.alt = '';
        frameImg.onerror = function() { this.style.display = 'none'; };
        avatarContainer.appendChild(frameImg);
      }
      if (!sameSrc(frameImg.getAttribute('src'), newFrame)) {
        frameImg.style.display = '';
        frameImg.src = newFrame;
      }
    } else {
      if (frameImg) frameImg.remove();
    }
  }

  // نام + تیک
  const nameDiv = card.querySelector('.member-name');
  if (nameDiv) {
    const roleKey = (userData.rank || '').trim();
    const currentName = nameDiv.firstChild ? nameDiv.firstChild.nodeValue : '';
    const newName = userData.name || 'کاربر';
    // فقط اگر تغییر کرده، دوباره بساز
    if (currentName !== newName) {
      while (nameDiv.firstChild) nameDiv.removeChild(nameDiv.firstChild);
      nameDiv.appendChild(document.createTextNode(newName));
      const tickCandidates = ROLE_TICK_MAP[roleKey];
      if (tickCandidates && tickCandidates.length) {
        const tickImg = document.createElement('img');
        tickImg.className = 'role-tick';
        tickImg.alt = '';
        tickImg.src = '';
        nameDiv.appendChild(tickImg);
        applyTick(tickImg, tickCandidates);
      }
    }
  }

  // مقام
  const roleDiv = card.querySelector('.member-role');
  if (roleDiv) {
    const roleKey = (userData.rank || '').trim();
    const newRoleText = userData.rank || 'کاربر';
    const newRoleClass = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
    if (roleDiv.textContent !== newRoleText) roleDiv.textContent = newRoleText;
    if (roleDiv.className !== newRoleClass) roleDiv.className = newRoleClass;
  }
}

/* ============================================================ */
/*  بارگذاری تیم - با محافظت از داده                                  */
/* ============================================================ */
let __lastRenderedKey = '';
let __hasSuccessfullyLoaded = false;
let __lastGoodUsers = null;
let __consecutiveFails = 0;

async function loadManagementTeam() {
  const grid = document.getElementById('managementGrid');
  if (!grid) return;

  let users = null;
  try {
    users = await getAllUsers();
  } catch(e) {
    users = null;
  }

  // اگر fetch شکست خورد
  if (!users || typeof users !== 'object') {
    __consecutiveFails++;
    // اگر قبلاً داده داشتیم، دست نزن
    if (__hasSuccessfullyLoaded && __lastGoodUsers) {
      users = __lastGoodUsers;
    } else {
      // اولین بار و شکست - صبر کن و دوباره تلاش کن
      if (__consecutiveFails < 3) return;
      // بعد از ۳ بار شکست و بدون داده قبلی، پیام خطا نشون بده
      if (!grid.querySelector('.member-card') && !grid.querySelector('.empty-state')) {
        grid.innerHTML = `<div class="empty-state"><div>اتصال برقرار نشد. لطفاً صفحه را رفرش کنید</div></div>`;
      }
      return;
    }
  } else {
    // fetch موفق
    __consecutiveFails = 0;
    __hasSuccessfullyLoaded = true;
    __lastGoodUsers = users;
  }

  const entries = Object.entries(users);
  const managementUsers = entries.filter(([p, u]) =>
    u && u.rank && MANAGEMENT_ROLES.includes(u.rank.trim())
  );

  // مرتب‌سازی
  managementUsers.sort((a, b) => {
    const rA = ROLE_ORDER[(a[1].rank || '').trim()] ?? 99;
    const rB = ROLE_ORDER[(b[1].rank || '').trim()] ?? 99;
    return rA - rB;
  });

  // ═══ حالت خالی: فقط اگر fetch موفق بود و واقعاً هیچ کاربری نبود ═══
  if (managementUsers.length === 0) {
    // اگر قبلاً کارت داشتیم، نگه‌دار و به‌روز نکن
    if (grid.querySelector('.member-card')) {
      return;
    }
    // اگر هنوز هیچی نداریم و fetch موفق بوده، پیام خالی نشون بده
    if (__lastRenderedKey !== '__empty__') {
      grid.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <div>هنوز عضوی در تیم مدیریت وجود ندارد</div>
        </div>`;
      __lastRenderedKey = '__empty__';
    }
    return;
  }

  // کلید تغییرات
  const key = managementUsers.map(([p, u]) =>
    p + '|' + (u.rank || '') + '|' + (u.name || '') + '|' +
    (u.avatar || '') + '|' + (u.exclusiveAvatar || '') + '|' +
    (u.useExclusive ? '1' : '0') + '|' + (u.currentTemplate || '')
  ).join('||');

  if (key === __lastRenderedKey) return;
  __lastRenderedKey = key;

  // پاک کردن پیام خالی اگه هست
  const emptyEl = grid.querySelector('.empty-state');
  if (emptyEl) emptyEl.remove();

  const existingCards = {};
  grid.querySelectorAll('.member-card').forEach(c => { existingCards[c.dataset.phone] = c; });
  const newPhones = managementUsers.map(([p]) => p);

  // حذف کارت‌های اضافی
  Object.keys(existingCards).forEach(phone => {
    if (!newPhones.includes(phone)) {
      existingCards[phone].remove();
      delete existingCards[phone];
    }
  });

  // اضافه/به‌روزرسانی با حفظ ترتیب
  let lastCard = null;
  managementUsers.forEach(([phone, user]) => {
    let card = existingCards[phone];
    if (card) {
      updateCardInPlace(card, user);
    } else {
      card = buildMemberCard(phone, user);
    }

    // ترتیب درست
    if (lastCard) {
      if (lastCard.nextSibling !== card) {
        grid.insertBefore(card, lastCard.nextSibling);
      }
    } else {
      if (grid.firstChild !== card) {
        grid.insertBefore(card, grid.firstChild);
      }
    }
    lastCard = card;
  });
}

/* ============================================================ */
/*  Polling پشتیبان (اگر Firebase کار نکرد)                        */
/* ============================================================ */
function startPolling() {
  // هر ۴ ثانیه یه بار (کمتر از قبل - چون Firebase زنده هست)
  setInterval(() => {
    if (!fbReady) {
      loadManagementTeam();
    }
  }, 4000);
}

/* ============================================================ */
/*  Play Click Sound                                              */
/* ============================================================ */
function playClickSound() {
  try {
    const s = document.getElementById('clickSound');
    if (s) { s.currentTime = 0; s.volume = 0.3; s.play().catch(() => {}); }
  } catch(e) {}
}

/* ============================================================ */
/*  Boot                                                          */
/* ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      playClickSound();
      if (document.referrer && document.referrer.indexOf('Safe') > -1) {
        window.history.back();
      } else {
        window.location.href = 'Safe Asli Bazi.html';
      }
    });
  }

  // ⚡ بارگذاری فوری اولیه
  loadManagementTeam();

  // ⚡ فعال‌سازی Firebase
  initFirebase();

  // ⚡ polling پشتیبان
  startPolling();

  // ⚡ وقتی کاربر به تب برگشت
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      forceReload();
    }
  });

  // ⚡ اگر Firebase SDK با تأخیر لود شد
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (!fbReady) initFirebase();
    }, 500);
  });
});

window.addEventListener('focus', () => forceReload());
</script>
