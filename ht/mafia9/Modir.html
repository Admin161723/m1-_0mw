<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041228">
<title>تیم مدیریت | بازی پلیس</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;}
  body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#041228;width:100%;min-height:100vh;overflow-x:hidden;}

  .bg-image{position:fixed;inset:0;background-image:url('53.jpg');background-size:cover;background-position:center;z-index:-1;}
  .bg-image::after{content:'';position:absolute;inset:0;background:rgba(4,18,40,0.75);}

  .header{background:linear-gradient(180deg,rgba(30,74,138,.95),rgba(18,53,106,.95));padding:20px 15px;text-align:center;border-bottom:2px solid #2a5a9a;backdrop-filter:blur(10px);}
  .header h1{color:#fff;font-size:22px;font-weight:900;margin-bottom:5px;letter-spacing:-0.5px;}
  .header p{color:rgba(255,255,255,.7);font-size:13px;}

  .back-btn{position:fixed;top:15px;left:15px;width:40px;height:40px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer;z-index:100;transition:all 0.2s;}
  .back-btn:active{background:rgba(255,255,255,.3);transform:scale(0.92);}

  .management-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));gap:15px;padding:20px;max-width:1200px;margin:0 auto;}

  .member-card{position:relative;transition:transform .3s, box-shadow .3s;border-radius:12px;overflow:hidden;}
  .member-card:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,0.5);}

  /* ═══ قالب کارت (پس‌زمینه) ═══ */
  .card-template{width:100%;position:relative;aspect-ratio:3/4;background:#1a3a6a;}
  .card-template img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ═══ کانتینر آواتار (شامل دایره + قالب آواتار) ═══ */
  .avatar-container{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    width:88px;
    height:88px;
    z-index:10;
    pointer-events:none;
  }

  .avatar-circle{
    position:absolute;
    top:11px;
    left:50%;
    transform:translateX(-50%);
    width:66px;
    height:66px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.9);
    overflow:hidden;
    background:#1a3a6a;
    box-shadow:0 4px 15px rgba(0,0,0,.5);
    z-index:1;
  }
  .avatar-circle img,.avatar-circle video{width:100%;height:100%;object-fit:cover;}

  /* ═══ قالب آواتار (روی دایره) ═══ */
  .avatar-frame{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    z-index:5;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }

  .member-info{position:absolute;bottom:0;left:0;right:0;padding:40px 8px 12px;text-align:center;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0.85) 40%,rgba(0,0,0,0.95) 100%);z-index:5;}
  .member-name{color:#fff;font-size:13px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:4px;text-shadow:0 2px 4px rgba(0,0,0,0.9);flex-wrap:wrap;}
  .member-role{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:0.5px;}

  .role-creator{background:linear-gradient(180deg,#ffd700,#ff8c00);color:#000;}
  .role-support{background:linear-gradient(180deg,#4a9eff,#2a7acc);color:#fff;}
  .role-supervisor{background:linear-gradient(180deg,#9c27b0,#7b1fa2);color:#fff;}
  .role-admin-senior{background:linear-gradient(180deg,#e91e63,#c2185b);color:#fff;}
  .role-admin{background:linear-gradient(180deg,#f44336,#d32f2f);color:#fff;}
  .role-observer-senior{background:linear-gradient(180deg,#00bcd4,#0097a7);color:#fff;}
  .role-observer{background:linear-gradient(180deg,#4caf50,#388e3c);color:#fff;}

  .role-tick{width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8));}

  .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.6);font-size:14px;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:15px;}
  .empty-icon{width:60px;height:60px;fill:rgba(255,255,255,0.3);}

  @media (max-width:768px){
    .management-grid{grid-template-columns:repeat(3,1fr);gap:12px;padding:15px;}
    .avatar-container{width:74px;height:74px;top:6%;}
    .avatar-circle{width:54px;height:54px;top:10px;border-width:2.5px;}
    .member-info{padding:35px 6px 10px;}
    .member-name{font-size:11px;}
    .member-role{font-size:9px;padding:2px 8px;}
    .header h1{font-size:18px;}
    .role-tick{width:14px;height:14px;}
  }
</style>
</head>
<body>
<div class="bg-image"></div>
<button class="back-btn" id="backBtn">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>

<div class="header">
  <h1>تیم مدیریت</h1>
  <p>اعضای رسمی تیم مدیریت و پشتیبانی بازی</p>
</div>

<div class="management-grid" id="managementGrid"></div>

<audio id="clickSound" preload="auto">
    <source src="denielcz-immersivecontrol-button-click-sound-463065.mp3" type="audio/mpeg">
</audio>

<script>
/* ============================================================ */
/*  تنظیمات                                                       */
/* ============================================================ */
const UPSTASH_OLD_URL = "https://smooth-werewolf-200782.upstash.io";
const UPSTASH_OLD_TOKEN = "gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA";
const UPSTASH_NEW_URL = "https://holy-hamster-122717.upstash.io";
const UPSTASH_NEW_TOKEN = "gQAAAAAAAd9dAAIgcDFlNmYwM2VkZDJiM2Y0YWI2ODBmNmIyMTZjMmRkMTZmNg";

const CREATOR_PHONE = '09904844031';
const MANAGEMENT_ROLES = ['سازنده','پشتیبانی','گرداننده','ادمین ارشد','ادمین','ناظر ارشد','ناظر'];

/* ═══ قالب کارت (پس‌زمینه) بر اساس مقام ═══ */
function getCardTemplate(role) {
  const r = (role || '').trim();
  if (['سازنده','پشتیبانی','گرداننده'].includes(r)) return '50.webp'; // مدیریت ارشد
  return '51.webp'; // مدیریت عادی
}

/* ═══ تیک بر اساس مقام ═══ */
const ROLE_TICK_MAP = {
  'سازنده': ['Tik1.png'],
  'پشتیبانی': ['Tik1.png'],
  'ادمین ارشد': ['Tik1000.png'],
  'ادمین': ['Tik2.png'],
  'گرداننده': ['Tik3.png'],
  'ناظر ارشد': ['TIK4.png', 'Tik4.png'],
  'ناظر': ['TIK4.png', 'Tik4.png']
};

const ROLE_CLASS_MAP = {
  'سازنده': 'role-creator',
  'پشتیبانی': 'role-support',
  'گرداننده': 'role-supervisor',
  'ادمین ارشد': 'role-admin-senior',
  'ادمین': 'role-admin',
  'ناظر ارشد': 'role-observer-senior',
  'ناظر': 'role-observer'
};

/* ============================================================ */
/*  Redis                                                         */
/* ============================================================ */
async function upstashGet(url, token, k) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 6000);
    const r = await fetch(url + '/get/' + encodeURIComponent(k), {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: c.signal, cache: 'no-store'
    });
    clearTimeout(t);
    if (!r.ok) return null;
    const d = await r.json();
    if (d && d.result) { try { return JSON.parse(d.result); } catch (e) { return d.result; } }
    return null;
  } catch (e) { return null; }
}

async function getAllUsers() {
  let v1 = null, v2 = null;
  try { v1 = await upstashGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, 'all_users'); } catch(e) {}
  try { v2 = await upstashGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, 'all_users'); } catch(e) {}

  const merged = {};
  if (v1 && typeof v1 === 'object') for (const k in v1) if (v1[k]) merged[k] = v1[k];
  if (v2 && typeof v2 === 'object') {
    for (const k in v2) {
      if (!merged[k]) { merged[k] = v2[k]; continue; }
      const t1 = merged[k].lastUpdatedAt || 0;
      const t2 = v2[k].lastUpdatedAt || 0;
      if (t2 > t1) merged[k] = v2[k];
    }
  }
  return merged;
}

/* ============================================================ */
/*  Helpers                                                       */
/* ============================================================ */
function isVideoSrc(src) {
  if (!src || typeof src !== 'string') return false;
  if (src.indexOf('data:video') === 0) return true;
  if (src.indexOf('blob:') === 0) return true;
  const lower = src.toLowerCase();
  return lower.indexOf('.webm') > -1 || lower.indexOf('.mp4') > -1 ||
         lower.indexOf('.mov') > -1 || lower.indexOf('.ogg') > -1 ||
         lower.indexOf('.m4v') > -1;
}

/* ═══ آواتار دقیق ═══ */
function getDisplayAvatar(phone, userData) {
  if (userData.exclusiveAvatar && userData.useExclusive === true) return userData.exclusiveAvatar;
  if (userData.avatar) return userData.avatar;
  return 'Mafia2.png';
}

/* ═══ قالب آواتار (دور آواتار) ═══ */
function getAvatarFrame(userData) {
  return userData.currentTemplate || null;
}

function applyTick(img, cands) {
  if (!img || !cands || !cands.length) return;
  let i = 0;
  (function nx() {
    if (i >= cands.length) { img.style.display = 'none'; return; }
    const s = cands[i++];
    const t = new Image();
    t.onload = function() { img.src = s; img.style.display = 'inline-block'; };
    t.onerror = nx;
    t.src = s;
  })();
}

function createAvatarElement(src) {
  if (!src) src = 'Mafia2.png';
  if (isVideoSrc(src)) {
    const v = document.createElement('video');
    v.src = src;
    v.autoplay = true;
    v.loop = true;
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('muted', 'muted');
    v.setAttribute('playsinline', 'playsinline');
    v.setAttribute('webkit-playsinline', 'webkit-playsinline');
    v.setAttribute('preload', 'auto');
    return v;
  }
  const img = document.createElement('img');
  img.src = src;
  img.onerror = function() { this.style.display = 'none'; };
  return img;
}

/* ============================================================ */
/*  ساخت کارت کامل (قالب کارت + آواتار + قالب آواتار)              */
/* ============================================================ */
function buildMemberCard(phone, userData) {
  const card = document.createElement('div');
  card.className = 'member-card';
  card.dataset.phone = phone;

  // ═══ قالب کارت (پس‌زمینه) ═══
  const cardTemplateWrap = document.createElement('div');
  cardTemplateWrap.className = 'card-template';
  const cardTemplateImg = document.createElement('img');
  cardTemplateImg.src = getCardTemplate(userData.rank);
  cardTemplateImg.onerror = function() {
    this.style.background = 'linear-gradient(180deg,#1e4a8a,#12356a)';
  };
  cardTemplateWrap.appendChild(cardTemplateImg);
  card.appendChild(cardTemplateWrap);

  // ═══ کانتینر آواتار (دایره + قالب دور آواتار) ═══
  const avatarContainer = document.createElement('div');
  avatarContainer.className = 'avatar-container';

  // دایره آواتار
  const avatarCircle = document.createElement('div');
  avatarCircle.className = 'avatar-circle';
  avatarCircle.appendChild(createAvatarElement(getDisplayAvatar(phone, userData)));
  avatarContainer.appendChild(avatarCircle);

  // قالب دور آواتار
  const frameSrc = getAvatarFrame(userData);
  if (frameSrc) {
    const frameImg = document.createElement('img');
    frameImg.className = 'avatar-frame';
    frameImg.src = frameSrc;
    frameImg.alt = '';
    frameImg.onerror = function() { this.style.display = 'none'; };
    avatarContainer.appendChild(frameImg);
  }

  card.appendChild(avatarContainer);

  // ═══ اطلاعات (نام + تیک + مقام) ═══
  const infoDiv = document.createElement('div');
  infoDiv.className = 'member-info';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'member-name';
  nameDiv.appendChild(document.createTextNode(userData.name || 'کاربر'));

  const roleKey = (userData.rank || '').trim();
  const tickCandidates = ROLE_TICK_MAP[roleKey];
  if (tickCandidates && tickCandidates.length) {
    const tickImg = document.createElement('img');
    tickImg.className = 'role-tick';
    tickImg.alt = '';
    tickImg.src = '';
    nameDiv.appendChild(tickImg);
    applyTick(tickImg, tickCandidates);
  }
  infoDiv.appendChild(nameDiv);

  const roleDiv = document.createElement('div');
  roleDiv.className = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
  roleDiv.textContent = userData.rank || 'کاربر';
  infoDiv.appendChild(roleDiv);

  card.appendChild(infoDiv);

  return card;
}

/* ============================================================ */
/*  به‌روزرسانی درجا (بدون flicker)                                */
/* ============================================================ */
function updateCardInPlace(card, userData) {
  const phone = card.dataset.phone;

  // ═══ قالب کارت ═══
  const cardTemplateImg = card.querySelector('.card-template img');
  const newCardTpl = getCardTemplate(userData.rank);
  if (cardTemplateImg && cardTemplateImg.getAttribute('src') !== newCardTpl) {
    cardTemplateImg.src = newCardTpl;
  }

  // ═══ آواتار ═══
  const avatarCircle = card.querySelector('.avatar-circle');
  const newAvatarSrc = getDisplayAvatar(phone, userData);
  if (avatarCircle) {
    const currentEl = avatarCircle.firstElementChild;
    const currentSrc = currentEl ? currentEl.getAttribute('src') : null;
    const newIsVideo = isVideoSrc(newAvatarSrc);
    const currentIsVideo = currentEl && currentEl.tagName === 'VIDEO';
    if (currentSrc !== newAvatarSrc || newIsVideo !== currentIsVideo) {
      avatarCircle.innerHTML = '';
      avatarCircle.appendChild(createAvatarElement(newAvatarSrc));
    }
  }

  // ═══ قالب دور آواتار ═══
  const avatarContainer = card.querySelector('.avatar-container');
  if (avatarContainer) {
    let frameImg = avatarContainer.querySelector('.avatar-frame');
    const newFrame = getAvatarFrame(userData);
    if (newFrame) {
      if (!frameImg) {
        frameImg = document.createElement('img');
        frameImg.className = 'avatar-frame';
        frameImg.alt = '';
        frameImg.onerror = function() { this.style.display = 'none'; };
        avatarContainer.appendChild(frameImg);
      }
      if (frameImg.getAttribute('src') !== newFrame) {
        frameImg.style.display = '';
        frameImg.src = newFrame;
      }
    } else {
      if (frameImg) frameImg.remove();
    }
  }

  // ═══ نام + تیک ═══
  const nameDiv = card.querySelector('.member-name');
  if (nameDiv) {
    const roleKey = (userData.rank || '').trim();
    nameDiv.innerHTML = '';
    nameDiv.appendChild(document.createTextNode(userData.name || 'کاربر'));
    const tickCandidates = ROLE_TICK_MAP[roleKey];
    if (tickCandidates && tickCandidates.length) {
      const tickImg = document.createElement('img');
      tickImg.className = 'role-tick';
      tickImg.alt = '';
      tickImg.src = '';
      nameDiv.appendChild(tickImg);
      applyTick(tickImg, tickCandidates);
    }
  }

  // ═══ مقام ═══
  const roleDiv = card.querySelector('.member-role');
  if (roleDiv) {
    const roleKey = (userData.rank || '').trim();
    roleDiv.className = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
    roleDiv.textContent = userData.rank || 'کاربر';
  }
}

/* ============================================================ */
/*  بارگذاری تیم - بدون لودینگ، سریع                              */
/* ============================================================ */
let __lastRenderedKey = '';

async function loadManagementTeam() {
  const grid = document.getElementById('managementGrid');
  if (!grid) return;

  try {
    const allUsers = await getAllUsers();
    const users = Object.entries(allUsers);

    const managementUsers = users.filter(([p, u]) =>
      u && u.rank && MANAGEMENT_ROLES.includes(u.rank.trim())
    );

    const roleOrder = { 'سازنده':0, 'پشتیبانی':1, 'گرداننده':2, 'ادمین ارشد':3, 'ادمین':4, 'ناظر ارشد':5, 'ناظر':6 };
    managementUsers.sort((a, b) => {
      const rA = roleOrder[(a[1].rank || '').trim()] ?? 99;
      const rB = roleOrder[(b[1].rank || '').trim()] ?? 99;
      return rA - rB;
    });

    if (managementUsers.length === 0) {
      if (__lastRenderedKey !== '__empty__') {
        grid.innerHTML = `
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <div>هنوز عضوی در تیم مدیریت وجود ندارد</div>
          </div>`;
        __lastRenderedKey = '__empty__';
      }
      return;
    }

    // کلید تغییرات (شامل currentTemplate برای قالب آواتار)
    const key = managementUsers.map(([p, u]) =>
      p + '|' + (u.rank || '') + '|' + (u.name || '') + '|' +
      (u.avatar || '') + '|' + (u.exclusiveAvatar || '') + '|' +
      (u.useExclusive ? '1' : '0') + '|' + (u.currentTemplate || '')
    ).join('||');

    if (key === __lastRenderedKey) return;
    __lastRenderedKey = key;

    const existingCards = {};
    grid.querySelectorAll('.member-card').forEach(c => { existingCards[c.dataset.phone] = c; });
    const newPhones = managementUsers.map(([p]) => p);

    Object.keys(existingCards).forEach(phone => {
      if (!newPhones.includes(phone)) {
        existingCards[phone].remove();
        delete existingCards[phone];
      }
    });

    let lastCard = null;
    managementUsers.forEach(([phone, user]) => {
      if (existingCards[phone]) {
        updateCardInPlace(existingCards[phone], user);
        if (lastCard) {
          if (lastCard.nextSibling !== existingCards[phone]) {
            grid.insertBefore(existingCards[phone], lastCard.nextSibling);
          }
        } else {
          if (grid.firstChild !== existingCards[phone]) {
            grid.insertBefore(existingCards[phone], grid.firstChild);
          }
        }
        lastCard = existingCards[phone];
      } else {
        const newCard = buildMemberCard(phone, user);
        if (lastCard) {
          grid.insertBefore(newCard, lastCard.nextSibling);
        } else {
          grid.insertBefore(newCard, grid.firstChild);
        }
        lastCard = newCard;
      }
    });
  } catch (error) {
    console.error('Error:', error);
    if (!grid.querySelector('.member-card')) {
      grid.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <div>خطا در بارگذاری اطلاعات</div>
        </div>`;
    }
  }
}

/* ============================================================ */
/*  مانیتور تغییرات                                                */
/* ============================================================ */
function monitorChanges() {
  if (window.FBLive && window.FBLive.subscribe) {
    try {
      window.FBLive.subscribe('global', function(sig) {
        if (!sig) return;
        const types = ['admin_edit','user_updated','banned','unbanned','codes_reset','force_refresh','user_banned'];
        if (types.includes(sig.type)) {
          __lastRenderedKey = '';
          loadManagementTeam();
        }
      });
    } catch(e) {}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      __lastRenderedKey = '';
      loadManagementTeam();
    }
  });

  setInterval(() => { loadManagementTeam(); }, 3000);
}

function playClickSound() {
  try {
    const s = document.getElementById('clickSound');
    if (s) { s.currentTime = 0; s.volume = 0.3; s.play().catch(() => {}); }
  } catch(e) {}
}

/* ============================================================ */
/*  Boot                                                          */
/* ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      playClickSound();
      if (document.referrer && document.referrer.indexOf('Safe') > -1) {
        window.history.back();
      } else {
        window.location.href = 'Safe Asli Bazi.html';
      }
    });
  }

  loadManagementTeam();
  monitorChanges();
});
</script>
</body>
</html>
