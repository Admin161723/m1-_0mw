<script>
/* ============================================================ */
/*  Config                                                        */
/* ============================================================ */
const UPSTASH_OLD_URL = "https://smooth-werewolf-200782.upstash.io";
const UPSTASH_OLD_TOKEN = "gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA";
const UPSTASH_NEW_URL = "https://holy-hamster-122717.upstash.io";
const UPSTASH_NEW_TOKEN = "gQAAAAAAAd9dAAIgcDFlNmYwM2VkZDJiM2Y0YWI2ODBmNmIyMTZjMmRkMTZmNg";

const MANAGEMENT_ROLES = ['سازنده','پشتیبانی','گرداننده','ادمین ارشد','ادمین','ناظر ارشد','ناظر'];
const REFRESH_INTERVAL = 3000;
const MGMT_LIST_KEY = 'mgmt_list_v1';

const ROLE_TICK_MAP = {
  'سازنده': ['Tik1.png'],
  'پشتیبانی': ['Tik1.png'],
  'ادمین ارشد': ['Tik1000.png'],
  'ادمین': ['Tik2.png'],
  'گرداننده': ['Tik3.png'],
  'ناظر ارشد': ['TIK4.png', 'Tik4.png'],
  'ناظر': ['TIK4.png', 'Tik4.png']
};

const ROLE_CLASS_MAP = {
  'سازنده': 'role-creator',
  'پشتیبانی': 'role-support',
  'گرداننده': 'role-supervisor',
  'ادمین ارشد': 'role-admin-senior',
  'ادمین': 'role-admin',
  'ناظر ارشد': 'role-observer-senior',
  'ناظر': 'role-observer'
};

const ROLE_ORDER = { 'سازنده':0, 'پشتیبانی':1, 'گرداننده':2, 'ادمین ارشد':3, 'ادمین':4, 'ناظر ارشد':5, 'ناظر':6 };

function getCardTemplate(role) {
  const r = (role || '').trim();
  if (['سازنده','پشتیبانی','گرداننده'].includes(r)) return '50.webp';
  return '51.webp';
}

/* ============================================================ */
/*  Offline Detection                                             */
/* ============================================================ */
let __isOffline = false;
let __offlineFailCount = 0;
let __offlineCheckBusy = false;
let __offlineRecoverInterval = null;

function showOfflineOverlay() {
  if (__isOffline) return;
  __isOffline = true;
  const ov = document.getElementById('offlineOv');
  if (ov) ov.classList.add('show');
  document.body.style.overflow = 'hidden';
  startOfflineWatch();
}
function hideOfflineOverlay() {
  if (!__isOffline) return;
  __isOffline = false;
  const ov = document.getElementById('offlineOv');
  if (ov) ov.classList.remove('show');
  document.body.style.overflow = '';
  stopOfflineWatch();
}
function startOfflineWatch() {
  stopOfflineWatch();
  __offlineRecoverInterval = setInterval(async () => {
    const online = await checkRealOnline();
    if (online) { hideOfflineOverlay(); window.location.reload(); }
  }, 1500);
}
function stopOfflineWatch() {
  if (__offlineRecoverInterval) { clearInterval(__offlineRecoverInterval); __offlineRecoverInterval = null; }
}
function checkRealOnline() {
  return new Promise((resolve) => {
    const img = new Image();
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; resolve(false); } }, 3000);
    img.onload = () => { if (!done) { done = true; clearTimeout(timer); resolve(true); } };
    img.onerror = () => { if (!done) { done = true; clearTimeout(timer); resolve(false); } };
    img.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css?_=' + Date.now();
  });
}
async function checkOffline() {
  if (__offlineCheckBusy) return;
  __offlineCheckBusy = true;
  try {
    if (navigator.onLine === true) {
      __offlineFailCount = 0;
      if (__isOffline) hideOfflineOverlay();
      __offlineCheckBusy = false;
      return;
    }
    const really = await checkRealOnline();
    if (really) {
      __offlineFailCount = 0;
      if (__isOffline) hideOfflineOverlay();
    } else {
      __offlineFailCount++;
      if (__offlineFailCount >= 2 && !__isOffline) showOfflineOverlay();
    }
  } catch(e) { __offlineFailCount = 0; }
  __offlineCheckBusy = false;
}
function setupOfflineBtn() {
  const btn = document.getElementById('offlineBtn');
  if (!btn) return;
  btn.onclick = async () => {
    btn.classList.add('loading');
    btn.textContent = 'در حال بررسی...';
    btn.disabled = true;
    const ok = await checkRealOnline();
    if (ok) window.location.reload();
    else {
      btn.classList.remove('loading');
      btn.textContent = 'تلاش مجدد';
      btn.disabled = false;
    }
  };
}
window.addEventListener('offline', () => { setTimeout(checkOffline, 500); });
window.addEventListener('online', async () => {
  const really = await checkRealOnline();
  if (really) { hideOfflineOverlay(); setTimeout(() => window.location.reload(), 300); }
});

/* ============================================================ */
/*  Redis                                                         */
/* ============================================================ */
async function redisGet(url, token, key) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 6000);
    const r = await fetch(url + '/get/' + encodeURIComponent(key), {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: c.signal, cache: 'no-store'
    });
    clearTimeout(t);
    if (!r.ok) return null;
    const d = await r.json();
    if (d && d.result) {
      try { return JSON.parse(d.result); } catch(e) { return d.result; }
    }
    return null;
  } catch(e) { return null; }
}

async function redisSet(url, token, key, value) {
  try {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 8000);
    const r = await fetch(url + '/set/' + encodeURIComponent(key) + '/' + encodeURIComponent(JSON.stringify(value)), {
      headers: { 'Authorization': 'Bearer ' + token },
      signal: c.signal
    });
    clearTimeout(t);
    return r.ok;
  } catch(e) { return false; }
}

/* ⚡ خواندن یه کاربر تکی */
async function redisGetUser(phone) {
  const key = 'user:' + phone;
  const results = await Promise.allSettled([
    redisGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, key),
    redisGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, key)
  ]);
  const u1 = results[0].status === 'fulfilled' ? results[0].value : null;
  const u2 = results[1].status === 'fulfilled' ? results[1].value : null;
  if (!u1 && !u2) return null;
  if (!u1) return u2;
  if (!u2) return u1;
  const t1 = u1.lastUpdatedAt || 0;
  const t2 = u2.lastUpdatedAt || 0;
  return t2 > t1 ? u2 : u1;
}

/* ⚡ همه کاربران */
async function getAllUsers() {
  const results = await Promise.allSettled([
    redisGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, 'all_users'),
    redisGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, 'all_users')
  ]);

  const v1 = results[0].status === 'fulfilled' ? results[0].value : null;
  const v2 = results[1].status === 'fulfilled' ? results[1].value : null;

  if (!v1 && !v2) return null;

  const merged = {};
  if (v1 && typeof v1 === 'object') for (const k in v1) if (v1[k]) merged[k] = v1[k];
  if (v2 && typeof v2 === 'object') {
    for (const k in v2) {
      if (!merged[k]) { merged[k] = v2[k]; continue; }
      const t1 = merged[k].lastUpdatedAt || 0;
      const t2 = v2[k].lastUpdatedAt || 0;
      if (t2 > t1) merged[k] = v2[k];
    }
  }
  return merged;
}

/* ⚡⚡⚡ ایندکس کوچیک تیم مدیریت */
async function saveMgmtIndex(phones) {
  try {
    await Promise.allSettled([
      redisSet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, MGMT_LIST_KEY, phones),
      redisSet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, MGMT_LIST_KEY, phones)
    ]);
  } catch(e) {}
}

async function loadMgmtIndex() {
  const results = await Promise.allSettled([
    redisGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, MGMT_LIST_KEY),
    redisGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, MGMT_LIST_KEY)
  ]);
  const v1 = results[0].status === 'fulfilled' ? results[0].value : null;
  const v2 = results[1].status === 'fulfilled' ? results[1].value : null;
  const list = v1 || v2;
  if (Array.isArray(list)) return list;
  return null;
}

/* ============================================================ */
/*  Helpers                                                       */
/* ============================================================ */
function isVideoSrc(src) {
  if (!src || typeof src !== 'string') return false;
  if (src.indexOf('data:video') === 0) return true;
  if (src.indexOf('blob:') === 0) return true;
  const lower = src.toLowerCase();
  return lower.indexOf('.webm') > -1 || lower.indexOf('.mp4') > -1 ||
         lower.indexOf('.mov') > -1 || lower.indexOf('.ogg') > -1 ||
         lower.indexOf('.m4v') > -1;
}

function getAvatarSrc(phone, u) {
  if (u.exclusiveAvatar && u.useExclusive === true) return u.exclusiveAvatar;
  return u.avatar || 'Mafia2.png';
}

function getFrameSrc(u) {
  return u.currentTemplate || null;
}

function srcKey(s) {
  if (!s || typeof s !== 'string') return '0';
  if (s.indexOf('data:') === 0 || s.indexOf('blob:') === 0) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return 'h' + (h >>> 0) + '_' + s.length;
  }
  return s;
}

function applyTick(img, cands) {
  if (!img || !cands || !cands.length) return;
  let i = 0;
  (function nx() {
    if (i >= cands.length) { img.style.display = 'none'; return; }
    const s = cands[i++];
    const t = new Image();
    t.onload = function() { img.src = s; img.style.display = 'inline-block'; };
    t.onerror = nx;
    t.src = s;
  })();
}

function buildAvatarMedia(src) {
  if (!src) src = 'Mafia2.png';
  if (isVideoSrc(src)) {
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.autoplay = true;
    v.loop = true;
    v.setAttribute('muted', 'muted');
    v.setAttribute('playsinline', 'playsinline');
    v.setAttribute('webkit-playsinline', 'webkit-playsinline');
    v.setAttribute('autoplay', '');
    v.setAttribute('loop', '');
    v.setAttribute('preload', 'auto');
    v.src = src;
    try { v.load(); } catch(e) {}
    try { const p = v.play(); if (p && p.catch) p.catch(()=>{}); } catch(e) {}
    return v;
  }
  const img = document.createElement('img');
  img.src = src;
  img.onerror = function() { this.style.display = 'none'; };
  return img;
}

function destroyMedia(el) {
  if (!el) return;
  try {
    if (el.tagName === 'VIDEO') {
      el.pause();
      el.removeAttribute('src');
      try { el.load(); } catch(e) {}
    }
  } catch(e) {}
  if (el.parentNode) el.parentNode.removeChild(el);
}

/* ============================================================ */
/*  Build / Update Card                                           */
/* ============================================================ */
function buildCard(phone, u) {
  const card = document.createElement('div');
  card.className = 'member-card';
  card.dataset.phone = phone;

  const tplWrap = document.createElement('div');
  tplWrap.className = 'card-template';
  const tplImg = document.createElement('img');
  tplImg.src = getCardTemplate(u.rank);
  tplImg.onerror = function() { this.style.display = 'none'; };
  tplWrap.appendChild(tplImg);
  card.appendChild(tplWrap);

  const avContainer = document.createElement('div');
  avContainer.className = 'avatar-container';

  const avCircle = document.createElement('div');
  avCircle.className = 'avatar-circle';
  const avSrc = getAvatarSrc(phone, u);
  avCircle.dataset.srcKey = srcKey(avSrc);
  avCircle.appendChild(buildAvatarMedia(avSrc));
  avContainer.appendChild(avCircle);

  const frameSrc = getFrameSrc(u);
  if (frameSrc) {
    const frameImg = document.createElement('img');
    frameImg.className = 'avatar-frame';
    frameImg.dataset.srcKey = srcKey(frameSrc);
    frameImg.src = frameSrc;
    frameImg.alt = '';
    frameImg.onerror = function() { this.style.display = 'none'; };
    avContainer.appendChild(frameImg);
  }
  card.appendChild(avContainer);

  const info = document.createElement('div');
  info.className = 'member-info';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'member-name';
  nameDiv.appendChild(document.createTextNode(u.name || 'کاربر'));

  const roleKey = (u.rank || '').trim();
  const ticks = ROLE_TICK_MAP[roleKey];
  if (ticks && ticks.length) {
    const tickImg = document.createElement('img');
    tickImg.className = 'role-tick';
    tickImg.alt = '';
    tickImg.src = '';
    nameDiv.appendChild(tickImg);
    applyTick(tickImg, ticks);
  }
  info.appendChild(nameDiv);

  const roleDiv = document.createElement('div');
  roleDiv.className = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
  roleDiv.textContent = u.rank || 'کاربر';
  info.appendChild(roleDiv);

  card.appendChild(info);
  return card;
}

function updateCard(card, u) {
  const phone = card.dataset.phone;

  const tplImg = card.querySelector('.card-template img');
  const newTpl = getCardTemplate(u.rank);
  if (tplImg) {
    const cur = tplImg.getAttribute('src') || '';
    if (!cur.endsWith(newTpl)) {
      tplImg.src = newTpl;
      tplImg.style.display = '';
    }
  }

  const avCircle = card.querySelector('.avatar-circle');
  const newAvSrc = getAvatarSrc(phone, u);
  const newAvKey = srcKey(newAvSrc);
  if (avCircle) {
    const curKey = avCircle.dataset.srcKey || '0';
    if (curKey !== newAvKey) {
      destroyMedia(avCircle.firstElementChild);
      while (avCircle.firstChild) avCircle.removeChild(avCircle.firstChild);
      avCircle.dataset.srcKey = newAvKey;
      avCircle.appendChild(buildAvatarMedia(newAvSrc));
    }
  }

  const avContainer = card.querySelector('.avatar-container');
  if (avContainer) {
    let frameImg = avContainer.querySelector('.avatar-frame');
    const newFrame = getFrameSrc(u);
    if (newFrame) {
      if (!frameImg) {
        frameImg = document.createElement('img');
        frameImg.className = 'avatar-frame';
        frameImg.alt = '';
        frameImg.onerror = function() { this.style.display = 'none'; };
        avContainer.appendChild(frameImg);
      }
      const newFrameKey = srcKey(newFrame);
      if (frameImg.dataset.srcKey !== newFrameKey) {
        frameImg.style.display = '';
        frameImg.dataset.srcKey = newFrameKey;
        frameImg.src = newFrame;
      }
    } else if (frameImg) {
      frameImg.remove();
    }
  }

  const nameDiv = card.querySelector('.member-name');
  if (nameDiv) {
    const curName = nameDiv.firstChild ? nameDiv.firstChild.nodeValue : '';
    const newName = u.name || 'کاربر';
    if (curName !== newName) {
      while (nameDiv.firstChild) nameDiv.removeChild(nameDiv.firstChild);
      nameDiv.appendChild(document.createTextNode(newName));
      const roleKey = (u.rank || '').trim();
      const ticks = ROLE_TICK_MAP[roleKey];
      if (ticks && ticks.length) {
        const tickImg = document.createElement('img');
        tickImg.className = 'role-tick';
        tickImg.alt = '';
        tickImg.src = '';
        nameDiv.appendChild(tickImg);
        applyTick(tickImg, ticks);
      }
    }
  }

  const roleDiv = card.querySelector('.member-role');
  if (roleDiv) {
    const roleKey = (u.rank || '').trim();
    const newText = u.rank || 'کاربر';
    const newClass = 'member-role ' + (ROLE_CLASS_MAP[roleKey] || 'role-observer');
    if (roleDiv.textContent !== newText) roleDiv.textContent = newText;
    if (roleDiv.className !== newClass) roleDiv.className = newClass;
  }
}

/* ============================================================ */
/*  Render - با مدیریت کامل حالات                                 */
/* ============================================================ */
let __hasRenderedOnce = false;

function renderUsers(usersMap) {
  const grid = document.getElementById('managementGrid');
  if (!grid) return;

  const mgmt = Object.entries(usersMap || {}).filter(([p, u]) =>
    u && u.rank && MANAGEMENT_ROLES.includes((u.rank || '').trim())
  );

  mgmt.sort((a, b) => {
    const rA = ROLE_ORDER[(a[1].rank || '').trim()] ?? 99;
    const rB = ROLE_ORDER[(b[1].rank || '').trim()] ?? 99;
    return rA - rB;
  });

  // اگه خالی
  if (mgmt.length === 0) {
    if (!__hasRenderedOnce) {
      // اولین بار و لیست خالیه → پیام
      grid.innerHTML = '<div class="status-box"><div>هنوز عضوی در تیم مدیریت وجود ندارد</div></div>';
      __hasRenderedOnce = true;
    }
    return;
  }

  // اگه اولین بار → پاک کن و بساز
  if (!__hasRenderedOnce) {
    grid.innerHTML = '';
    __hasRenderedOnce = true;
  } else {
    // پاک کردن status-box اگه هست
    const statusBox = grid.querySelector('.status-box');
    if (statusBox) statusBox.remove();
  }

  const existing = {};
  grid.querySelectorAll('.member-card').forEach(c => { existing[c.dataset.phone] = c; });
  const newPhones = mgmt.map(([p]) => p);

  Object.keys(existing).forEach(phone => {
    if (!newPhones.includes(phone)) {
      const circle = existing[phone].querySelector('.avatar-circle');
      if (circle) destroyMedia(circle.firstElementChild);
      existing[phone].remove();
      delete existing[phone];
    }
  });

  let prev = null;
  mgmt.forEach(([phone, u]) => {
    let card = existing[phone];
    if (card) updateCard(card, u);
    else card = buildCard(phone, u);
    if (prev) {
      if (prev.nextSibling !== card) grid.insertBefore(card, prev.nextSibling);
    } else {
      if (grid.firstChild !== card) grid.insertBefore(card, grid.firstChild);
    }
    prev = card;
  });
}

function showStatus(message, withRetry) {
  const grid = document.getElementById('managementGrid');
  if (!grid) return;
  if (__hasRenderedOnce) return; // اگه کاربرا رو دیدیم، دیگه پیام نده

  grid.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'status-box';
  box.innerHTML = '<div class="spinner"></div><div>' + message + '</div>';
  if (withRetry) {
    const btn = document.createElement('button');
    btn.className = 'retry-btn';
    btn.textContent = '🔄 تلاش مجدد';
    btn.onclick = () => { __hasRenderedOnce = false; refresh(); };
    box.appendChild(btn);
  }
  grid.appendChild(box);
}

/* ============================================================ */
/*  ⚡⚡⚡ Refresh اصلی                                            */
/* ============================================================ */
let fetching = false;
let __emptyRetries = 0;

async function refresh() {
  if (fetching) return;
  if (__isOffline) return;
  if (navigator.onLine === false) { checkOffline(); return; }
  fetching = true;

  try {
    // ⚡ 1) اول ایندکس کوچیک تیم مدیریت رو بخون
    let mgmtPhones = await loadMgmtIndex();

    // اگه نبود، از all_users بساز
    if (!mgmtPhones || mgmtPhones.length === 0) {
      const allUsers = await getAllUsers();
      if (allUsers && Object.keys(allUsers).length > 0) {
        mgmtPhones = Object.entries(allUsers)
          .filter(([p, u]) => u && u.rank && MANAGEMENT_ROLES.includes((u.rank || '').trim()))
          .map(([p]) => p);
        // ذخیره ایندکس برای بار بعد
        if (mgmtPhones.length > 0) saveMgmtIndex(mgmtPhones);
      }
    }

    if (!mgmtPhones || mgmtPhones.length === 0) {
      __emptyRetries++;
      if (__emptyRetries > 3) {
        renderUsers({});
        fetching = false;
        return;
      }
      showStatus('در حال بارگذاری تیم مدیریت...', false);
      fetching = false;
      return;
    }

    // ⚡ 2) برای هر شماره، user:PHONE تکی بخون
    const results = await Promise.allSettled(
      mgmtPhones.map(phone => redisGetUser(phone))
    );

    const finalUsers = {};
    let validCount = 0;
    results.forEach((r, idx) => {
      const phone = mgmtPhones[idx];
      if (r.status === 'fulfilled' && r.value && r.value.rank) {
        finalUsers[phone] = r.value;
        validCount++;
      }
    });

    if (validCount === 0) {
      __emptyRetries++;
      if (__emptyRetries > 3) {
        showStatus('خطا در دریافت اطلاعات کاربران', true);
      } else {
        showStatus('در حال بارگذاری...', false);
      }
      fetching = false;
      return;
    }

    __emptyRetries = 0;
    renderUsers(finalUsers);

    // ⚡ 3) آپدیت ایندکس (اگه کاربری از لیست خارج شد)
    const activePhones = Object.keys(finalUsers);
    if (activePhones.length !== mgmtPhones.length ||
        activePhones.some((p, i) => p !== mgmtPhones[i])) {
      saveMgmtIndex(activePhones);
    }

    __offlineFailCount = 0;
  } catch(e) {
    console.warn('Refresh error:', e);
    checkOffline();
  }

  fetching = false;
}

/* ============================================================ */
/*  Boot                                                          */
/* ============================================================ */
function playClickSound() {
  try {
    const s = document.getElementById('clickSound');
    if (s) { s.currentTime = 0; s.volume = 0.3; s.play().catch(()=>{}); }
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
  const backBtn = document.getElementById('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function() {
      playClickSound();
      if (document.referrer && document.referrer.indexOf('Safe') > -1) {
        window.history.back();
      } else {
        window.location.href = 'Safe Asli Bazi.html';
      }
    });
  }

  // Offline
  setupOfflineBtn();
  checkOffline();
  setInterval(checkOffline, 2000);

  // رفرش اولیه
  refresh();

  // ⚡ polling هر ۳ ثانیه
  setInterval(refresh, REFRESH_INTERVAL);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      checkOffline();
      refresh();
    }
  });

  window.addEventListener('focus', () => {
    checkOffline();
    refresh();
  });
});
</script>
