<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#041228">
<title>تیم مدیریت | بازی پلیس</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;}
  body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#041228;width:100%;min-height:100vh;overflow-x:hidden;}
  
  .bg-image{position:fixed;inset:0;background-image:url('53.jpg');background-size:cover;background-position:center;z-index:-1;}
  .bg-image::after{content:'';position:absolute;inset:0;background:rgba(4,18,40,0.7);}
  
  .header{background:linear-gradient(180deg,rgba(30,74,138,.95),rgba(18,53,106,.95));padding:15px;text-align:center;border-bottom:2px solid #2a5a9a;backdrop-filter:blur(10px);}
  .header h1{color:#fff;font-size:24px;font-weight:900;margin-bottom:5px;}
  .header p{color:rgba(255,255,255,.8);font-size:14px;}
  
  .back-btn{position:fixed;top:15px;left:15px;width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;cursor:pointer;z-index:100;border:none;}
  
  .management-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:20px;max-width:1200px;margin:0 auto;}
  
  .member-card{position:relative;border-radius:15px;overflow:hidden;transition:transform .3s;aspect-ratio:1/1;}
  .member-card:hover{transform:translateY(-5px);}
  
  .card-template{width:100%;height:100%;position:relative;}
  .card-template img{width:100%;height:100%;object-fit:contain;background:#1a3a6a;}
  
  .avatar-circle{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#1a3a6a;box-shadow:0 4px 15px rgba(0,0,0,.4);z-index:10;}
  .avatar-circle img,.avatar-circle video{width:100%;height:100%;object-fit:cover;}
  
  .member-info{position:absolute;bottom:0;left:0;right:0;padding:15px 10px 10px;text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.8));z-index:5;}
  .member-name{color:#fff;font-size:14px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:5px;text-shadow:0 2px 4px rgba(0,0,0,0.8);}
  .member-role{display:inline-block;padding:3px 12px;border-radius:15px;font-size:10px;font-weight:700;margin-bottom:8px;}
  
  .role-creator{background:linear-gradient(180deg,#ffd700,#ff8c00);color:#000;}
  .role-support{background:linear-gradient(180deg,#4a9eff,#2a7acc);color:#fff;}
  .role-supervisor{background:linear-gradient(180deg,#9c27b0,#7b1fa2);color:#fff;}
  .role-admin-senior{background:linear-gradient(180deg,#e91e63,#c2185b);color:#fff;}
  .role-admin{background:linear-gradient(180deg,#f44336,#d32f2f);color:#fff;}
  .role-observer-senior{background:linear-gradient(180deg,#00bcd4,#0097a7);color:#fff;}
  .role-observer{background:linear-gradient(180deg,#4caf50,#388e3c);color:#fff;}
  
  .role-tick{width:16px;height:16px;object-fit:contain;}
  
  .loading{text-align:center;padding:40px;color:rgba(255,255,255,.6);font-size:16px;grid-column:1/-1;}
  .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.6);grid-column:1/-1;}
  .empty-state-icon{font-size:60px;margin-bottom:15px;}
  
  @media (max-width:768px){
    .management-grid{grid-template-columns:repeat(3,1fr);gap:10px;padding:15px;}
    .avatar-circle{width:60px;height:60px;top:18%;}
    .member-info{padding:12px 8px 8px;}
    .member-name{font-size:12px;}
    .member-role{font-size:9px;padding:2px 10px;}
    .header h1{font-size:20px;}
  }
</style>
</head>
<body>
<div class="bg-image"></div>
<button class="back-btn" onclick="window.location.href='Safe Asli Bazi.html'">‹</button>

<div class="header">
  <h1>👥 تیم مدیریت</h1>
  <p>اعضای تیم مدیریت و پشتیبانی بازی</p>
</div>

<div class="management-grid" id="managementGrid">
  <div class="loading">در حال بارگذاری اطلاعات...</div>
</div>

<script>
  const UPSTASH_OLD_URL = "https://smooth-werewolf-200782.upstash.io";
  const UPSTASH_OLD_TOKEN = "gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA";
  const UPSTASH_NEW_URL = "https://holy-hamster-122717.upstash.io";
  const UPSTASH_NEW_TOKEN = "gQAAAAAAAd9dAAIgcDFlNmYwM2VkZDJiM2Y0YWI2ODBmNmIyMTZjMmRkMTZmNg";
  const JSONBIN_KEY = "$2a$10$G8pgSWnFz4w/.voj3lfBPuJL7luRXAXiR/fIufC3YIB4.qRkZSjSS";
  const JSONBIN_ID1 = "6a310a04da38895dfec86661";
  const JSONBIN_ID2 = "6a53f4c8f5f4af5e298541fe";

  async function upstashGet(url, token, k) {
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 5000);
      const r = await fetch(url + '/get/' + encodeURIComponent(k), { headers: { 'Authorization': 'Bearer ' + token }, signal: c.signal });
      clearTimeout(t);
      if (!r.ok) return null;
      const d = await r.json();
      if (d && d.result) { try { return JSON.parse(d.result); } catch (e) { return d.result; } }
      return null;
    } catch (e) { return null; }
  }

  async function jsonbinRead(binId) {
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 5000);
      const r = await fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', { headers: { 'X-Master-Key': JSONBIN_KEY }, signal: c.signal });
      clearTimeout(t);
      if (!r.ok) return null;
      const d = await r.json();
      return d.record || {};
    } catch (e) { return null; }
  }

  async function redisGet(key) {
    let v = await upstashGet(UPSTASH_OLD_URL, UPSTASH_OLD_TOKEN, key);
    if (v !== null) return v;
    v = await upstashGet(UPSTASH_NEW_URL, UPSTASH_NEW_TOKEN, key);
    if (v !== null) return v;
    const b1 = await jsonbinRead(JSONBIN_ID1);
    if (b1 && b1[key] !== undefined) return b1[key];
    const b2 = await jsonbinRead(JSONBIN_ID2);
    if (b2 && b2[key] !== undefined) return b2[key];
    return null;
  }

  async function getAllUsers(){return await redisGet('all_users')||{};}

  const CREATOR_PHONE='09904844031';
  const YAZDGARD_PHONE='09942785343';
  const CREATOR_AVATAR='655.webm';

  function toPersianNum(n){const p=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];return String(n).replace(/[0-9]/g,w=>p[+w]);}

  function getRoleTick(role){
    if(!role)return null;
    const r=role.trim();
    if(r==='سازنده'||r==='پشتیبانی')return['Tik1.png'];
    if(r==='ادمین ارشد')return['Tik1000.png'];
    if(r==='ادمین')return['Tik2.png'];
    if(r==='گرداننده')return['Tik3.png'];
    if(r==='ناظر'||r==='ناظر ارشد')return['TIK4.png','Tik4.png'];
    return null;
  }

  function getRoleClass(role){
    const r=role?role.trim():'';
    if(r==='سازنده')return'role-creator';
    if(r==='پشتیبانی')return'role-support';
    if(r==='گرداننده')return'role-supervisor';
    if(r==='ادمین ارشد')return'role-admin-senior';
    if(r==='ادمین')return'role-admin';
    if(r==='ناظر ارشد')return'role-observer-senior';
    if(r==='ناظر')return'role-observer';
    return'role-observer';
  }

  function getTemplate(role){
    const r=role?role.trim():'';
    if(['سازنده','پشتیبانی','گرداننده'].includes(r))return'50.webp';
    return'51.webp';
  }

  function applyTick(img,cands){
    if(!img||!cands||!cands.length)return;
    let i=0;
    (function nx(){
      if(i>=cands.length){img.style.display='none';return;}
      const s=cands[i++];
      const t=new Image();
      t.onload=function(){img.src=s;img.style.display='inline-block';};
      t.onerror=nx;
      t.src=s;
    })();
  }

  async function loadManagementTeam(){
    const grid=document.getElementById('managementGrid');
    try{
      const allUsers=await getAllUsers();
      const users=Object.entries(allUsers);
      
      const managementRoles=['سازنده','پشتیبانی','گرداننده','ادمین ارشد','ادمین','ناظر ارشد','ناظر'];
      const managementUsers=users.filter(([p,u])=>u&&u.rank&&managementRoles.includes(u.rank.trim()));
      
      if(managementUsers.length===0){
        grid.innerHTML='<div class="empty-state"><div class="empty-state-icon">👥</div><div>هنوز عضوی در تیم مدیریت وجود ندارد</div></div>';
        return;
      }
      
      grid.innerHTML='';
      
      for(const [phone,user] of managementUsers){
        const card=document.createElement('div');
        card.className='member-card';
        card.dataset.phone=phone;
        
        let avatarSrc=user.avatar||'Mafia2.png';
        if(phone===CREATOR_PHONE||phone===YAZDGARD_PHONE){
          avatarSrc=CREATOR_AVATAR;
        }
        
        const isVideo=avatarSrc.endsWith('.webm')||avatarSrc.endsWith('.mp4');
        const avatarHtml=isVideo?`<video src="${avatarSrc}" autoplay loop muted playsinline></video>`:`<img src="${avatarSrc}" onerror="this.style.display='none';">`;
        
        const tick=getRoleTick(user.rank);
        const tickHtml=tick?'<img class="role-tick" src="" data-ticks="'+tick.join(',')+'">':'';
        
        card.innerHTML=`
          <div class="card-template">
            <img src="${getTemplate(user.rank)}" alt="template">
          </div>
          <div class="avatar-circle">${avatarHtml}</div>
          <div class="member-info">
            <div class="member-name">
              ${user.name||'کاربر'}
              ${tickHtml}
            </div>
            <div class="member-role ${getRoleClass(user.rank)}">${user.rank||'کاربر'}</div>
          </div>
        `;
        
        grid.appendChild(card);
        
        if(tick){
          const tickImg=card.querySelector('.role-tick');
          if(tickImg){
            const ticks=tickImg.dataset.ticks.split(',');
            applyTick(tickImg,ticks);
          }
        }
      }
      
    }catch(error){
      console.error('Error loading management team:',error);
      grid.innerHTML='<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>خطا در بارگذاری اطلاعات</div></div>';
    }
  }

  async function updateMemberCard(phone,userData){
    const card=document.querySelector(`.member-card[data-phone="${phone}"]`);
    if(!card)return;
    
    let avatarSrc=userData.avatar||'Mafia2.png';
    if(phone===CREATOR_PHONE||phone===YAZDGARD_PHONE){
      avatarSrc=CREATOR_AVATAR;
    }
    
    const avatarCircle=card.querySelector('.avatar-circle');
    const isVideo=avatarSrc.endsWith('.webm')||avatarSrc.endsWith('.mp4');
    avatarCircle.innerHTML=isVideo?`<video src="${avatarSrc}" autoplay loop muted playsinline></video>`:`<img src="${avatarSrc}" onerror="this.style.display='none';">`;
    
    const nameEl=card.querySelector('.member-name');
    const tick=getRoleTick(userData.rank);
    const tickHtml=tick?'<img class="role-tick" src="" data-ticks="'+tick.join(',')+'">':'';
    nameEl.innerHTML=`${userData.name||'کاربر'}${tickHtml}`;
    
    if(tick){
      const tickImg=card.querySelector('.role-tick');
      if(tickImg){
        const ticks=tickImg.dataset.ticks.split(',');
        applyTick(tickImg,ticks);
      }
    }
    
    const roleEl=card.querySelector('.member-role');
    roleEl.textContent=userData.rank||'کاربر';
    roleEl.className=`member-role ${getRoleClass(userData.rank)}`;
    
    const templateImg=card.querySelector('.card-template img');
    if(templateImg){
      templateImg.src=getTemplate(userData.rank);
    }
  }

  function addNewMember(phone,userData){
    const grid=document.getElementById('managementGrid');
    const managementRoles=['سازنده','پشتیبانی','گرداننده','ادمین ارشد','ادمین','ناظر ارشد','ناظر'];
    
    if(!userData.rank||!managementRoles.includes(userData.rank.trim()))return;
    
    const existingCard=grid.querySelector(`.member-card[data-phone="${phone}"]`);
    if(existingCard)return;
    
    loadManagementTeam();
  }

  async function monitorChanges(){
    let lastUsers=JSON.stringify(await getAllUsers());
    
    setInterval(async ()=>{
      try{
        const currentUsers=await getAllUsers();
        const currentStr=JSON.stringify(currentUsers);
        
        if(currentStr!==lastUsers){
          const oldUsers=JSON.parse(lastUsers);
          
          for(const [phone,user] of Object.entries(currentUsers)){
            if(!user)continue;
            
            if(oldUsers[phone]){
              if(JSON.stringify(oldUsers[phone])!==JSON.stringify(user)){
                await updateMemberCard(phone,user);
              }
            }else{
              addNewMember(phone,user);
            }
          }
          
          for(const phone of Object.keys(oldUsers)){
            if(!currentUsers[phone]){
              const card=document.querySelector(`.member-card[data-phone="${phone}"]`);
              if(card)card.remove();
            }
          }
          
          lastUsers=currentStr;
        }
      }catch(e){
        console.error('Monitor error:',e);
      }
    },3000);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    loadManagementTeam();
    monitorChanges();
  });
</script>
</body>
</html>
