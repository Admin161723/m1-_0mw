async function upstashGet(url, token, k){
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch(url+'/get/'+encodeURIComponent(k),{headers:{'Authorization':'Bearer '+token},signal:c.signal});
    clearTimeout(t);if(!r.ok)return null;const d=await r.json();
    if(d&&d.result){try{return JSON.parse(d.result);}catch(e){return d.result;}}return null;}catch(e){return null;}
}
async function upstashSet(url, token, k, v){
  try{const jsonValue=JSON.stringify(v);const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch(url+'/set/'+encodeURIComponent(k)+'/'+encodeURIComponent(jsonValue),{headers:{'Authorization':'Bearer '+token},signal:c.signal});
    clearTimeout(t);return r.ok;}catch(e){return false;}
}
async function jsonbinRead(binId){
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch('https://api.jsonbin.io/v3/b/'+binId+'/latest',{headers:{'X-Master-Key':JSONBIN_KEY},signal:c.signal});
    clearTimeout(t);if(!r.ok)return null;const d=await r.json();return d.record||{};}catch(e){return null;}
}
async function jsonbinWrite(binId, data){
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch('https://api.jsonbin.io/v3/b/'+binId,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},body:JSON.stringify(data),signal:c.signal});
    clearTimeout(t);return r.ok;}catch(e){return false;}
}
async function redisGet(key){
  let v=await upstashGet(UPSTASH_OLD_URL,UPSTASH_OLD_TOKEN,key);if(v!==null)return v;
  v=await upstashGet(UPSTASH_NEW_URL,UPSTASH_NEW_TOKEN,key);if(v!==null)return v;
  const b1=await jsonbinRead(JSONBIN_ID1);if(b1&&b1[key]!==undefined)return b1[key];
  const b2=await jsonbinRead(JSONBIN_ID2);if(b2&&b2[key]!==undefined)return b2[key];return null;
}
async function redisSet(key, value){
  const p1=upstashSet(UPSTASH_OLD_URL,UPSTASH_OLD_TOKEN,key,value);
  const p2=upstashSet(UPSTASH_NEW_URL,UPSTASH_NEW_TOKEN,key,value);
  const p3=(async()=>{const b=await jsonbinRead(JSONBIN_ID1)||{};b[key]=value;return jsonbinWrite(JSONBIN_ID1,b);})();
  const p4=(async()=>{const b=await jsonbinRead(JSONBIN_ID2)||{};b[key]=value;return jsonbinWrite(JSONBIN_ID2,b);})();
  const results=await Promise.allSettled([p1,p2,p3,p4]);
  return results.some(r=>r.status==='fulfilled'&&r.value===true);
}
async function getRooms(){return await redisGet(ROOMS_KEY)||{};}
async function saveRooms(rooms){
  const existing=await redisGet(ROOMS_KEY);if(existing===null)return false;
  const merged=Object.assign({},existing,rooms);return redisSet(ROOMS_KEY,merged);
}

let amObserver=false, amManager=false, amPlayer=false, mySeatNum=null;
let pendingActionType=null, selectedTarget=null;

function toFa(n){const p=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];return String(n).replace(/[0-9]/g,w=>p[+w]);}
function toast(m,t){const el=document.getElementById('toast');el.textContent=m;el.className='toast show'+(t==='error'?' error':t==='info'?' info':'');setTimeout(()=>el.classList.remove('show'),2400);}
function seatPhone(r,i){return r.seats?r.seats[i]:null;}
function isMafiaSeat(s){return room&&room.game&&room.game.roles&&room.game.roles[s]&&ROLES[room.game.roles[s]].type==='mafia';}
function aliveSeats(){const s=[];for(let i=1;i<=10;i++)if(seatPhone(room,i)&&!(room.game&&room.game.dead&&room.game.dead[i]))s.push(i);return s;}
function aliveMafiaSeats(){return aliveSeats().filter(isMafiaSeat);}
function aliveCitizenSeats(){return aliveSeats().filter(s=>!isMafiaSeat(s));}
function getMyRole(){if(!mySeatNum||!room||!room.game)return null;return room.game.roles[mySeatNum];}
function getMyRoleData(){const r=getMyRole();return r?ROLES[r]:null;}

function buildChairs(){
  const w=document.getElementById('chairs');let h='';
  for(let i=1;i<=10;i++){
    const p=POS[i];
    h+=`<div class="chair empty-chair" id="chair-\( {i}" style="top: \){p.top};left:\( {p.left};background-image:url(' \){p.img}');">
      <div class="chair-avatar"></div>
      <div class="chair-num">${toFa(i)}</div>
      <div class="vote-count" id="vc-${i}"></div>
      <img class="killed-img" id="kill-${i}" src="Man2.png">
      <div class="action-emoji" id="act-${i}"></div>
      <div class="role-reveal" id="role-${i}"></div>
      <div class="chair-name">خالی</div>
    </div>`;
  }
  w.innerHTML=h;
  for(let i=1;i<=10;i++){
    document.getElementById('chair-'+i).addEventListener('click',()=>onChair(i));
  }
}

async function loadRoom(){
  const rooms=await getRooms();
  room=rooms[roomId];
  if(!room)return false;
  allUsers=await redisGet('all_users')||{};
  amManager=room.managerPhone===me.phone;
  amObserver=!!(room.supers&&(room.supers[1]===me.phone||room.supers[2]===me.phone));
  mySeatNum=null;
  for(const[i,p] of Object.entries(room.seats||{}))if(p===me.phone)mySeatNum=+i;
  amPlayer=!!mySeatNum;
  if(!room.game&&amManager)initGame();
  return true;
}

function initGame(){
  const pool=[...ROLE_POOL];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const roles={};
  let k=0;
  for(let i=1;i<=10;i++){if(seatPhone(room,i))roles[i]=pool[k++];}
  room.game={
    phase:'intro', day:0, roles, dead:{}, votes:{}, votedBy:{},
    nightActions:{}, usedActions:{},
    guns:{},          // seat -> 'real' | 'blank'
    framed:{},        // seat -> true (تهمت‌زده)
    saboteurTarget:null,
    speaker:1, speakerEnd:Date.now()+INTRO_SPEAK_MS, spoken:[],
    challengeNext:null,
    likes:{}, dislikes:{},
    paused:false, winner:null,
    lastNightResult:null,
    roleCardShown:{}
  };
}

async function updateGame(fn){
  const rooms=await getRooms();
  const r=rooms[roomId];
  if(!r||!r.game)return;
  fn(r);
  await saveRooms(rooms);
  room=r;
}

function canPlayerAct(){
  if(!room||!room.game||!mySeatNum||room.game.dead[mySeatNum])return false;
  const g=room.game;
  const role=getMyRole();
  if(g.phase==='night'){
    if(['boss','saboteur','accuser','detective','doctor','gunner'].includes(role)){
      if(g.usedActions[me.phone])return false;
      return true;
    }
  }
  if(g.phase==='day'&&role==='gunner'&&g.guns[mySeatNum]==='real'&&!g.usedActions[me.phone+'_shoot'])return true;
  return false;
}

async function managerTick(){
  await updateGame(r=>{
    const g=r.game;
    if(!g||g.winner||g.paused)return;
    const now=Date.now();
    if(g.speaker&&now>=g.speakerEnd)advanceSpeaker(r);
    if(g.phaseEnd&&now>=g.phaseEnd)nextPhase(r);
  });
}

function advanceSpeaker(r){
  const g=r.game;
  const alive=aliveSeats();
  if(!alive.length)return;

  if(g.speaker&&!g.spoken.includes(g.speaker))g.spoken.push(g.speaker);

  if(g.challengeNext){
    g.speaker=g.challengeNext;
    g.challengeNext=null;
    g.speakerEnd=Date.now()+CHALLENGE_MS;
    g.likes={};g.dislikes={};
    return;
  }

  let next=null;
  for(const s of alive){
    if(!g.spoken.includes(s)){next=s;break;}
  }
  if(next===null){
    g.spoken=[];
    g.speaker=null;
    nextPhase(r);
    return;
  }
  g.speaker=next;
  g.speakerEnd=Date.now()+(g.phase==='intro'?INTRO_SPEAK_MS:SPEAK_MS);
  g.likes={};g.dislikes={};
}

function nextPhase(r){
  const g=r.game;
  const now=Date.now();

  if(g.phase==='intro'){
    g.phase='night';
    g.phaseEnd=now+NIGHT_MS;
    g.speaker=null;
    g.day=1;
  }
  else if(g.phase==='night'){
    resolveNight(r);
    g.phase='day';
    g.phaseEnd=null;
    g.spoken=[];
    const alive=aliveSeats();
    g.speaker=alive.length?alive[0]:null;
    g.speakerEnd=now+SPEAK_MS;
    g.likes={};g.dislikes={};
  }
  else if(g.phase==='day'){
    g.phase='voting';
    g.phaseEnd=now+VOTING_MS;
    g.votes={};g.votedBy={};
    g.speaker=null;
  }
  else if(g.phase==='voting'){
    resolveVoting(r);
  }
  else if(g.phase==='defense'){
    if(g.accused)g.dead[g.accused]=true;
    g.accused=null;
    g.phase='night';
    g.day++;
    g.phaseEnd=now+NIGHT_MS;
    g.speaker=null;
  }
  checkWin(r);
}

function resolveNight(r){
  const g=r.game;
  const na=g.nightActions||{};
  let killed=null, saved=false, detResult=null, nightText='';

  // ۱. شلیک رئیس مافیا
  const bossTarget = na.boss_kill;
  // ۲. سیو دکتر
  const docSave = na.doctor_save;
  // ۳. خراب‌کار
  g.saboteurTarget = na.saboteur || null;
  // ۴. تهمت‌زن
  if(na.accuser){
    g.framed = g.framed||{};
    g.framed[na.accuser]=true;
  }
  // ۵. کارآگاه
  if(na.detective){
    const targetSeat = na.detective;
    const isBoss = g.roles[targetSeat]==='boss';
    const isFramed = g.framed&&g.framed[targetSeat];
    detResult = (isBoss || !isMafiaSeat(targetSeat)) && !isFramed ? 'شهروند' : 'مافیا';
    if(isBoss) detResult='شهروند'; // رئیس همیشه منفی
    if(isFramed) detResult='مافیا';
  }
  // ۶. تفنگدار
  if(na.gunner_real) g.guns[na.gunner_real]='real';
  if(na.gunner_blank) g.guns[na.gunner_blank]='blank';

  // محاسبه مرگ
  if(bossTarget){
    if(docSave && +docSave === +bossTarget){
      saved=true;
    }else{
      killed=+bossTarget;
      g.dead[killed]=true;
    }
  }

  if(killed){
    const ph=seatPhone(r,killed);
    const u=allUsers[ph]||{name:'بازیکن'};
    nightText=`☠️ ${u.name} در شب کشته شد!`;
  }else if(bossTarget&&saved){
    nightText='✅ دکتر هدف مافیا را نجات داد.';
  }else{
    nightText='✨ شب آرامی بود. کسی کشته نشد.';
  }
  if(detResult){
    nightText+=`<br>🔍 نتیجه استعلام کارآگاه: ${detResult}`;
  }
  g.lastNightResult=nightText;
  g.nightActions={};
  g.usedActions={};
}

function resolveVoting(r){
  const g=r.game;
  const votes=g.votes||{};
  const sorted=Object.keys(votes).map(Number).sort((a,b)=>votes[b]-votes[a]);
  if(sorted.length&&votes[sorted[0]]>=Math.ceil(aliveSeats().length/2)){
    g.phase='defense';
    g.accused=sorted[0];
    g.speaker=sorted[0];
    g.speakerEnd=Date.now()+DEFENSE_MS;
  }else{
    g.phase='night';
    g.day++;
    g.phaseEnd=Date.now()+NIGHT_MS;
    g.speaker=null;
  }
}

function checkWin(r){
  const g=r.game;
  const m=aliveMafiaSeats().length;
  const c=aliveCitizenSeats().length;
  if(m===0){g.winner='شهروند';endGame(r,'شهروند');}
  else if(m>=c){g.winner='مافیا';endGame(r,'مافیا');}
}

function endGame(r,winner){
  let html=`<b style="color:#ffd700;font-size:18px;">برنده: ${winner}</b><br><br>`;
  for(let i=1;i<=10;i++){
    const ph=seatPhone(r,i);if(!ph)continue;
    const u=allUsers[ph]||{name:'بات'};
    const role=ROLES[r.game.roles[i]];
    html+=`صندلی ${toFa(i)} · \( {u.name} → <b> \){role.name}</b>${r.game.dead[i]?' 🩸':''}<br>`;
  }
  document.getElementById('endTitle').textContent='پایان بازی | برنده: '+winner;
  document.getElementById('endBody').innerHTML=html;
  document.getElementById('endModal').classList.add('active');
}

function onChair(i){
  if(!room||!room.game)return;
  const g=room.game;

  // انتخاب هدف اکشن
  if(pendingActionType){
    if(g.dead[i]||!seatPhone(room,i)){toast('هدف نامعتبر','error');return;}
    if(pendingActionType!=='doctor_save'&&i===mySeatNum){toast('نمی‌توانید خودتان را انتخاب کنید','error');return;}
    selectedTarget=i;
    submitPlayerAction();
    return;
  }

  // رای‌گیری
  if(g.phase==='voting'&&amPlayer&&mySeatNum&&!g.dead[mySeatNum]){
    if(g.dead[i]||!seatPhone(room,i)||i===mySeatNum){toast('رای نامعتبر','error');return;}
    updateGame(r=>{
      const prev=r.game.votedBy[me.phone];
      if(prev){r.game.votes[prev]=(r.game.votes[prev]||1)-1;if(r.game.votes[prev]<=0)delete r.game.votes[prev];}
      r.game.votedBy[me.phone]=i;
      r.game.votes[i]=(r.game.votes[i]||0)+1;
    });
    toast('رای شما ثبت شد ✅');
    return;
  }

  // چالش (فقط در روز عادی)
  if(amPlayer&&g.speaker===mySeatNum&&g.phase==='day'&&g.day>=1){
    if(g.dead[i]||!seatPhone(room,i)||i===mySeatNum)return;
    updateGame(r=>{r.game.challengeNext=i;});
    toast('⚔️ چالش داده شد');
  }
}

async function submitPlayerAction(){
  if(!pendingActionType||selectedTarget===null)return;
  const targetSeat=selectedTarget;
  const targetPhone=seatPhone(room,targetSeat);
  const targetName=(allUsers[targetPhone]||{name:'بازیکن'}).name;

  await updateGame(r=>{
    const g=r.game;
    if(!g.nightActions)g.nightActions={};
    if(!g.usedActions)g.usedActions={};

    const role=getMyRole();

    if(role==='boss'){
      g.nightActions.boss_kill=targetSeat;
      toast('🔫 هدف شات انتخاب شد');
    }
    else if(role==='saboteur'){
      g.nightActions.saboteur=targetSeat;
      toast('💣 خراب‌کاری روی '+targetName);
    }
    else if(role==='accuser'){
      g.nightActions.accuser=targetSeat;
      toast('🗯 تهمت به '+targetName);
    }
    else if(role==='detective'){
      g.nightActions.detective=targetSeat;
      // نتیجه فوری به کارآگاه نشان داده می‌شود
      const isBoss=g.roles[targetSeat]==='boss';
      const isFramed=g.framed&&g.framed[targetSeat];
      let res='شهروند';
      if(isMafiaSeat(targetSeat)&&!isBoss)res='مافیا';
      if(isFramed)res='مافیا';
      if(isBoss)res='شهروند';
      toast('🔍 استعلام: '+targetName+' → '+res,'info');
    }
    else if(role==='doctor'){
      g.nightActions.doctor_save=targetSeat;
      toast('💉 '+targetName+' سیو شد');
    }
    else if(role==='gunner'){
      // دو انتخاب: جنگی و مشقی
      if(pendingActionType==='gunner_real'){
        g.nightActions.gunner_real=targetSeat;
        toast('🔫 تفنگ جنگی به '+targetName+' داده شد');
      }else if(pendingActionType==='gunner_blank'){
        g.nightActions.gunner_blank=targetSeat;
        toast('🔫 تفنگ مشقی به '+targetName+' داده شد');
      }
    }
    // شلیک روز تفنگدار
    else if(pendingActionType==='gun_shoot'){
      const hasReal=g.guns[mySeatNum]==='real';
      const sabotaged=g.saboteurTarget===mySeatNum;
      if(hasReal){
        if(sabotaged){
          g.dead[mySeatNum]=true;
          toast('💣 خراب‌کاری! خودت از بازی خارج شدی','error');
        }else{
          g.dead[targetSeat]=true;
          toast('💥 '+targetName+' با تفنگ جنگی کشته شد!');
        }
        g.usedActions[me.phone+'_shoot']=true;
        delete g.guns[mySeatNum];
      }
    }

    g.usedActions[me.phone]=true;
  });

  pendingActionType=null;
  selectedTarget=null;
  document.getElementById('actionModal').classList.remove('active');
}

// دکمه‌ها
document.getElementById('myActionBtn').onclick=()=>{
  if(!canPlayerAct()){toast('الان نمی‌توانید اکشن بزنید','error');return;}
  const role=getMyRole();
  const select=document.getElementById('actionSelect');
  select.innerHTML='';

  if(role==='gunner'&&room.game.phase==='night'){
    // دو دکمه برای جنگی و مشقی
    const btn1=document.createElement('button');
    btn1.style.cssText='padding:14px;border:none;border-radius:10px;background:#dc2626;color:#fff;font-weight:900;font-size:14px;';
    btn1.textContent='🔫 دادن تفنگ جنگی';
    btn1.onclick=()=>{pendingActionType='gunner_real';document.getElementById('actionTitle').textContent='تفنگ جنگی به چه کسی؟';select.innerHTML='<div style="color:#ffd700;text-align:center;margin-bottom:10px;">یک بازیکن زنده را لمس کنید</div>';};
    select.appendChild(btn1);

    const btn2=document.createElement('button');
    btn2.style.cssText='padding:14px;border:none;border-radius:10px;background:#64748b;color:#fff;font-weight:900;font-size:14px;margin-top:8px;';
    btn2.textContent='🔫 دادن تفنگ مشقی';
    btn2.onclick=()=>{pendingActionType='gunner_blank';document.getElementById('actionTitle').textContent='تفنگ مشقی به چه کسی؟';select.innerHTML='<div style="color:#ffd700;text-align:center;margin-bottom:10px;">یک بازیکن زنده را لمس کنید</div>';};
    select.appendChild(btn2);
  }
  else if(role==='gunner'&&room.game.phase==='day'&&room.game.guns[mySeatNum]==='real'){
    pendingActionType='gun_shoot';
    document.getElementById('actionTitle').textContent='به چه کسی شلیک می‌کنید؟';
    select.innerHTML='<div style="color:#ffd700;text-align:center;">یک بازیکن زنده را لمس کنید</div>';
  }
  else{
    pendingActionType=role;
    document.getElementById('actionTitle').textContent='هدف را انتخاب کنید';
    select.innerHTML=`<div style="color:#ffd700;text-align:center;margin-bottom:10px;">${ROLES[role].desc}</div>`;
    if(role==='doctor'){
      const selfBtn=document.createElement('button');
      selfBtn.style.cssText='padding:12px;border:none;border-radius:10px;background:#22c55e;color:#fff;font-weight:900;';
      selfBtn.textContent='🛡️ سیو خودم';
      selfBtn.onclick=()=>{selectedTarget=mySeatNum;submitPlayerAction();};
      select.appendChild(selfBtn);
    }
  }

  const cancel=document.createElement('button');
  cancel.style.cssText='padding:12px;border:none;border-radius:10px;background:#666;color:#fff;font-weight:900;margin-top:8px;';
  cancel.textContent='❌ انصراف';
  cancel.onclick=()=>{pendingActionType=null;document.getElementById('actionModal').classList.remove('active');};
  select.appendChild(cancel);

  document.getElementById('actionModal').classList.add('active');
};

  if(room&&room.game&&room.game.speaker){
    await updateGame(r=>advanceSpeaker(r));
  }
};

document.getElementById('whiteBtn').onclick=()=>{toast('سفید ثبت شد ✅');};

function showRoleCard(i){
  const r=ROLES[room.game.roles[i]];
  document.getElementById('roleCardImg').innerHTML=`<img src="${r.img}" onerror="this.style.display='none'">`;
  document.getElementById('roleCardName').textContent=r.name;
  const team=document.getElementById('roleCardTeam');
  team.textContent=r.type==='mafia'?'🔴 گروه مافیا':'🔵 گروه شهروند';
  team.className='role-card-team '+(r.type);
  document.getElementById('roleCardDesc').textContent=r.desc;
  document.getElementById('roleCardModal').classList.add('active');
}

function renderChairs(){
  if(!room)return;
  const g=room.game;
  for(let i=1;i<=10;i++){
    const el=document.getElementById('chair-'+i);
    const ph=seatPhone(room,i);
    const u=ph?allUsers[ph]:null;

    if(u){
      el.classList.remove('empty-chair');
      el.querySelector('.chair-avatar').innerHTML=`<img src="${u.avatar||'Mafia2.png'}" onerror="this.style.display='none'">`;
      el.querySelector('.chair-name').textContent=u.name||'بازیکن';
    }else{
      el.classList.add('empty-chair');
      el.querySelector('.chair-avatar').innerHTML='';
      el.querySelector('.chair-name').textContent='خالی';
    }

    const avatar=el.querySelector('.chair-avatar');
    avatar.classList.toggle('speaking',!!(g&&!g.paused&&g.speaker===i));
    el.classList.toggle('dead',!!(g&&g.dead&&g.dead[i]));

    avatar.classList.remove('can-target','can-vote');
    if(pendingActionType&&ph&&!g.dead[i]&&(i!==mySeatNum||pendingActionType==='doctor_save'||pendingActionType==='gunner_real'||pendingActionType==='gunner_blank')){
      avatar.classList.add('can-target');
    }else if(g&&g.phase==='voting'&&amPlayer&&mySeatNum&&!g.dead[mySeatNum]&&ph&&!g.dead[i]&&i!==mySeatNum){
      avatar.classList.add('can-vote');
    }

    const vc=document.getElementById('vc-'+i);
    if(g&&g.votes&&g.votes[i]){vc.textContent=toFa(g.votes[i]);vc.classList.add('show');}
    else vc.classList.remove('show');

    document.getElementById('kill-'+i).classList.toggle('show',!!(g&&g.dead&&g.dead[i]));
  }

  // ناظرها
  const s1=room.supers?allUsers[room.supers[1]]:null;
  const s2=room.supers?allUsers[room.supers[2]]:null;
  if(s1){document.getElementById('ob1').innerHTML=`<img src="${s1.avatar||'Mafia2.png'}">`;document.getElementById('obName1').textContent=(s1.name||'')+' (ناظر)';}
  if(s2){document.getElementById('ob2').innerHTML=`<img src="${s2.avatar||'Mafia2.png'}">`;document.getElementById('obName2').textContent=(s2.name||'')+' (ناظر)';}
}

function renderPhase(){
  if(!room||!room.game)return;
  const g=room.game;
  const ph=PHASES[g.phase]||PHASES.day;
  document.getElementById('phaseText').textContent=ph.text+(g.day?(' '+toFa(g.day)):'');
  document.getElementById('phaseIco').textContent=ph.ico;

  let end=g.speakerEnd||g.phaseEnd||Date.now();
  document.getElementById('phaseTime').textContent=toFa(Math.max(0,Math.round((end-Date.now())/1000)));

  document.getElementById('game-page').classList.toggle('night-mode',g.phase==='night');
  document.getElementById('roomTitle').textContent=room.name||'بازی';

  // دکمه‌ها
  const isSpeaking=g.speaker===mySeatNum&&(g.phase==='intro'||g.phase==='day'||g.phase==='defense');
  document.getElementById('nextBtn').classList.toggle('show',isSpeaking||amManager||amObserver);
  document.getElementById('whiteBtn').classList.toggle('show',g.phase==='day'||g.phase==='intro');
  document.getElementById('accuseBtn').classList.toggle('show',g.phase==='day'||g.phase==='intro');
  document.getElementById('myActionBtn').classList.toggle('show',canPlayerAct());
  document.getElementById('likeDislike').classList.toggle('show',!!g.speaker&&(g.phase==='day'||g.phase==='intro'));

  // لایک دیس‌لایک شمارش
  const likes=Object.keys(g.likes||{}).length;
  const dislikes=Object.keys(g.dislikes||{}).length;
  document.getElementById('likeCount').textContent=toFa(likes);
  document.getElementById('dislikeCount').textContent=toFa(dislikes);

  // کارت نقش اول بازی
  if(g.phase==='intro'&&amPlayer&&mySeatNum&&!g.roleCardShown[me.phone]){
    g.roleCardShown[me.phone]=true;
    updateGame(r=>{if(!r.game.roleCardShown)r.game.roleCardShown={};r.game.roleCardShown[me.phone]=true;});
    setTimeout(()=>showRoleCard(mySeatNum),600);
  }

  // گزارش شب
  if(g.phase==='day'&&g.lastNightResult&&amPlayer){
    const key='nr_'+roomId+'_'+g.day;
    if(!sessionStorage.getItem(key)){
      sessionStorage.setItem(key,'1');
      document.getElementById('nightResultBody').innerHTML=g.lastNightResult;
      document.getElementById('nightResultModal').classList.add('active');
    }
  }
}

async function loop(){
  const ok=await loadRoom();
  if(!ok){toast('لابی یافت نشد','error');return;}
  if(amManager&&room.game&&!room.game.winner)await managerTick();
  renderChairs();
  renderPhase();
}

async function boot(){
  const lg=localStorage.getItem('currentLoggedInUser');
  me=lg?JSON.parse(lg):{phone:'09904844031',name:'ناظر',avatar:'Mafia2.png'};
  roomId=sessionStorage.getItem('current_game_room')||localStorage.getItem('current_game_room');
  if(!roomId){toast('اول از تالار دوستانه وارد لابی شوید','error');return;}
  buildChairs();
  await loop();
  if(tick)clearInterval(tick);
  tick=setInterval(loop,1800);
}
boot();
</script>
