<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ایران - پیام‌رسان آنلاین</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#0e1621;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#17212b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0e1621;flex-shrink:0;z-index:50}
.header-right{display:flex;align-items:center;gap:10px}
.header-logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.header-logo img{width:100%;height:100%;object-fit:contain}
.header-title{font-size:1.4rem;font-weight:900}
.header-left{display:flex;align-items:center;gap:8px}
.header-btn{background:0 0;border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.header-btn:active{background:rgba(255,255,255,0.1)}
.header-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.chat-list{flex:1;overflow-y:auto;padding-bottom:70px;background:#0e1621}
.chat-item{display:flex;align-items:center;padding:10px 16px;cursor:pointer;pointer-events:auto;border-bottom:1px solid rgba(255,255,255,0.03)}
.chat-item:active{background:#17212b}
.chat-avatar{width:52px;height:52px;border-radius:50%;margin-left:12px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chat-name{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.chat-time{font-size:.72rem;color:#6c7883;flex-shrink:0;margin-right:8px}
.chat-time.unread{color:#5ba4d9}
.chat-bottom{display:flex;justify-content:space-between;align-items:center}
.chat-message{font-size:.85rem;color:#6c7883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-unread{background:#5ba4d9;color:#fff;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;margin-right:8px;flex-shrink:0}
.chat-check{margin-right:8px;flex-shrink:0}
.chat-check svg{width:18px;height:18px;fill:none;stroke:#5ba4d9;stroke-width:2}
.fab-edit{position:fixed;bottom:80px;left:18px;width:54px;height:54px;border-radius:50%;background:#5ba4d9;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(91,164,217,.4);display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:auto}
.fab-edit:active{transform:scale(.92)}
.fab-edit svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#17212b;border-top:1px solid #0e1621;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;pointer-events:auto;padding:4px 18px}
.nav-item svg{width:24px;height:24px;fill:none;stroke:#6c7883;stroke-width:2}
.nav-item span{font-size:.68rem;color:#6c7883}
.nav-item.active svg{stroke:#5ba4d9}
.nav-item.active span{color:#5ba4d9;font-weight:600}
.nav-item.disabled{opacity:.35;pointer-events:none}
.chat-page{position:fixed;top:0;left:0;right:0;bottom:0;background:#0e1621;z-index:200;display:none;flex-direction:column}
.chat-page.active{display:flex}
.chat-header{background:#17212b;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0e1621;flex-shrink:0}
.chat-back{background:0 0;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.chat-back svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.chat-header-info{flex:1;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:10px}
.chat-header-info:active{opacity:.8}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0}
.chat-header-avatar img{width:100%;height:100%;object-fit:cover}
.chat-header-text{flex:1}
.chat-header-name{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:4px}
.chat-header-status{font-size:.75rem;color:#6c7883}
.chat-header-actions{display:flex;gap:4px}
.chat-header-actions button{background:0 0;border:none;cursor:pointer;padding:8px;pointer-events:auto}
.chat-header-actions svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.messages-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0e1621}
.message-row{display:flex;align-items:flex-end;gap:8px;max-width:85%}
.message-row.sent{align-self:flex-end;flex-direction:row-reverse}
.message-row.received{align-self:flex-start}
.message-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
.message-avatar img{width:100%;height:100%;object-fit:cover}
.message-content{display:flex;flex-direction:column;gap:2px}
.message-sender{font-size:.75rem;color:#5ba4d9;font-weight:600;padding:0 4px}
.message-bubble{padding:8px 12px;border-radius:12px;word-wrap:break-word;animation:messageIn .3s ease;position:relative;min-width:80px}
@keyframes messageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message-row.sent .message-bubble{background:#2b5278;border-bottom-left-radius:4px}
.message-row.received .message-bubble{background:#182533;border-bottom-right-radius:4px}
.message-bubble.system{align-self:center;background:rgba(91,164,217,.15);border-radius:16px;max-width:85%;text-align:center;font-size:.82rem;color:#5ba4d9;padding:8px 14px;font-style:italic}
.message-text{font-size:.92rem;line-height:1.5}
.message-text a{color:#5ba4d9;text-decoration:none;word-break:break-all;cursor:pointer}
.message-media{max-width:100%;border-radius:8px;margin-bottom:4px;cursor:pointer;pointer-events:auto}
.message-media img{max-width:100%;border-radius:8px;max-height:250px;object-fit:cover}
.message-media video{max-width:100%;border-radius:8px;max-height:250px}
.message-media audio{width:220px}
.message-file{background:rgba(255,255,255,.1);border-radius:8px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:4px;cursor:pointer;pointer-events:auto;min-width:200px}
.message-file-icon{width:40px;height:40px;background:#5ba4d9;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.message-file-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.message-file-info{flex:1;min-width:0}
.message-file-name{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.message-file-size{font-size:.7rem;color:rgba(255,255,255,.5)}
.message-download{background:#5ba4d9;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;flex-shrink:0}
.message-download svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.upload-status{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#5ba4d9;margin-top:4px}
.upload-spinner{width:12px;height:12px;border:2px solid rgba(91,164,217,.3);border-top-color:#5ba4d9;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.message-input-area{background:#17212b;padding:8px 12px;display:flex;align-items:flex-end;gap:8px;border-top:1px solid #0e1621;flex-shrink:0}
.message-input-wrapper{flex:1;background:#242f3d;border-radius:20px;padding:8px 14px;display:flex;align-items:center}
.message-input{flex:1;background:0 0;border:none;color:#fff;font-size:.95rem;font-family:'Vazirmatn',sans-serif;outline:0;resize:none;max-height:120px;-webkit-user-select:text;user-select:text}
.message-input::placeholder{color:#6c7883}
.attach-btn,.voice-btn{background:0 0;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.attach-btn svg,.voice-btn svg{width:24px;height:24px;fill:none;stroke:#6c7883;stroke-width:2}
.send-btn{width:44px;height:44px;border-radius:50%;background:#5ba4d9;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;pointer-events:auto}
.send-btn:active{transform:scale(.92)}
.send-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.voice-recording{display:flex;align-items:center;gap:10px;flex:1;background:#242f3d;border-radius:20px;padding:8px 14px}
.voice-recording .rec-dot{width:12px;height:12px;background:#e74c3c;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.voice-recording .rec-time{font-size:.9rem;color:#fff;flex:1}
.voice-preview{display:flex;align-items:center;gap:8px;flex:1;background:#242f3d;border-radius:20px;padding:8px 14px}
.voice-preview audio{flex:1;height:36px}
.voice-actions{display:flex;gap:6px}
.voice-actions button{background:0 0;border:none;cursor:pointer;padding:8px;pointer-events:auto}
.voice-actions button svg{width:24px;height:24px;fill:none;stroke-width:2}
.voice-actions .cancel-btn svg{stroke:#e74c3c}
.voice-actions .send-voice-btn svg{stroke:#2ecc71}
.bottom-sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;display:none;opacity:0;transition:opacity .3s}
.bottom-sheet-overlay.active{display:block;opacity:1}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:#17212b;border-radius:20px 20px 0 0;z-index:301;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
.bottom-sheet.active{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;margin:10px auto}
.sheet-header{text-align:center;padding:10px 20px 20px;position:relative}
.sheet-close{position:absolute;top:15px;left:15px;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.sheet-close svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.sheet-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700;color:#fff}
.sheet-avatar img{width:100%;height:100%;object-fit:cover}
.sheet-name{font-size:1.3rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.sheet-type{font-size:.85rem;color:#6c7883;margin-bottom:8px}
.sheet-members{font-size:.9rem;color:#5ba4d9;margin-bottom:8px}
.sheet-link{font-size:.82rem;color:#5ba4d9;direction:ltr;margin-bottom:8px;word-break:break-all;background:rgba(91,164,217,.1);padding:8px 12px;border-radius:8px;cursor:pointer;pointer-events:auto}
.sheet-bio{font-size:.88rem;color:#a0b0c0;line-height:1.6;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:8px;max-width:90%;margin:0 auto}
.sheet-bio a{color:#5ba4d9;text-decoration:none}
.sheet-section{border-top:1px solid rgba(255,255,255,.05);padding:12px 20px}
.sheet-section-title{font-size:.85rem;color:#5ba4d9;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.add-member-btn{background:#5ba4d9;border:none;border-radius:16px;padding:4px 12px;color:#fff;font-size:.75rem;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:4px}
.add-member-btn svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.member-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.member-avatar{width:40px;height:40px;border-radius:50%;margin-left:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-info{flex:1}
.member-name{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.member-role{font-size:.75rem;color:#6c7883}
.owner-badge{background:#f39c12;color:#fff;font-size:.65rem;padding:2px 6px;border-radius:8px}
.admin-badge{background:#5ba4d9;color:#fff;font-size:.65rem;padding:2px 6px;border-radius:8px}
.sheet-actions{padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px}
.sheet-action-btn{width:100%;background:#242f3d;border:none;border-radius:12px;padding:12px;color:#fff;font-size:.95rem;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.sheet-action-btn:active{background:#2f3d4d}
.sheet-action-btn.primary{background:#5ba4d9}
.sheet-action-btn.danger{background:#e74c3c}
.sheet-action-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.page-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0e1621;z-index:200;display:none;flex-direction:column}
.page-overlay.active{display:flex}
.page-header{background:#17212b;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0e1621;flex-shrink:0}
.page-title{font-size:1.2rem;font-weight:700;flex:1}
.back-btn{background:0 0;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.back-btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.edit-page{padding:20px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;align-items:center}
.edit-avatar-circle{width:130px;height:130px;border-radius:50%;margin:10px auto 20px;background:linear-gradient(135deg,#5ba4d9,#4a93c8);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:700;color:#fff;cursor:pointer;pointer-events:auto;position:relative;overflow:hidden;border:4px solid rgba(91,164,217,.4);box-shadow:0 8px 30px rgba(91,164,217,.3)}
.edit-avatar-circle img{width:100%;height:100%;object-fit:cover}
.edit-avatar-circle .edit-badge{position:absolute;bottom:5px;right:5px;background:#5ba4d9;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #0e1621}
.edit-avatar-circle .edit-badge svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5}
.edit-form{width:100%;max-width:400px}
.edit-group{margin-bottom:18px}
.edit-label{display:block;font-size:.85rem;color:#a0b0c0;margin-bottom:8px;font-weight:500}
.edit-input{width:100%;background:#242f3d;border:1px solid rgba(91,164,217,.3);border-radius:12px;color:#fff;font-size:1rem;padding:12px 14px;font-family:'Vazirmatn',sans-serif;outline:0;-webkit-user-select:text;user-select:text}
.edit-input:focus{border-color:#5ba4d9}
.edit-textarea{min-height:100px;resize:vertical}
.edit-submit{width:100%;background:linear-gradient(135deg,#5ba4d9,#4a93c8);border:none;border-radius:12px;padding:14px;color:#fff;font-size:1rem;font-weight:700;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;margin-top:10px}
.edit-submit:active{transform:scale(.98)}
.create-buttons{display:flex;gap:10px;padding:12px 16px;background:rgba(91,164,217,.1);margin-bottom:10px}
.create-btn{flex:1;background:linear-gradient(135deg,#5ba4d9,#4a93c8);border:none;border-radius:12px;padding:12px;color:#fff;font-size:.9rem;font-weight:600;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.create-btn:active{transform:scale(.95)}
.create-btn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
.section-title{padding:12px 16px;font-size:.85rem;color:#5ba4d9;font-weight:600;background:rgba(91,164,217,.1);margin-bottom:8px}
.contact-item{display:flex;align-items:center;padding:12px 16px;cursor:pointer;pointer-events:auto;border-bottom:1px solid rgba(255,255,255,.03)}
.contact-item:active{background:#17212b}
.contact-avatar{width:48px;height:48px;border-radius:50%;margin-left:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.contact-avatar img{width:100%;height:100%;object-fit:cover}
.contact-info{flex:1}
.contact-name{font-size:.95rem;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.contact-status{font-size:.78rem;color:#6c7883}
.search-page-input{width:100%;background:#242f3d;border:none;border-radius:12px;color:#fff;font-size:1rem;padding:12px 16px;font-family:'Vazirmatn',sans-serif;outline:0;margin:12px 16px;-webkit-user-select:text;user-select:text}
.search-page-input::placeholder{color:#6c7883}
.search-results{flex:1;overflow-y:auto;padding:0 16px}
.search-empty{text-align:center;padding:60px 20px;color:#6c7883;line-height:1.8}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:400;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-content{background:#17212b;width:100%;max-height:80vh;border-radius:20px 20px 0 0;padding:20px;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.1)}
.modal-title{font-size:1.2rem;font-weight:700}
.modal-close{background:0 0;border:none;cursor:pointer;padding:5px;pointer-events:auto}
.modal-close svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:500;display:none;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.toast.error{background:#e74c3c;color:#fff}
.toast.success{background:#2ecc71;color:#fff}
.toast.show{display:block;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.context-menu{position:fixed;background:#17212b;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:350;display:none;min-width:200px;overflow:hidden}
.context-menu.active{display:block}
.context-menu-item{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;pointer-events:auto;border-bottom:1px solid rgba(255,255,255,.05)}
.context-menu-item:active{background:rgba(91,164,217,.1)}
.context-menu-item svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
.context-menu-item.danger{color:#e74c3c}
.context-menu-item.danger svg{stroke:#e74c3c}
.media-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:450;display:none;align-items:center;justify-content:center;flex-direction:column}
.media-viewer.active{display:flex}
.media-viewer img,.media-viewer video{max-width:100%;max-height:80vh;object-fit:contain}
.media-viewer-close{position:absolute;top:15px;left:15px;background:rgba(255,255,255,.2);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.media-viewer-close svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.media-viewer-actions{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.media-viewer-actions button{background:rgba(255,255,255,.2);border:none;border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.media-viewer-actions button svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.pinned-notice{background:rgba(91,164,217,.15);border-right:3px solid #5ba4d9;padding:8px 12px;margin:0 12px;border-radius:8px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:8px}
.pinned-notice svg{width:18px;height:18px;fill:none;stroke:#5ba4d9;stroke-width:2;flex-shrink:0}
.pinned-notice-text{font-size:.82rem;color:#5ba4d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.channel-notice{background:rgba(91,164,217,.1);border:1px solid #5ba4d9;border-radius:8px;padding:10px;text-align:center;font-size:.85rem;color:#5ba4d9;margin:10px}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:#5ba4d9;border-radius:50%;flex-shrink:0}
.verified-badge svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:3}
.screenshot-protected{filter:blur(20px)!important;transition:filter .1s}
.user-profile-page{position:fixed;top:0;left:0;right:0;bottom:0;background:#0e1621;z-index:250;display:none;flex-direction:column;overflow-y:auto}
.user-profile-page.active{display:flex}
.user-profile-header{background:#17212b;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0e1621;position:sticky;top:0;z-index:10}
.user-profile-back{background:0 0;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.user-profile-back svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.user-profile-title{font-size:1.2rem;font-weight:700;flex:1}
.user-profile-content{padding:20px 16px;display:flex;flex-direction:column;align-items:center}
.user-profile-avatar{width:120px;height:120px;border-radius:50%;overflow:hidden;margin-bottom:15px;border:3px solid rgba(91,164,217,.3);background:linear-gradient(135deg,#5ba4d9,#4a93c8);display:flex;align-items:center;justify-content:center}
.user-profile-avatar img{width:100%;height:100%;object-fit:cover}
.user-profile-name{font-size:1.5rem;font-weight:700;margin-bottom:5px;text-align:center;display:flex;align-items:center;gap:6px}
.user-profile-status{font-size:.85rem;color:#6c7883;margin-bottom:25px;text-align:center}
.user-profile-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-bottom:25px}
.user-profile-btn{background:#17212b;border:none;border-radius:12px;padding:15px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;pointer-events:auto}
.user-profile-btn:active{background:#242f3d}
.user-profile-btn svg{width:24px;height:24px;fill:none;stroke:#5ba4d9;stroke-width:2}
.user-profile-btn span{font-size:.7rem;color:#fff}
.user-profile-bio-section{width:100%;background:#17212b;border-radius:12px;padding:15px;margin-bottom:15px}
.user-profile-bio-label{font-size:.85rem;color:#6c7883;margin-bottom:8px}
.user-profile-bio-text{font-size:.9rem;line-height:1.6;color:#c0d0e0;white-space:pre-wrap;word-wrap:break-word}
.user-profile-bio-text a{color:#5ba4d9;text-decoration:none}
.user-profile-id-section{width:100%;background:#17212b;border-radius:12px;padding:15px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.user-profile-id-label{font-size:.85rem;color:#6c7883}
.user-profile-id-value{font-size:.95rem;color:#5ba4d9;font-weight:500}
.user-profile-iranoo-section{width:100%;background:#17212b;border-radius:12px;padding:15px;margin-bottom:15px;opacity:.5;pointer-events:none}
.user-profile-iranoo-label{font-size:.9rem;color:#6c7883;text-align:center}
@media(max-width:400px){.header-title{font-size:1.2rem}.chat-avatar{width:48px;height:48px}}
</style>

<script>
const REDIS_URL='https://smooth-werewolf-200782.upstash.io',REDIS_TOKEN='gQAAAAAAAxBOAAIgcDFjN2NiMjYxOWNlNjE0NzgyOTExM2JjMjA5ZTc0MjVjMA',REDIS_KEY='iran_app_v4';
async function redisGet(k){const r=await fetch(REDIS_URL+'/get/'+k,{headers:{Authorization:'Bearer '+REDIS_TOKEN}});if(!r.ok)throw Error('Redis GET fail');const d=await r.json();return d.result?JSON.parse(d.result):null}
async function redisSet(k,v){const r=await fetch(REDIS_URL+'/set/'+k,{method:'POST',headers:{Authorization:'Bearer '+REDIS_TOKEN,'Content-Type':'text/plain'},body:JSON.stringify(v)});if(!r.ok)throw Error('Redis SET fail')}
let APP_DATA=null;
async function loadData(){try{const d=await redisGet(REDIS_KEY);APP_DATA=d||{users:{},chats:[],groups:[],channels:[],memberships:{},blocked:{},supportMessages:{}};if(!d)await saveData()}catch(e){APP_DATA={users:JSON.parse(localStorage.getItem('iran_users')||'{}'),chats:JSON.parse(localStorage.getItem('iran_chats')||'[]'),groups:JSON.parse(localStorage.getItem('iran_groups')||'[]'),channels:JSON.parse(localStorage.getItem('iran_channels')||'[]'),memberships:JSON.parse(localStorage.getItem('iran_memberships')||'{}'),blocked:JSON.parse(localStorage.getItem('iran_blocked')||'{}'),supportMessages:JSON.parse(localStorage.getItem('iran_support_messages')||'{}')};await saveData()}}
async function saveData(){try{await redisSet(REDIS_KEY,APP_DATA)}catch(e){localStorage.setItem('iran_users',JSON.stringify(APP_DATA.users));localStorage.setItem('iran_chats',JSON.stringify(APP_DATA.chats));localStorage.setItem('iran_groups',JSON.stringify(APP_DATA.groups));localStorage.setItem('iran_channels',JSON.stringify(APP_DATA.channels));localStorage.setItem('iran_memberships',JSON.stringify(APP_DATA.memberships));localStorage.setItem('iran_blocked',JSON.stringify(APP_DATA.blocked));localStorage.setItem('iran_support_messages',JSON.stringify(APP_DATA.supportMessages))}}
function getUsers(){return APP_DATA.users||{}}
function setUsers(u){APP_DATA.users=u;saveData()}
function getChats(){return APP_DATA.chats||[]}
function setChats(c){APP_DATA.chats=c;saveData()}
function getGroups(){return APP_DATA.groups||[]}
function setGroups(g){APP_DATA.groups=g;saveData()}
function getChannels(){return APP_DATA.channels||[]}
function setChannels(c){APP_DATA.channels=c;saveData()}
function getMemberships(){return APP_DATA.memberships||{}}
function setMemberships(m){APP_DATA.memberships=m;saveData()}
function getBlocked(){return APP_DATA.blocked||{}}
function setBlocked(b){APP_DATA.blocked=b;saveData()}
function getSupportMessages(){return APP_DATA.supportMessages||{}}

function openEditPage(){if(!currentSheet||!isOwnerOrAdminOf(currentSheet.data)){showToast('فقط مالک و مدیر','error');return}closeProfileSheet();setTimeout(()=>{const item=currentSheet.data;editingItemId=item.id;editingItemType=currentSheet.type;document.getElementById('editPageTitle').textContent='ویرایش '+(currentSheet.type==='group'?'گروه':'کانال');document.getElementById('editName').value=item.name;document.getElementById('editBio').value=item.bio||'';document.getElementById('editLink').value=item.link||'';editAvatar=item.avatar||null;const circle=document.getElementById('editAvatarCircle');if(editAvatar){circle.innerHTML='<img src="'+editAvatar+'"><div class="edit-badge"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><input type="file" id="editAvatarFile" accept="image/*" style="display:none" onchange="handleEditAvatarUpload(event)">'}else{circle.innerHTML='<span id="editAvatarInitials">'+getInitials(item.name)+'</span><div class="edit-badge"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><input type="file" id="editAvatarFile" accept="image/*" style="display:none" onchange="handleEditAvatarUpload(event)">'}document.getElementById('editPage').classList.add('active')},400)}

function saveEdit(){if(!editingItemId)return;const name=document.getElementById('editName').value.trim(),bio=document.getElementById('editBio').value.trim(),link=document.getElementById('editLink').value.trim();if(!name){showToast('نام را وارد کنید','error');return}const item=editingItemType==='group'?groups.find(g=>g.id===editingItemId):channels.find(c=>c.id===editingItemId);if(!item){showToast('یافت نشد','error');return}const oldName=item.name;item.name=name;item.bio=bio;if(editAvatar)item.avatar=editAvatar;if(link&&link!==item.link){if(link.startsWith('Iran/Kan/')||link.startsWith('Iran/Gor/'))item.link=link;else{item.link=generateLink(editingItemType);showToast('لینک با فرمت صحیح ساخته شد: '+item.link,'success')}}if(oldName!==name)item.messages.push({id:'s'+Date.now(),text:'نام از "'+oldName+'" به "'+name+'" تغییر کرد',time:getCurrentTime(),sent:!1,system:!0});if(editAvatar)item.messages.push({id:'s'+Date.now(),text:'تصویر پروفایل تغییر کرد',time:getCurrentTime(),sent:!1,system:!0});if(bio!==(item.bio||''))item.messages.push({id:'s'+Date.now(),text:'توضیحات تغییر کرد',time:getCurrentTime(),sent:!1,system:!0});if(editingItemType==='group'){const idx=groups.findIndex(g=>g.id===editingItemId);if(idx>-1)groups[idx]=item;setGroups(groups)}else{const idx=channels.findIndex(c=>c.id===editingItemId);if(idx>-1)channels[idx]=item;setChannels(channels)}showToast('✅ تمام تغییرات ذخیره شد','success');closeEditPage();renderChats();if(currentChat&&currentChat.data.id===editingItemId){document.getElementById('chatHeaderName').innerHTML=name+(item.verified?' <span class="verified-badge"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></span>':'');if(editAvatar)document.getElementById('chatHeaderAvatar').innerHTML='<img src="'+editAvatar+'"'}}
function regenerateLink(){if(!currentSheet||!isOwnerOrAdminOf(currentSheet.data)){showToast('فقط مالک و مدیر','error');return}if(confirm('لینک قبلی باطل و لینک جدید ساخته شود؟')){currentSheet.data.link=generateLink(currentSheet.type);currentSheet.data.messages.push({id:'s'+Date.now(),text:'لینک دعوت تغییر کرد: '+currentSheet.data.link,time:getCurrentTime(),sent:!1,system:!0});if(currentSheet.type==='group'){const idx=groups.findIndex(g=>g.id===currentSheet.data.id);if(idx>-1)groups[idx]=currentSheet.data;setGroups(groups)}else{const idx=channels.findIndex(c=>c.id===currentSheet.data.id);if(idx>-1)channels[idx]=currentSheet.data;setChannels(channels)}renderSheet();showToast('لینک جدید: '+currentSheet.data.link,'success')}}

function joinItem(){if(!currentSheet)return;const item=currentSheet.data;if(currentSheet.type==='group'){if(!item.members)item.members=[];if(item.members.includes(currentUser?.id)){showToast('قبلاً عضو هستید','error');return}item.members.push(currentUser?.id);item.memberCount=(item.memberCount||0)+1;item.messages.push({id:'s'+Date.now(),text:currentUser?.name+' به گروه پیوست',time:getCurrentTime(),sent:!1,system:!0})}else{item.memberCount=(item.memberCount||0)+1;item.messages.push({id:'s'+Date.now(),text:currentUser?.name+' به کانال پیوست',time:getCurrentTime(),sent:!1,system:!0})}const memberships=getMemberships();if(!memberships[currentUser.id])memberships[currentUser.id]=[];memberships[currentUser.id].push({itemId:item.id,type:currentSheet.type,role:'member',userId:currentUser?.id,joinedAt:new Date().toISOString()});setMemberships(memberships);if(currentSheet.type==='group'){const idx=groups.findIndex(g=>g.id===item.id);if(idx>-1)groups[idx]=item;setGroups(groups)}else{const idx=channels.findIndex(c=>c.id===item.id);if(idx>-1)channels[idx]=item;setChannels(channels)}renderSheet();renderChats();showToast('پیوستید','success');setTimeout(()=>{closeProfileSheet();openChatPage(currentSheet.type,item.id)},1e3)}
function leaveItem(){if(!currentSheet)return;const item=currentSheet.data;if(item.ownerId===currentUser?.id){showToast('مالک نمی‌تواند ترک کند','error');return}if(currentSheet.type==='group'&&item.members){const idx=item.members.indexOf(currentUser?.id);if(idx>-1)item.members.splice(idx,1);item.memberCount=Math.max(0,(item.memberCount||0)-1);item.messages.push({id:'s'+Date.now(),text:currentUser?.name+' گروه را ترک کرد',time:getCurrentTime(),sent:!1,system:!0})}else{item.memberCount=Math.max(0,(item.memberCount||0)-1);item.messages.push({id:'s'+Date.now(),text:currentUser?.name+' کانال را ترک کرد',time:getCurrentTime(),sent:!1,system:!0})}const memberships=getMemberships();if(memberships[currentUser.id]){memberships[currentUser.id]=memberships[currentUser.id].filter(m=>m.itemId!==item.id);setMemberships(memberships)}if(currentSheet.type==='group'){const idx=groups.findIndex(g=>g.id===item.id);if(idx>-1)groups[idx]=item;setGroups(groups)}else{const idx=channels.findIndex(c=>c.id===item.id);if(idx>-1)channels[idx]=item;setChannels(channels)}showToast('ترک کردید','success');setTimeout(()=>{closeProfileSheet();closeChat();renderChats()},1e3)}
function deleteGroup(){if(!currentSheet)return;if(!confirm('حذف شود؟'))return;const item=currentSheet.data;if(currentSheet.type==='group'){groups=groups.filter(g=>g.id!==item.id);setGroups(groups)}else{channels=channels.filter(c=>c.id!==item.id);setChannels(channels)}const memberships=getMemberships();if(memberships[currentUser.id]){memberships[currentUser.id]=memberships[currentUser.id].filter(m=>m.itemId!==item.id);setMemberships(memberships)}showToast('حذف شد','success');setTimeout(()=>{closeProfileSheet();closeChat();renderChats()},1e3)}

function closeCreatePage(){document.getElementById('createPage').classList.remove('active')}
function handleCreateAvatarUpload(e){const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=function(ev){selectedAvatar=ev.target.result;const circle=document.getElementById('createAvatarCircle');circle.innerHTML='<img src="'+selectedAvatar+'"><div class="edit-badge"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><input type="file" id="createAvatarFile" accept="image/*" style="display:none" onchange="handleCreateAvatarUpload(event)">'};reader.readAsDataURL(file)}}
function submitCreate(){const name=document.getElementById('createName').value.trim(),bio=document.getElementById('createBio').value.trim();if(!name){showToast('نام را وارد کنید','error');return}const newLink=generateLink(createType),newItem={id:'c_'+Date.now(),name,link:newLink,bio,avatar:selectedAvatar,ownerId:currentUser.id,ownerName:currentUser.name,members:createType==='group'?[currentUser.id]:[],admins:[],memberCount:createType==='group'?1:0,createdAt:getCurrentDate(),messages:[{id:'s'+Date.now(),text:(createType==='group'?'گروه':'کانال')+' "'+name+'" ایجاد شد\nلینک دعوت: '+newLink,time:getCurrentTime(),sent:!1,system:!0}],hiddenMembers:!1,pinnedMessage:null,restrictCopy:!1,restrictForward:!1,restrictScreenshot:!1,slowMode:0,verified:!1,unread:0,read:!0,lastMessage:(createType==='group'?'گروه':'کانال')+' "'+name+'" ایجاد شد',time:getCurrentTime(),online:!0};if(createType==='group'){groups.push(newItem);setGroups(groups)}else{channels.push(newItem);setChannels(channels)}const memberships=getMemberships();if(!memberships[currentUser.id])memberships[currentUser.id]=[];memberships[currentUser.id].push({itemId:newItem.id,type:createType,role:'owner',userId:currentUser.id,joinedAt:new Date().toISOString()});setMemberships(memberships);showToast((createType==='group'?'گروه':'کانال')+' ایجاد شد\nلینک: '+newLink,'success');closeCreatePage();renderChats();setTimeout(()=>openChatPage(createType,newItem.id),300)}
function openAddMemberModal(){if(!currentSheet)return;if(!isOwnerOrAdminOf(currentSheet.data)){showToast('فقط مالک و مدیر','error');return}document.getElementById('addMemberModal').classList.add('active');renderAddMemberList()}
function closeAddMemberModal(){document.getElementById('addMemberModal').classList.remove('active')}
function renderAddMemberList(){const users=getUsers(),list=Object.values(users).filter(u=>u.id!==currentUser?.id),item=currentSheet.data,memberships=getMemberships(),existing=(memberships[currentUser.id]||[]).filter(m=>m.itemId===item.id).map(m=>m.userId),avail=list.filter(u=>!existing.includes(u.id)),container=document.getElementById('addMemberList');if(!avail.length){container.innerHTML='<div style="text-align:center;padding:30px;color:#6c7883">مخاطبی نیست</div>';return}container.innerHTML=avail.map(u=>'<div class="contact-item" onclick="addMemberToChannel(\''+u.id+'\')"><div class="contact-avatar" style="background:'+getColor(u.name)+'">'+(u.avatar?`<img src="${u.avatar}">`:getInitials(u.name))+'</div><div class="contact-info"><div class="contact-name">'+u.name+'</div><div class="contact-status">'+u.id+'</div></div></div>').join('')}
function addMemberToChannel(uid){if(!currentSheet)return;const item=currentSheet.data,users=getUsers(),user=users[uid],memberships=getMemberships(),already=(memberships[currentUser.id]||[]).some(m=>m.itemId===item.id&&m.userId===uid);if(already){showToast('قبلاً عضو است','error');return}item.memberCount=(item.memberCount||0)+1;item.messages.push({id:'s'+Date.now(),text:(user?user.name:'کاربر')+' به کانال اضافه شد',time:getCurrentTime(),sent:!1,system:!0});if(!memberships[currentUser.id])memberships[currentUser.id]=[];memberships[currentUser.id].push({itemId:item.id,type:'channel',role:'member',userId:uid,joinedAt:new Date().toISOString()});setMemberships(memberships);if(currentSheet.type==='group'){const idx=groups.findIndex(g=>g.id===item.id);if(idx>-1)groups[idx]=item;setGroups(groups)}else{const idx=channels.findIndex(c=>c.id===item.id);if(idx>-1)channels[idx]=item;setChannels(channels)}showToast((user?user.name:'کاربر')+' اضافه شد','success');renderSheet();closeAddMemberModal()}
function openSettings(){if(!currentSheet||!isOwnerOrAdminOf(currentSheet.data))return;const d=currentSheet.data;document.getElementById('setRestrictCopy').checked=!!d.restrictCopy;document.getElementById('setRestrictForward').checked=!!d.restrictForward;document.getElementById('setRestrictScreenshot').checked=!!d.restrictScreenshot;document.getElementById('setSlowMode').value=d.slowMode||0;document.getElementById('settingsModal').classList.add('active')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('active')}
function saveSettings(){if(!currentSheet)return;const d=currentSheet.data;d.restrictCopy=document.getElementById('setRestrictCopy').checked;d.restrictForward=document.getElementById('setRestrictForward').checked;d.restrictScreenshot=document.getElementById('setRestrictScreenshot').checked;d.slowMode=parseInt(document.getElementById('setSlowMode').value);if(currentSheet.type==='group'){const idx=groups.findIndex(g=>g.id===d.id);if(idx>-1)groups[idx]=d;setGroups(groups)}else if(currentSheet.type==='channel'){const idx=channels.findIndex(c=>c.id===d.id);if(idx>-1)channels[idx]=d;setChannels(channels)}else{const idx=chats.findIndex(c=>c.id===d.id);if(idx>-1)chats[idx]=d;setChats(chats)}closeSettings();showToast('تنظیمات ذخیره شد','success')}
function showHeaderMenu(){if(!currentChat)return;const menu=document.getElementById('contextMenu');let html='';if(currentChat.type==='personal'){const blocked=(getBlocked()[currentUser.id]||[]).includes(currentChat.data.id);html+='<div class="context-menu-item danger" onclick="deletePVChat()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>حذف گفتگو</div>';html+='<div class="context-menu-item" onclick="toggleBlockUser()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>'+(blocked?'رفع مسدودی':'مسدود کردن')+'</div>';html+='<div class="context-menu-item danger" onclick="openReportModal(\'personal\')"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>گزارش</div>'}else if(currentChat.type==='support'){html+='<div class="context-menu-item danger" onclick="openReportModal(\'support\')"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>گزارش</div>'}else{html+='<div class="context-menu-item danger" onclick="openReportModal(\''+currentChat.type+'\')"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>گزارش</div>'}menu.innerHTML=html;const rect=document.querySelector('.chat-header-actions button').getBoundingClientRect();menu.style.left=(rect.left-100)+'px';menu.style.top=(rect.bottom+5)+'px';menu.classList.add('active');setTimeout(()=>document.addEventListener('click',hideContextMenu,{once:!0}),10)}
function deletePVChat(){hideContextMenu();if(!currentChat||currentChat.type!=='personal')return;chats=chats.filter(c=>c.id!==currentChat.data.id);setChats(chats);closeChat();renderChats();showToast('گفتگو حذف شد','success')}
function toggleBlockUser(){hideContextMenu();if(!currentChat||currentChat.type!=='personal')return;const uid=currentChat.data.id,blocked=getBlocked();if(!blocked[currentUser.id])blocked[currentUser.id]=[];const idx=blocked[currentUser.id].indexOf(uid);if(idx>-1){blocked[currentUser.id].splice(idx,1);showToast('کاربر از مسدودی خارج شد','success')}else{blocked[currentUser.id].push(uid);showToast('کاربر مسدود شد','success')}setBlocked(blocked)}
function openReportModal(t){hideContextMenu();window.reportTargetType=t;document.getElementById('reportReason').value='spam';document.getElementById('reportDesc').value='';document.getElementById('reportModal').classList.add('active')}
function closeReportModal(){document.getElementById('reportModal').classList.remove('active')}
function submitReport(){const reason=document.getElementById('reportReason').value,desc=document.getElementById('reportDesc').value.trim();if(!desc){showToast('لطفاً توضیحات را وارد کنید','error');return}console.log('Report:',{type:window.reportTargetType,chatId:currentChat?.data?.id,reason,desc});closeReportModal();showToast('گزارش شما ثبت شد','success')}
function openSearchPage(){document.getElementById('searchPage').classList.add('active');document.getElementById('searchPageInput').value='';document.getElementById('searchResults').innerHTML='<div class="search-empty">برای جستجو، کلمه‌ای وارد کنید<br>مثلاً: #ایران</div>';setTimeout(()=>document.getElementById('searchPageInput').focus(),300)}
function closeSearchPage(){document.getElementById('searchPage').classList.remove('active')}
document.getElementById('searchPageInput').addEventListener('input',function(e){const q=e.target.value.trim().toLowerCase(),res=document.getElementById('searchResults');if(!q){res.innerHTML='<div class="search-empty">برای جستجو، کلمه‌ای وارد کنید<br>مثلاً: #ایران</div>';return}const all=[...groups,...channels],filtered=all.filter(i=>i.name.toLowerCase().includes(q)||(i.bio||'').toLowerCase().includes(q));if(!filtered.length){res.innerHTML='<div class="search-empty">نتیجه‌ای یافت نشد</div>';return}res.innerHTML=filtered.map(i=>{const type=groups.includes(i)?'group':'channel',typeName=type==='group'?'گروه':'کانال',joined=isMemberOf(i);return'<div class="chat-item" onclick="openChatPage(\''+type+'\',\''+i.id+'\');closeSearchPage();"><div class="chat-avatar" style="background:'+getColor(i.name)+'">'+(i.avatar?`<img src="${i.avatar}">`:getInitials(i.name))+'</div><div class="chat-info"><div class="chat-top"><div class="chat-name">'+i.name+'</div><div class="chat-time">'+typeName+'</div></div><div class="chat-bottom"><div class="chat-message">'+(i.bio?i.bio.substring(0,50):'بدون توضیحات')+'</div>'+(joined?'<div style="color:#2ecc71;font-size:0.75rem">عضو هستید</div>':'')+'</div></div></div>'}).join('')});
function openGroupByLink(link){const all=[...groups,...channels],found=all.find(g=>g.link===link);if(found){const type=groups.includes(found)?'group':'channel';if(!isMemberOf(found)){const item=found;if(type==='group'){if(!item.members)item.members=[];if(!item.members.includes(currentUser.id)){item.members.push(currentUser.id);item.memberCount=(item.memberCount||0)+1;item.messages.push({id:'s'+Date.now(),text:currentUser.name+' به گروه پیوست',time:getCurrentTime(),sent:!1,system:!0})}}else{item.memberCount=(item.memberCount||0)+1;item.messages.push({id:'s'+Date.now(),text:currentUser.name+' به کانال پیوست',time:getCurrentTime(),sent:!1,system:!0})}const memberships=getMemberships();if(!memberships[currentUser.id])memberships[currentUser.id]=[];memberships[currentUser.id].push({itemId:item.id,type,role:'member',userId:currentUser.id,joinedAt:new Date().toISOString()});setMemberships(memberships);if(type==='group'){const idx=groups.findIndex(g=>g.id===item.id);if(idx>-1)groups[idx]=item;setGroups(groups)}else{const idx=channels.findIndex(c=>c.id===item.id);if(idx>-1)channels[idx]=item;setChannels(channels)}showToast('به گروه/کانال پیوستید','success')}openChatPage(type,found.id)}else showToast('گروه/کانال یافت نشد','error')}
function openUserById(id){showToast('پروفایل '+id,'success')}
async function initApp(){await loadData();chats=getChats();groups=getGroups();channels=getChannels();myMemberships=getMemberships();blockedUsers=getBlocked()[currentUser.id]||[];supportMessages=getSupportMessages();Object.keys(SUPPORT_ACCOUNTS).forEach(sid=>{const cid=getSupportChatId(sid);if(!chats.find(c=>c.id===cid)){const chat={id:cid,name:SUPPORT_ACCOUNTS[sid].name,type:'support',supportId:sid,lastMessage:'سلام! به پشتیبانی ایران خوش آمدید 🇮🇷',time:'الان',unread:0,read:!0,online:!0,avatar:SUPPORT_ACCOUNTS[sid].avatar,messages:[{id:'m_init',text:'سلام! به پشتیبانی ایران خوش آمدید 🇮🇷\nچطور می‌توانم کمکتان کنم؟',time:getCurrentTime(),timestamp:Date.now(),sent:!1,userId:sid}],ownerId:sid,verified:!0,restrictCopy:!1,restrictForward:!1,restrictScreenshot:!1,slowMode:0};chats.push(chat)}});setChats(chats);renderChats();setInterval(async()=>{await loadData();chats=getChats();groups=getGroups();channels=getChannels();myMemberships=getMemberships();blockedUsers=getBlocked()[currentUser.id]||[];supportMessages=getSupportMessages();renderChats();if(currentChat){const fresh=[...chats,...groups,...channels].find(c=>c.id===currentChat.data.id);if(fresh){currentChat.data=fresh;if(document.getElementById('chatPage').classList.contains('active')){renderMessages();updatePinnedNotice()}}}},2e3)}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',function(e){if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault()});document.addEventListener('touchstart',function(e){if(e.touches.length>1)e.preventDefault()},{passive:!1});let lastTouchEnd=0;document.addEventListener('touchend',function(e){const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},!1);document.addEventListener('keyup',(e)=>{if(e.key==='PrintScreen'&&currentChat&&currentChat.data.restrictScreenshot){e.preventDefault();showToast('اسکرین‌شات در این گفتگو غیرمجاز است','error');document.body.classList.add('screenshot-protected');setTimeout(()=>document.body.classList.remove('screenshot-protected'),1500)}});document.addEventListener('visibilitychange',()=>{if(currentChat&&currentChat.data.restrictScreenshot){if(document.hidden)document.body.classList.add('screenshot-protected');else document.body.classList.remove('screenshot-protected')}});
initApp();
window.addEventListener('load',()=>{const hash=window.location.hash;if(hash.startsWith('#/')){const link=hash.substring(2);setTimeout(()=>openGroupByLink(link),500)}});
</script>
