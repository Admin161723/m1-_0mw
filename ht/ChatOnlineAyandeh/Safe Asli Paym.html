<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ایران - پیام‌رسان</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#0e1621;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ===== هدر ===== */
.header{background:#17212b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0e1621;flex-shrink:0;z-index:50}
.header-right{display:flex;align-items:center;gap:10px}
.header-logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.header-logo img{width:100%;height:100%;object-fit:contain}
.header-title{font-size:1.4rem;font-weight:900}
.header-left{display:flex;align-items:center;gap:8px}
.header-btn{background:none;border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.header-btn:active{background:rgba(255,255,255,0.1)}
.header-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}

/* ===== لیست چت ===== */
.chat-list{flex:1;overflow-y:auto;padding-bottom:70px;background:#0e1621}
.chat-item{display:flex;align-items:center;padding:10px 16px;cursor:pointer;pointer-events:auto;border-bottom:1px solid rgba(255,255,255,0.03)}
.chat-item:active{background:#17212b}
.chat-avatar{width:52px;height:52px;border-radius:50%;margin-left:12px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:#fff}
.chat-avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chat-name{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:0.72rem;color:#6c7883;flex-shrink:0;margin-right:8px}
.chat-time.unread{color:#5ba4d9}
.chat-bottom{display:flex;justify-content:space-between;align-items:center}
.chat-message{font-size:0.85rem;color:#6c7883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-unread{background:#5ba4d9;color:#fff;font-size:0.72rem;font-weight:700;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;margin-right:8px;flex-shrink:0}
.chat-check{margin-right:8px;flex-shrink:0}
.chat-check svg{width:18px;height:18px;fill:none;stroke:#5ba4d9;stroke-width:2}

/* ===== FAB ===== */
.fab-edit{position:fixed;bottom:80px;left:18px;width:54px;height:54px;border-radius:50%;background:#5ba4d9;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(91,164,217,0.4);display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:auto}
.fab-edit:active{transform:scale(0.92)}
.fab-edit svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.5}

/* ===== نوار پایین ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#17212b;border-top:1px solid #0e1621;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;pointer-events:auto;padding:4px 18px}
.nav-item svg{width:24px;height:24px;fill:none;stroke:#6c7883;stroke-width:2}
.nav-item span{font-size:0.68rem;color:#6c7883}
.nav-item.active svg{stroke:#5ba4d9}
.nav-item.active span{color:#5ba4d9;font-weight:600}
.nav-item.disabled{opacity:0.35;pointer-events:none}

/* ===== صفحه چت ===== */
.chat-page{position:fixed;top:0;left:0;right:0;bottom:0;background:#0e1621;z-index:200;display:none;flex-direction:column}
.chat-page.active{display:flex}
.chat-header{background:#17212b;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0e1621;flex-shrink:0}
.chat-back{background:none;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.chat-back svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.chat-header-info{flex:1;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:10px}
.chat-header-info:active{opacity:0.8}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0}
.chat-header-avatar img{width:100%;height:100%;object-fit:cover}
.chat-header-text{flex:1}
.chat-header-name{font-size:1rem;font-weight:600}
.chat-header-status{font-size:0.75rem;color:#6c7883}
.chat-header-actions{display:flex;gap:4px}
.chat-header-actions button{background:none;border:none;cursor:pointer;padding:8px;pointer-events:auto}
.chat-header-actions svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}

/* ===== ناحیه پیام‌ها ===== */
.messages-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0e1621}
.message-row{display:flex;align-items:flex-end;gap:8px;max-width:85%}
.message-row.sent{align-self:flex-end;flex-direction:row-reverse}
.message-row.received{align-self:flex-start}
.message-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:#fff}
.message-avatar img{width:100%;height:100%;object-fit:cover}
.message-content{display:flex;flex-direction:column;gap:2px}
.message-sender{font-size:0.75rem;color:#5ba4d9;font-weight:600;padding:0 4px}
.message-bubble{padding:8px 12px;border-radius:12px;word-wrap:break-word;animation:messageIn 0.3s ease;position:relative;min-width:80px}
@keyframes messageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message-row.sent .message-bubble{background:#2b5278;border-bottom-left-radius:4px}
.message-row.received .message-bubble{background:#182533;border-bottom-right-radius:4px}
.message-bubble.system{align-self:center;background:rgba(91,164,217,0.15);border-radius:16px;max-width:85%;text-align:center;font-size:0.82rem;color:#5ba4d9;padding:8px 14px;font-style:italic}
.message-text{font-size:0.92rem;line-height:1.5}
.message-text a{color:#5ba4d9;text-decoration:none;word-break:break-all}
.message-text a:hover{text-decoration:underline}

/* ===== رسانه‌ها ===== */
.message-media{max-width:100%;border-radius:8px;margin-bottom:4px;cursor:pointer;pointer-events:auto}
.message-media img{max-width:100%;border-radius:8px;max-height:250px;object-fit:cover}
.message-media video{max-width:100%;border-radius:8px;max-height:250px}
.message-media audio{width:220px}

/* ===== فایل ===== */
.message-file{background:rgba(255,255,255,0.1);border-radius:8px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:4px;cursor:pointer;pointer-events:auto;min-width:200px}
.message-file-icon{width:40px;height:40px;background:#5ba4d9;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.message-file-icon svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.message-file-info{flex:1;min-width:0}
.message-file-name{font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.message-file-size{font-size:0.7rem;color:rgba(255,255,255,0.5)}
.message-download{background:#5ba4d9;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;flex-shrink:0}
.message-download svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}

/* ===== وضعیت آپلود ===== */
.upload-status{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:#5ba4d9;margin-top:4px}
.upload-spinner{width:12px;height:12px;border:2px solid rgba(91,164,217,0.3);border-top-color:#5ba4d9;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== ورودی پیام ===== */
.message-input-area{background:#17212b;padding:8px 12px;display:flex;align-items:flex-end;gap:8px;border-top:1px solid #0e1621;flex-shrink:0}
.message-input-wrapper{flex:1;background:#242f3d;border-radius:20px;padding:8px 14px;display:flex;align-items:center}
.message-input{flex:1;background:transparent;border:none;color:#fff;font-size:0.95rem;font-family:'Vazirmatn',sans-serif;outline:none;resize:none;max-height:120px;-webkit-user-select:text;user-select:text}
.message-input::placeholder{color:#6c7883}
.attach-btn,.voice-btn{background:none;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.attach-btn svg,.voice-btn svg{width:24px;height:24px;fill:none;stroke:#6c7883;stroke-width:2}
.send-btn{width:44px;height:44px;border-radius:50%;background:#5ba4d9;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;pointer-events:auto}
.send-btn:active{transform:scale(0.92)}
.send-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}

/* ===== ضبط صدا ===== */
.voice-recording{display:flex;align-items:center;gap:10px;flex:1;background:#242f3d;border-radius:20px;padding:8px 14px}
.voice-recording .rec-dot{width:12px;height:12px;background:#e74c3c;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.voice-recording .rec-time{font-size:0.9rem;color:#fff;flex:1}
.voice-preview{display:flex;align-items:center;gap:8px;flex:1;background:#242f3d;border-radius:20px;padding:8px 14px}
.voice-preview audio{flex:1;height:36px}
.voice-actions{display:flex;gap:6px}
.voice-actions button{background:none;border:none;cursor:pointer;padding:8px;pointer-events:auto}
.voice-actions button svg{width:24px;height:24px;fill:none;stroke-width:2}
.voice-actions .cancel-btn svg{stroke:#e74c3c}
.voice-actions .send-voice-btn svg{stroke:#2ecc71}

/* ===== Bottom Sheet ===== */
.bottom-sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:300;display:none;opacity:0;transition:opacity 0.3s}
.bottom-sheet-overlay.active{display:block;opacity:1}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:#17212b;border-radius:20px 20px 0 0;z-index:301;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
.bottom-sheet.active{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;margin:10px auto}
.sheet-header{text-align:center;padding:10px 20px 20px;position:relative}
.sheet-close{position:absolute;top:15px;left:15px;background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.sheet-close svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}
.sheet-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700;color:#fff}
.sheet-avatar img{width:100%;height:100%;object-fit:cover}
.sheet-name{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.sheet-type{font-size:0.85rem;color:#6c7883;margin-bottom:8px}
.sheet-members{font-size:0.9rem;color:#5ba4d9;margin-bottom:8px}
.sheet-link{font-size:0.82rem;color:#5ba4d9;direction:ltr;margin-bottom:8px;word-break:break-all;background:rgba(91,164,217,0.1);padding:8px 12px;border-radius:8px;cursor:pointer;pointer-events:auto}
.sheet-bio{font-size:0.88rem;color:#a0b0c0;line-height:1.6;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:8px;max-width:90%;margin:0 auto}
.sheet-bio a{color:#5ba4d9;text-decoration:none}
.sheet-section{border-top:1px solid rgba(255,255,255,0.05);padding:12px 20px}
.sheet-section-title{font-size:0.85rem;color:#5ba4d9;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.add-member-btn{background:#5ba4d9;border:none;border-radius:16px;padding:4px 12px;color:#fff;font-size:0.75rem;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:4px}
.add-member-btn svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.member-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.member-avatar{width:40px;height:40px;border-radius:50%;margin-left:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.member-avatar img{width:100%;height:100%;object-fit:cover}
.member-info{flex:1}
.member-name{font-size:0.95rem;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.member-role{font-size:0.75rem;color:#6c7883}
.owner-badge{background:#f39c12;color:#fff;font-size:0.65rem;padding:2px 6px;border-radius:8px}
.admin-badge{background:#5ba4d9;color:#fff;font-size:0.65rem;padding:2px 6px;border-radius:8px}
.sheet-actions{padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px}
.sheet-action-btn{width:100%;background:#242f3d;border:none;border-radius:12px;padding:12px;color:#fff;font-size:0.95rem;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.sheet-action-btn:active{background:#2f3d4d}
.sheet-action-btn.primary{background:#5ba4d9}
.sheet-action-btn.danger{background:#e74c3c}
.sheet-action-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}

/* ===== Page Overlay ===== */
.page-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0e1621;z-index:200;display:none;flex-direction:column}
.page-overlay.active{display:flex}
.page-header{background:#17212b;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #0e1621;flex-shrink:0}
.page-title{font-size:1.2rem;font-weight:700;flex:1}
.back-btn{background:none;border:none;cursor:pointer;padding:6px;pointer-events:auto}
.back-btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}

/* ===== جستجو ===== */
.search-page-input{width:100%;background:#242f3d;border:none;border-radius:12px;color:#fff;font-size:1rem;padding:12px 16px;font-family:'Vazirmatn',sans-serif;outline:none;margin:12px 16px;-webkit-user-select:text;user-select:text}
.search-page-input::placeholder{color:#6c7883}
.search-results{flex:1;overflow-y:auto;padding:0 16px}
.search-empty{text-align:center;padding:60px 20px;color:#6c7883}

/* ===== ساخت/ویرایش ===== */
.create-buttons{display:flex;gap:10px;padding:12px 16px;background:rgba(91,164,217,0.1);margin-bottom:10px}
.create-btn{flex:1;background:linear-gradient(135deg,#5ba4d9,#4a93c8);border:none;border-radius:12px;padding:12px;color:#fff;font-size:0.9rem;font-weight:600;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.create-btn:active{transform:scale(0.95)}
.create-btn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
.section-title{padding:12px 16px;font-size:0.85rem;color:#5ba4d9;font-weight:600;background:rgba(91,164,217,0.1);margin-bottom:8px}
.contact-item{display:flex;align-items:center;padding:12px 16px;cursor:pointer;pointer-events:auto;border-bottom:1px solid rgba(255,255,255,0.03)}
.contact-item:active{background:#17212b}
.contact-avatar{width:48px;height:48px;border-radius:50%;margin-left:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.contact-avatar img{width:100%;height:100%;object-fit:cover}
.contact-info{flex:1}
.contact-name{font-size:0.95rem;font-weight:600;margin-bottom:2px}
.contact-status{font-size:0.78rem;color:#6c7883}
.invite-btn{background:#5ba4d9;border:none;border-radius:20px;padding:6px 16px;color:#fff;font-size:0.8rem;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto}
.create-form{padding:20px 16px;overflow-y:auto;flex:1}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:0.9rem;color:#a0b0c0;margin-bottom:8px;font-weight:500}
.form-input{width:100%;background:#242f3d;border:1px solid rgba(91,164,217,0.3);border-radius:12px;color:#fff;font-size:0.95rem;padding:12px 14px;font-family:'Vazirmatn',sans-serif;outline:none;-webkit-user-select:text;user-select:text}
.form-input::placeholder{color:#6c7883}
.form-input:focus{border-color:#5ba4d9}
.form-textarea{min-height:100px;resize:vertical}
.avatar-upload-box{width:100px;height:100px;border-radius:50%;margin:0 auto 20px;background:linear-gradient(135deg,#5ba4d9,#4a93c8);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;cursor:pointer;pointer-events:auto;position:relative;overflow:hidden;border:3px dashed rgba(255,255,255,0.3)}
.avatar-upload-box img{width:100%;height:100%;object-fit:cover}
.avatar-upload-box .upload-icon{position:absolute;bottom:5px;right:5px;background:#5ba4d9;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #17212b}
.avatar-upload-box .upload-icon svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
.submit-btn{width:100%;background:linear-gradient(135deg,#5ba4d9,#4a93c8);border:none;border-radius:12px;padding:14px;color:#fff;font-size:1rem;font-weight:700;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto}

/* ===== Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:400;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-content{background:#17212b;width:100%;max-height:80vh;border-radius:20px 20px 0 0;padding:20px;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.1)}
.modal-title{font-size:1.2rem;font-weight:700}
.modal-close{background:none;border:none;cursor:pointer;padding:5px;pointer-events:auto}
.modal-close svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.add-member-tabs{display:flex;gap:10px;margin-bottom:15px}
.add-member-tab{flex:1;background:#242f3d;border:none;border-radius:10px;padding:10px;color:#fff;font-size:0.9rem;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto}
.add-member-tab.active{background:#5ba4d9}
.add-member-list{max-height:300px;overflow-y:auto}
.add-member-item{display:flex;align-items:center;padding:10px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;pointer-events:auto}
.add-member-item:active{background:rgba(91,164,217,0.1)}
.add-by-id{display:flex;gap:10px;margin-top:10px}
.add-by-id input{flex:1;background:#242f3d;border:1px solid rgba(91,164,217,0.3);border-radius:10px;color:#fff;padding:10px;font-family:'Vazirmatn',sans-serif;outline:none;-webkit-user-select:text;user-select:text}
.add-by-id button{background:#5ba4d9;border:none;border-radius:10px;padding:10px 20px;color:#fff;font-family:'Vazirmatn',sans-serif;cursor:pointer;pointer-events:auto}

/* ===== Toast ===== */
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:0.85rem;z-index:500;display:none;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.toast.error{background:#e74c3c;color:#fff}
.toast.success{background:#2ecc71;color:#fff}
.toast.show{display:block;animation:toastIn 0.3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ===== Context Menu ===== */
.context-menu{position:fixed;background:#17212b;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.5);z-index:350;display:none;min-width:200px;overflow:hidden}
.context-menu.active{display:block}
.context-menu-item{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;pointer-events:auto;border-bottom:1px solid rgba(255,255,255,0.05)}
.context-menu-item:active{background:rgba(91,164,217,0.1)}
.context-menu-item svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
.context-menu-item.danger{color:#e74c3c}

/* ===== Media Viewer ===== */
.media-viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:450;display:none;align-items:center;justify-content:center;flex-direction:column}

.media-viewer img,.media-viewer video{max-width:100%;max-height:80vh;object-fit:contain}
.media-viewer-close{position:absolute;top:15px;left:15px;background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
.media-viewer-close svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}

.media-viewer-actions button svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}

/* ===== Pinned & Channel Notice ===== */
.pinned-notice{background:rgba(91,164,217,0.15);border-right:3px solid #5ba4d9;padding:8px 12px;margin:0 12px;border-radius:8px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:8px}

/* ===== Screenshot Protection ===== */

@media (max-width:400px){.header-title{font-size:1.2rem}.chat-avatar{width:48px;height:48px}}

<script>
// ===== توابع کمکی =====
const colors=['#e74c3c','#3498db','#2ecc71','#9b59b6','#f39c12','#1abc9c','#e67e22','#5ba4d9'];
function getColor(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return colors[Math.abs(h)%colors.length]}
function getInitials(s){return s.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase()}
function getCurrentTime(){const n=new Date();return `${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`}
function getCurrentDate(){const n=new Date();return `${n.getFullYear()}/${(n.getMonth()+1).toString().padStart(2,'0')}/${n.getDate().toString().padStart(2,'0')}`}
function generateUniqueLink(){const c='abcdefghijklmnopqrstuvwxyz0123456789';let r='';for(let i=0;i<8;i++)r+=c.charAt(Math.floor(Math.random()*c.length));return `iran.ir/g/${r}`}
function formatSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';return (bytes/1048576).toFixed(2)+' MB'}

// ===== کاربر فعلی =====
let currentUser = JSON.parse(localStorage.getItem('current_user') || 'null');
if (!currentUser) {
    // کاربر پیش‌فرض برای تست
    currentUser = { id: 'user_' + Date.now(), name: 'کاربر من', phone: '09123456789', bio: '', avatar: null };
    localStorage.setItem('current_user', JSON.stringify(currentUser));
}

// ===== داده‌ها =====
let chats = JSON.parse(localStorage.getItem('iran_chats_' + currentUser.id) || '[]');
let groups = JSON.parse(localStorage.getItem('iran_groups') || '[]');
let channels = JSON.parse(localStorage.getItem('iran_channels') || '[]');
let myMemberships = JSON.parse(localStorage.getItem('iran_memberships_' + currentUser.id) || '[]');
let blockedUsers = JSON.parse(localStorage.getItem('iran_blocked_' + currentUser.id) || '[]');

if(chats.length === 0){
    chats = [
        {id:'saved', name:'پیام‌های ذخیره شده', type:'saved', lastMessage:'', time:'', unread:0, read:true, online:false, messages:[], ownerId: currentUser.id},
        {id:'support', name:'پشتیبانی ایران', type:'support', lastMessage:'سلام! چطور می‌تونم کمکتون کنم؟', time:'امروز', unread:1, read:false, online:true, messages:[{id:'m2',text:'سلام! به پیام‌رسان ایران خوش آمدید 🇷',time:'10:00',timestamp:Date.now(),sent:false,userId:'support'},{id:'m3',text:'سلام! چطور می‌تونم کمکتون کنم؟',time:'10:01',timestamp:Date.now(),sent:false,userId:'support'}], ownerId: 'support'}
    ];
    saveData();
}

let currentChat = null;
let currentSheet = null;
let createType = 'group';
let selectedAvatar = null;
let voiceRecorder = null;
let voiceChunks = [];
let voiceRecording = false;
let voiceStartTime = 0;
let voiceTimer = null;
let voiceBlob = null;
let currentMediaUrl = null;
let currentMediaMsg = null;
let longPressTimer = null;
let forwardingMsgId = null;
let uploadingFiles = {}; // فایل‌های در حال آپلود

function saveData(){
    localStorage.setItem('iran_chats_' + currentUser.id, JSON.stringify(chats));
    localStorage.setItem('iran_groups', JSON.stringify(groups));
    localStorage.setItem('iran_channels', JSON.stringify(channels));
    localStorage.setItem('iran_memberships_' + currentUser.id, JSON.stringify(myMemberships));
    localStorage.setItem('iran_blocked_' + currentUser.id, JSON.stringify(blockedUsers));
}

// ===== لینک‌سازی متن =====
function linkifyText(text) {
    if (!text) return '';
    text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // لینک‌های داخلی iran.ir/g/xxx
    text = text.replace(/(iran\.ir\/g\/[a-z0-9]+)/g, '<a href="#" onclick="openGroupByLink(\'$1\');return false;">$1</a>');
    // لینک‌های http/https
    text = text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    // آیدی‌ها
    text = text.replace(/(@[a-zA-Z0-9_]+)/g, '<a href="#" onclick="openUserById(\'$1\');return false;">$1</a>');
    // هشتگ‌ها
    text = text.replace(/(#[^\s<]+)/g, '<span style="color:#5ba4d9">$1</span>');
    return text;
}

// ===== باز کردن گروه از لینک =====
function openGroupByLink(linkCode) {
    // پیدا کردن گروه/کانال با این لینک
    const allGroups = [...groups, ...channels];
    const found = allGroups.find(g => g.link && g.link.includes(linkCode));
    if (found) {
        const type = groups.includes(found) ? 'group' : 'channel';
        openChatPage(type, found.id);
        showToast('به گروه/کانال پیوستید', 'success');
    } else {
        showToast('گروه/کانال یافت نشد', 'error');
    }
}

function openUserById(userId) {
    showToast(`پروفایل ${userId}`, 'success');
}

// ===== رندر لیست چت =====
function renderChats() {
    const list = document.getElementById('chatList');
    const allChats = [
        ...chats,
        ...groups.filter(g => myMemberships.some(m => m.itemId === g.id) || g.ownerId === currentUser.id).map(g => ({...g, type:'group'})),
        ...channels.filter(c => myMemberships.some(m => m.itemId === c.id) || c.ownerId === currentUser.id).map(c => ({...c, type:'channel'}))
    ];

    list.innerHTML = allChats.map(chat => {
        const color = getColor(chat.name);
        const initials = getInitials(chat.name);
        const avatarContent = chat.avatar ? `<img src="${chat.avatar}">` : initials;
        const unreadBadge = chat.unread > 0 ? `<div class="chat-unread">${chat.unread>99?'99+':chat.unread}</div>` : '';
        const checkIcon = chat.read ? `<div class="chat-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>` : '';
        const typeIcon = chat.type==='group'?'👥 ':chat.type==='channel'?'📢 ':'';
        return `<div class="chat-item" onclick="openChatPage('${chat.type}','${chat.id}')">
            <div class="chat-avatar" style="background:${color}">${avatarContent}</div>
            <div class="chat-info">
                <div class="chat-top"><div class="chat-name">${typeIcon}${chat.name}</div><div class="chat-time ${chat.unread>0?'unread':''}">${chat.time}</div></div>
                <div class="chat-bottom"><div class="chat-message">${chat.lastMessage}</div>${unreadBadge}${checkIcon}</div>
            </div>
        </div>`;
    }).join('');
}

// ===== باز کردن چت =====
function openChatPage(type, id){
    if(type==='group') currentChat = {type:'group', data: groups.find(g => g.id === id)};
    else if(type==='channel') currentChat = {type:'channel', data: channels.find(c => c.id === id)};
    else currentChat = {type:'personal', data: chats.find(c => c.id === id)};
    if(!currentChat.data) return;

    const color = getColor(currentChat.data.name);
    const initials = getInitials(currentChat.data.name);
    document.getElementById('chatHeaderAvatar').innerHTML = currentChat.data.avatar ? `<img src="${currentChat.data.avatar}">` : initials;
    document.getElementById('chatHeaderAvatar').style.background = color;
    document.getElementById('chatHeaderName').textContent = currentChat.data.name;

    if(currentChat.type==='channel'){
        document.getElementById('chatHeaderStatus').textContent = 'کانال';
        document.getElementById('chatHeaderStatus').style.color = '#6c7883';
    } else if(currentChat.type==='group'){
        document.getElementById('chatHeaderStatus').textContent = `${currentChat.data.memberCount||0} عضو`;
        document.getElementById('chatHeaderStatus').style.color = '#6c7883';
    } else {
        document.getElementById('chatHeaderStatus').textContent = 'آنلاین';
        document.getElementById('chatHeaderStatus').style.color = '#4dcd5e';
    }

    const channelNotice = document.getElementById('channelNotice');
    const messageInputArea = document.getElementById('messageInputArea');
    if(currentChat.type==='channel'){
        const isO = isOwnerOrAdminOf(currentChat.data);
        channelNotice.style.display = isO ? 'none' : 'block';
        messageInputArea.style.display = isO ? 'flex' : 'none';
    } else {
        channelNotice.style.display = 'none';
        messageInputArea.style.display = 'flex';
    }

    if (currentChat.data.restrictCopy) {
        document.getElementById('messagesArea').style.userSelect = 'none';
        document.getElementById('messagesArea').style.webkitUserSelect = 'none';
    } else {
        document.getElementById('messagesArea').style.userSelect = 'text';
        document.getElementById('messagesArea').style.webkitUserSelect = 'text';
    }

    renderMessages();
    document.getElementById('chatPage').classList.add('active');
    setTimeout(() => { document.getElementById('messagesArea').scrollTop = 999999; }, 100);
    updatePinnedNotice();
}

function closeChat(){ document.getElementById('chatPage').classList.remove('active'); currentChat = null; }

// ===== رندر پیام‌ها =====
function renderMessages(){
    if(!currentChat) return;
    const area = document.getElementById('messagesArea');
    const users = JSON.parse(localStorage.getItem('iran_users') || '{}');
    area.innerHTML = currentChat.data.messages.map(msg => {
        if(msg.deletedForMe) return '';
        if(msg.system) return `<div class="message-bubble system">${msg.text}</div>`;
        const sender = msg.sent ? currentUser : (users[msg.userId] || {name:'کاربر'});
        const senderColor = getColor(sender.name || 'user');
        const senderInitials = getInitials(sender.name || 'user');
        const avatarHtml = `<div class="message-avatar" style="background:${senderColor}">${sender.avatar ? `<img src="${sender.avatar}">` : senderInitials}</div>`;
        let contentHtml = '';
        if(msg.mediaType === 'image') contentHtml = `<img src="${msg.mediaUrl}" class="message-media" onclick="openMediaViewer('${msg.id}','image')">`;
        else if(msg.mediaType === 'video') contentHtml = `<video src="${msg.mediaUrl}" class="message-media" controls onclick="openMediaViewer('${msg.id}','video')"></video>`;
        else if(msg.mediaType === 'audio') contentHtml = `<audio src="${msg.mediaUrl}" controls style="width:220px"></audio>`;
        else if(msg.mediaType === 'file') {
            const isUploaded = msg.uploadComplete !== false;
            const uploadStatus = !isUploaded ? `<div class="upload-status"><div class="upload-spinner"></div>در حال بارگذاری...</div>` : '';
            contentHtml = `<div class="message-file" onclick="${isUploaded ? `downloadMessage('${msg.id}')` : ''}">
                <div class="message-file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div class="message-file-info">
                    <div class="message-file-name">${msg.fileName||'فایل'}</div>
                    <div class="message-file-size">${msg.fileSize ? formatSize(msg.fileSize) : ''}</div>
                    ${uploadStatus}
                </div>
                ${isUploaded ? `<div class="message-download"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>` : ''}
            </div>`;
        }
        const senderNameHtml = (currentChat.type==='group' || currentChat.type==='channel') && !msg.sent ? `<div class="message-sender">${sender.name||'کاربر'}</div>` : '';
        const checkHtml = msg.sent ? `<span class="message-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>` : '';
        const pinnedIcon = msg.pinned ? '📌 ' : '';
        const forwardTag = msg.forwardedFrom ? `<div style="font-size:0.7rem;color:#5ba4d9;font-style:italic;margin-bottom:4px">هدایت شده از ${msg.forwardedFrom}</div>` : '';
        return `<div class="message-row ${msg.sent?'sent':'received'}" data-msgid="${msg.id}" onmousedown="startLongPress(event,'${msg.id}')" ontouchstart="startLongPress(event,'${msg.id}')" onmouseup="cancelLongPress()" ontouchend="cancelLongPress()" onmouseleave="cancelLongPress()" oncontextmenu="event.preventDefault()">
            ${avatarHtml}
            <div class="message-content">
                ${senderNameHtml}
                <div class="message-bubble">
                    ${contentHtml}
                    ${forwardTag}
                    <div class="message-text">${pinnedIcon}${linkifyText(msg.text||'')}</div>
                    <div class="message-meta"><span class="message-time">${msg.time}</span>${checkHtml}</div>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ===== Long Press =====
function startLongPress(e, msgId){ longPressTimer = setTimeout(() => { showContextMenu(e, msgId); }, 500); }
function cancelLongPress(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } }

function showContextMenu(e, msgId){
    cancelLongPress();
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(!msg) return;
    const menu = document.getElementById('contextMenu');
    const isManager = isOwnerOrAdminOf(currentChat.data);
    const isSender = msg.sent;
    let html = '';

    if(msg.text && !currentChat.data.restrictCopy){
        html += `<div class="context-menu-item" onclick="copyMessage('${msgId}')"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>کپی</div>`;
    }
    if(!currentChat.data.restrictForward){
        html += `<div class="context-menu-item" onclick="openForwardPage('${msgId}')"><svg viewBox="0 0 24 24"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg>هدایت کردن</div>`;
    }
    if(isManager) html += `<div class="context-menu-item" onclick="pinMessage('${msgId}')"><svg viewBox="0 0 24 24"><path d="M12 2L15 9l7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>${msg.pinned?'برداشتن سنجاق':'سنجاق کردن'}</div>`;
    html += `<div class="context-menu-item danger" onclick="deleteForMe('${msgId}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>حذف برای من</div>`;
    if(isSender || isManager) html += `<div class="context-menu-item danger" onclick="deleteForAll('${msgId}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>حذف برای همه</div>`;
    menu.innerHTML = html;
    const x = e.clientX || e.touches?.[0]?.clientX || 100;
    const y = e.clientY || e.touches?.[0]?.clientY || 100;
    menu.style.left = Math.min(x, window.innerWidth - 220) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 300) + 'px';
    menu.classList.add('active');
    setTimeout(() => { document.addEventListener('click', hideContextMenu, {once:true}); }, 10);
}
function hideContextMenu(){ document.getElementById('contextMenu').classList.remove('active'); }

async function copyMessage(msgId){
    hideContextMenu();
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(!msg) return;
    try {
        if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(msg.text||''); }
        else { const ta = document.createElement('textarea'); ta.value = msg.text||''; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
        showToast('کپی شد', 'success');
    } catch(e){ showToast('کپی نشد', 'error'); }
}

// ===== هدایت پیام =====
function openForwardPage(msgId) {
    forwardingMsgId = msgId || null;
    const list = document.getElementById('forwardList');
    const allChats = [
        ...chats,
        ...groups.filter(g => myMemberships.some(m => m.itemId === g.id) || g.ownerId === currentUser.id).map(g => ({...g, type:'group'})),
        ...channels.filter(c => myMemberships.some(m => m.itemId === c.id) || c.ownerId === currentUser.id).map(c => ({...c, type:'channel'}))
    ];
    list.innerHTML = allChats.map(chat => {
        const color = getColor(chat.name);
        const initials = getInitials(chat.name);
        const avatarContent = chat.avatar ? `<img src="${chat.avatar}">` : initials;
        const typeIcon = chat.type==='group'?'👥 ':chat.type==='channel'?'📢 ':'';
        return `<div class="chat-item" onclick="executeForward('${chat.id}')">
            <div class="chat-avatar" style="background:${color}">${avatarContent}</div>
            <div class="chat-info">
                <div class="chat-top"><div class="chat-name">${typeIcon}${chat.name}</div></div>
            </div>
        </div>`;
    }).join('');
    document.getElementById('forwardPage').classList.add('active');
}

function closeForwardPage() {
    document.getElementById('forwardPage').classList.remove('active');
    forwardingMsgId = null;
    window.forwardingMediaMsg = null;
}

function executeForward(targetId) {
    const targetChat = [...chats, ...groups, ...channels].find(c => c.id === targetId);
    if (!targetChat) return;
    if (currentChat && currentChat.data.restrictForward) {
        showToast('هدایت پیام در این گفتگو محدود شده است', 'error');
        closeForwardPage();
        return;
    }
    let msgToForward = null;
    if (forwardingMsgId && currentChat) {
        msgToForward = currentChat.data.messages.find(m => m.id === forwardingMsgId);
    } else if (window.forwardingMediaMsg) {
        msgToForward = window.forwardingMediaMsg;
    }
    if (!msgToForward) { closeForwardPage(); return; }
    const newMsg = {
        ...msgToForward,
        id: 'm' + Date.now(),
        sent: true,
        userId: currentUser.id,
        time: getCurrentTime(),
        timestamp: Date.now(),
        forwardedFrom: currentChat ? currentChat.data.name : 'رسانه'
    };
    targetChat.messages.push(newMsg);
    targetChat.lastMessage = 'پیام هدایت شد';
    targetChat.time = getCurrentTime();
    saveData();
    renderChats();
    closeForwardPage();
    showToast('پیام هدایت شد', 'success');
}

function pinMessage(msgId){
    hideContextMenu();
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(!msg) return;
    if(!isOwnerOrAdminOf(currentChat.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    currentChat.data.messages.forEach(m => m.pinned = false);
    msg.pinned = !msg.pinned;
    currentChat.data.pinnedMessage = msg.pinned ? msg : null;
    saveData(); renderMessages(); updatePinnedNotice();
    showToast(msg.pinned ? 'سنجاق شد' : 'سنجاق برداشته شد', 'success');
}

function updatePinnedNotice(){
    if(!currentChat) return;
    const notice = document.getElementById('pinnedNotice');
    const pinned = currentChat.data.pinnedMessage;
    if(pinned){
        document.getElementById('pinnedText').textContent = (pinned.text ? pinned.text.substring(0,50) : 'رسانه');
        notice.style.display = 'flex';
    } else { notice.style.display = 'none'; }
}

function scrollToPinned(){
    if(!currentChat || !currentChat.data.pinnedMessage) return;
    const el = document.querySelector(`[data-msgid="${currentChat.data.pinnedMessage.id}"]`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function deleteForMe(msgId){
    hideContextMenu();
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(msg){ msg.deletedForMe = true; saveData(); renderMessages(); }
    showToast('حذف شد', 'success');
}

function deleteForAll(msgId){
    hideContextMenu();
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(!msg) return;
    if(!msg.sent && !isOwnerOrAdminOf(currentChat.data)){ showToast('فقط فرستنده یا مدیر', 'error'); return; }
    currentChat.data.messages = currentChat.data.messages.filter(m => m.id !== msgId);
    currentChat.data.messages.push({id:'s'+Date.now(), text:'پیام حذف شد', time:getCurrentTime(), sent:false, system:true});
    saveData(); renderMessages(); renderChats();
    showToast('حذف شد', 'success');
}

// ===== Slow Mode =====
function checkSlowMode(chatData) {
    if (!chatData.slowMode || chatData.slowMode <= 0) return true;
    const lastMsg = [...chatData.messages].reverse().find(m => m.userId === currentUser.id && m.sent);
    if (lastMsg && lastMsg.timestamp) {
        const now = Date.now();
        const diff = now - lastMsg.timestamp;
        const limit = chatData.slowMode * 1000;
        if (diff < limit) {
            const remaining = Math.ceil((limit - diff) / 1000);
            showToast(`لطفاً ${remaining} ثانیه دیگر صبر کنید`, 'error');
            return false;
        }
    }
    return true;
}

// ===== ارسال پیام متنی =====
function sendMessage(){
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if(!text || !currentChat) return;
    if(currentChat.type === 'channel' && !isOwnerOrAdminOf(currentChat.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    if(!checkSlowMode(currentChat.data)) return;
    const time = getCurrentTime();
    currentChat.data.messages.push({id:'m'+Date.now(), text, time, timestamp:Date.now(), sent:true, userId:currentUser.id});
    currentChat.data.lastMessage = text;
    currentChat.data.time = time;
    saveData(); input.value = ''; input.style.height = 'auto';
    renderMessages(); renderChats();
    document.getElementById('messagesArea').scrollTop = 999999;
}

document.getElementById('messageInput').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
document.getElementById('messageInput').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });

// ===== انتخاب فایل (مستقیم) =====
function triggerFileSelect() {
    if(!currentChat) return;
    if(currentChat.type === 'channel' && !isOwnerOrAdminOf(currentChat.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    const input = document.getElementById('attachFileInput');
    input.accept = '*/*';
    input.click();
}

function handleAttachFile(e){
    const file = e.target.files[0];
    if(!file || !currentChat) return;
    if(currentChat.type === 'channel' && !isOwnerOrAdminOf(currentChat.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    if(!checkSlowMode(currentChat.data)){ e.target.value = ''; return; }

    const tempId = 'm' + Date.now();
    const mediaType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'file';

    // ایجاد پیام با وضعیت "در حال بارگذاری"
    const msg = {
        id: tempId,
        time: getCurrentTime(),
        timestamp: Date.now(),
        sent: true,
        userId: currentUser.id,
        mediaType: mediaType,
        fileName: file.name,
        fileSize: file.size,
        uploadComplete: false,
        text: ''
    };

    if(mediaType === 'file') msg.text = '📎 ' + file.name;
    else if(mediaType === 'image') msg.text = 'تصویر';
    else if(mediaType === 'video') msg.text = 'ویدیو';
    else if(mediaType === 'audio') msg.text = '🎵 صوت';

    currentChat.data.messages.push(msg);
    currentChat.data.lastMessage = msg.text;
    currentChat.data.time = msg.time;
    saveData();
    renderMessages();
    renderChats();
    document.getElementById('messagesArea').scrollTop = 999999;

    // شبیه‌سازی آپلود (در واقعیت باید به سرور ارسال شود)
    const reader = new FileReader();
    reader.onload = function(ev) {
        // بعد از 1.5 ثانیه (شبیه‌سازی آپلود)
        setTimeout(() => {
            const msgIndex = currentChat.data.messages.findIndex(m => m.id === tempId);
            if(msgIndex > -1) {
                currentChat.data.messages[msgIndex].mediaUrl = ev.target.result;
                currentChat.data.messages[msgIndex].uploadComplete = true;
                saveData();
                renderMessages();
                showToast('فایل ارسال شد', 'success');
            }
        }, 1500);
    };
    reader.readAsDataURL(file);
    e.target.value = '';
}

function downloadMessage(msgId){
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(!msg || !msg.mediaUrl || msg.uploadComplete === false) return;
    const a = document.createElement('a');
    a.href = msg.mediaUrl;
    a.download = msg.fileName || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('دانلود شد', 'success');
}

// ===== Media Viewer =====
function openMediaViewer(msgId, type){
    const msg = currentChat.data.messages.find(m => m.id === msgId);
    if(!msg) return;
    currentMediaMsg = msg;
    currentMediaUrl = msg.mediaUrl;
    const content = document.getElementById('mediaViewerContent');
    if(type === 'image') content.innerHTML = `<img src="${msg.mediaUrl}">`;
    else if(type === 'video') content.innerHTML = `<video src="${msg.mediaUrl}" controls autoplay></video>`;
    document.getElementById('mediaViewer').classList.add('active');
}

function closeMediaViewer(){ document.getElementById('mediaViewer').classList.remove('active'); currentMediaUrl = null; currentMediaMsg = null; }

function downloadCurrentMedia(){
    if(!currentMediaUrl) return;
    const a = document.createElement('a');
    a.href = currentMediaUrl;
    a.download = 'media_' + Date.now();
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast('ذخیره شد', 'success');
}

function forwardCurrentMedia(){
    if(!currentMediaMsg) return;
    window.forwardingMediaMsg = currentMediaMsg;
    forwardingMsgId = null;
    openForwardPage(null);
}

// ===== ضبط صدا =====
async function startVoiceRecord(e){
    if(e) e.preventDefault();
    if(!currentChat) return;
    if(currentChat.type === 'channel' && !isOwnerOrAdminOf(currentChat.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        voiceRecorder = new MediaRecorder(stream);
        voiceChunks = [];
        voiceRecorder.ondataavailable = e => voiceChunks.push(e.data);
        voiceRecorder.onstop = () => {
            voiceBlob = new Blob(voiceChunks, {type:'audio/webm'});
            stream.getTracks().forEach(t => t.stop());
            showVoicePreview();
        };
        voiceRecorder.start();
        voiceRecording = true;
        voiceStartTime = Date.now();
        updateRecTime();
        voiceTimer = setInterval(updateRecTime, 1000);
        document.getElementById('inputWrapper').style.display = 'none';
        document.getElementById('sendBtn').style.display = 'none';
        document.querySelector('.attach-btn').style.display = 'none';
        document.querySelector('.voice-btn').style.display = 'none';
        const recDiv = document.createElement('div');
        recDiv.className = 'voice-recording';
        recDiv.id = 'voiceRecDiv';
        recDiv.innerHTML = `<div class="rec-dot"></div><div class="rec-time" id="recTime">0:00</div><button onclick="cancelVoice()" style="background:none;border:none;cursor:pointer"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#e74c3c" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
        document.getElementById('messageInputArea').insertBefore(recDiv, document.getElementById('messageInputArea').firstChild);
    } catch(err){ showToast('دسترسی میکروفون لازم است', 'error'); }
}

function stopVoiceRecord(e){
    if(e) e.preventDefault();
    if(!voiceRecording || !voiceRecorder) return;
    voiceRecorder.stop();
    voiceRecording = false;
    clearInterval(voiceTimer);
}

function updateRecTime(){
    const elapsed = Math.floor((Date.now() - voiceStartTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const el = document.getElementById('recTime');
    if(el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function showVoicePreview(){
    const recDiv = document.getElementById('voiceRecDiv');
    if(recDiv) recDiv.remove();
    const url = URL.createObjectURL(voiceBlob);
    const previewDiv = document.createElement('div');
    previewDiv.className = 'voice-preview';
    previewDiv.id = 'voicePreviewDiv';
    previewDiv.innerHTML = `<audio src="${url}" controls></audio><div class="voice-actions"><button class="cancel-btn" onclick="cancelVoice()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><button class="send-voice-btn" onclick="sendVoice('${url}')"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>`;
    document.getElementById('messageInputArea').insertBefore(previewDiv, document.getElementById('messageInputArea').firstChild);
}

function cancelVoice(){
    voiceBlob = null;
    const preview = document.getElementById('voicePreviewDiv');
    if(preview) preview.remove();
    const rec = document.getElementById('voiceRecDiv');
    if(rec) rec.remove();
    document.getElementById('inputWrapper').style.display = 'flex';
    document.getElementById('sendBtn').style.display = 'flex';
    document.querySelector('.attach-btn').style.display = 'flex';
    document.querySelector('.voice-btn').style.display = 'flex';
}

function sendVoice(url){
    if(!voiceBlob || !currentChat) return;
    if(!checkSlowMode(currentChat.data)){ cancelVoice(); return; }
    const reader = new FileReader();
    reader.onload = function(ev){
        const time = getCurrentTime();
        currentChat.data.messages.push({id:'m'+Date.now(), time, timestamp:Date.now(), sent:true, userId:currentUser.id, mediaUrl:ev.target.result, mediaType:'audio'});
        currentChat.data.lastMessage = ' پیام صوتی';
        currentChat.data.time = time;
        saveData(); renderMessages(); renderChats();
        document.getElementById('messagesArea').scrollTop = 999999;
        cancelVoice();
        showToast('ویس ارسال شد', 'success');
    };
    reader.readAsDataURL(voiceBlob);
}

// ===== بررسی مالک/مدیر =====
function isOwnerOrAdminOf(item){ if(!currentUser) return false; if(item.ownerId === currentUser.id) return true; if(item.admins && item.admins.includes(currentUser.id)) return true; return false; }
function isMemberOf(item){
    if(!currentUser) return false;
    if(item.ownerId === currentUser.id) return true;
    return myMemberships.some(m => m.itemId === item.id && m.userId === currentUser.id);
}

// ===== Bottom Sheet پروفایل =====
function openProfileSheet(){
    if(!currentChat) return;
    currentSheet = {type:currentChat.type, data:currentChat.data};
    renderSheet();
    document.getElementById('sheetOverlay').classList.add('active');
    setTimeout(() => document.getElementById('profileSheet').classList.add('active'), 10);
}

function closeProfileSheet(){
    document.getElementById('profileSheet').classList.remove('active');
    setTimeout(() => { document.getElementById('sheetOverlay').classList.remove('active'); currentSheet = null; }, 350);
}

    if(!currentSheet) return;
    const item = currentSheet.data;
    const color = getColor(item.name);
    const initials = getInitials(item.name);
    const isOwner = item.ownerId === currentUser?.id;
    const isAdmin = item.admins && item.admins.includes(currentUser?.id);
    const isManager = isOwner || isAdmin;
    const isJoined = isMemberOf(item);
    document.getElementById('sheetAvatar').innerHTML = item.avatar ? `<img src="${item.avatar}">` : initials;
    document.getElementById('sheetAvatar').style.background = color;
    document.getElementById('sheetName').textContent = item.name;
    document.getElementById('sheetType').textContent = currentSheet.type === 'group' ? 'گروه' : 'کانال';
    document.getElementById('sheetMembers').textContent = `${item.memberCount||0} عضو`;

    if(currentSheet.type === 'group'){
        membersSection.style.display = 'block';

// ===== ویرایش گروه/کانال =====
function editGroupInfo(){
    if(!currentSheet || !isOwnerOrAdminOf(currentSheet.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    closeProfileSheet();
    setTimeout(() => {
        const item = currentSheet.data;
        document.getElementById('createTitle').textContent = 'ویرایش ' + (currentSheet.type === 'group' ? 'گروه' : 'کانال');
        document.getElementById('createName').value = item.name;
        document.getElementById('createLink').value = item.link || '';
        document.getElementById('createBio').value = item.bio || '';
        document.getElementById('channelLinkGroup').style.display = 'block';
        selectedAvatar = item.avatar || null;
        const box = document.getElementById('avatarUploadBox');
        if(selectedAvatar) box.innerHTML = `<img src="${selectedAvatar}"><div class="upload-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">`;
        document.getElementById('createPage').dataset.editing = currentSheet.data.id;
        document.getElementById('createPage').dataset.editType = currentSheet.type;
        document.getElementById('createPage').classList.add('active');
    }, 400);
}

function regenerateLink(){
    if(!currentSheet || !isOwnerOrAdminOf(currentSheet.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    if(confirm('لینک قبلی باطل و لینک جدید ساخته شود؟')){
        currentSheet.data.link = generateUniqueLink();
        currentSheet.data.messages.push({id:'s'+Date.now(), text:'لینک دعوت تغییر کرد: ' + currentSheet.data.link, time:getCurrentTime(), sent:false, system:true});
        saveData(); renderSheet(); showToast('لینک جدید ساخته شد: ' + currentSheet.data.link, 'success');
    }
}

function copyLink(){
    if(!currentSheet) return;
    const link = currentSheet.data.link;
    if(!link){ showToast('لینکی وجود ندارد', 'error'); return; }
    try { if(navigator.clipboard) navigator.clipboard.writeText(link); } catch(e){}
    showToast('لینک کپی شد: ' + link, 'success');
}

function joinItem(){
    if(!currentSheet) return;
    const item = currentSheet.data;
    if(currentSheet.type === 'group'){
        if(!item.members) item.members = [];
        if(item.members.includes(currentUser?.id)){ showToast('قبلاً عضو هستید', 'error'); return; }
        item.members.push(currentUser?.id);
        item.memberCount = (item.memberCount || 0) + 1;
        item.messages.push({id:'s'+Date.now(), text:`${currentUser?.name} به گروه پیوست`, time:getCurrentTime(), sent:false, system:true});
    } else {
        item.memberCount = (item.memberCount || 0) + 1;
        item.messages.push({id:'s'+Date.now(), text:`${currentUser?.name} به کانال پیوست`, time:getCurrentTime(), sent:false, system:true});
    }
    myMemberships.push({itemId:item.id, type:currentSheet.type, role:'member', userId:currentUser?.id, joinedAt:new Date().toISOString()});
    saveData(); renderSheet(); renderChats(); showToast('پیوستید', 'success');
    setTimeout(() => { closeProfileSheet(); openChatPage(currentSheet.type, item.id); }, 1000);
}

function leaveItem(){
    if(!currentSheet) return;
    const item = currentSheet.data;
    if(item.ownerId === currentUser?.id){ showToast('مالک نمی‌تواند ترک کند', 'error'); return; }
    if(currentSheet.type === 'group' && item.members){
        const idx = item.members.indexOf(currentUser?.id);
        if(idx > -1) item.members.splice(idx, 1);
        item.memberCount = Math.max(0, (item.memberCount||0) - 1);
        item.messages.push({id:'s'+Date.now(), text:`${currentUser?.name} گروه را ترک کرد`, time:getCurrentTime(), sent:false, system:true});
    } else {
        item.memberCount = Math.max(0, (item.memberCount||0) - 1);
        item.messages.push({id:'s'+Date.now(), text:`${currentUser?.name} کانال را ترک کرد`, time:getCurrentTime(), sent:false, system:true});
    }
    myMemberships = myMemberships.filter(m => m.itemId !== item.id);
    saveData(); showToast('ترک کردید', 'success');
    setTimeout(() => { closeProfileSheet(); closeChat(); renderChats(); }, 1000);
}

function deleteGroup(){
    if(!currentSheet) return;
    if(!confirm('حذف شود؟')) return;
    const item = currentSheet.data;
    if(currentSheet.type === 'group'){ groups = groups.filter(g => g.id !== item.id); localStorage.setItem('iran_groups', JSON.stringify(groups)); }
    else { channels = channels.filter(c => c.id !== item.id); localStorage.setItem('iran_channels', JSON.stringify(channels)); }
    myMemberships = myMemberships.filter(m => m.itemId !== item.id);
    localStorage.setItem('iran_memberships_' + currentUser.id, JSON.stringify(myMemberships));
    showToast('حذف شد', 'success');
    setTimeout(() => { closeProfileSheet(); closeChat(); renderChats(); }, 1000);
}

// ===== مخاطبین =====
function openContacts(){ document.getElementById('contactsPage').classList.add('active'); renderContacts(); }
function closeContacts(){ document.getElementById('contactsPage').classList.remove('active'); }

function renderContacts(){
    const users = JSON.parse(localStorage.getItem('iran_users') || '{}');
    const userList = Object.values(users);
    const contacts = userList.filter(u => u.id !== currentUser?.id);
    const installed = contacts.filter(u => u.installed !== false);
    let html = '';
    if(installed.length > 0){
        html += `<div class="section-title">اعضای ایران (${installed.length})</div>`;
        html += installed.map(user => {
            const color = getColor(user.name);
            const initials = getInitials(user.name);
            return `<div class="contact-item" onclick="startChat('${user.id}')"><div class="contact-avatar" style="background:${color}">${user.avatar?`<img src="${user.avatar}">`:initials}</div><div class="contact-info"><div class="contact-name">${user.name}</div><div class="contact-status">${user.id}</div></div></div>`;
        }).join('');
    }
    if(contacts.length === 0) html = `<div style="text-align:center;padding:60px 20px;color:#6c7883"><div style="font-size:1.1rem;margin-bottom:10px">هنوز مخاطبی ندارید</div></div>`;
    document.getElementById('contactsList').innerHTML = html;
}

function startChat(userId){
    const users = JSON.parse(localStorage.getItem('iran_users') || '{}');
    const user = users[Object.keys(users).find(k => users[k].id === userId)];
    if(!user) return;
    let chat = chats.find(c => c.id === userId);
    if(!chat){ chat = {id:userId, name:user.name, type:'personal', lastMessage:'', time:'الان', unread:0, read:true, online:true, avatar:user.avatar, messages:[], ownerId: currentUser.id}; chats.unshift(chat); }
    closeContacts(); openChatPage('personal', chat.id);
}

// ===== ساخت گروه/کانال =====
function openCreatePage(type){
    createType = type;
    const maxCount = type === 'group' ? groups.filter(g => g.ownerId === currentUser?.id).length : channels.filter(c => c.ownerId === currentUser?.id).length;
    if(maxCount >= 3){ showToast(`حد مجاز 3 ${type==='group'?'گروه':'کانال'}`, 'error'); return; }
    document.getElementById('createTitle').textContent = type === 'group' ? 'ساخت گروه' : 'ساخت کانال';
    document.getElementById('createName').value = '';
    document.getElementById('createLink').value = '';
    document.getElementById('createBio').value = '';
    document.getElementById('channelLinkGroup').style.display = 'block';
    selectedAvatar = null;
    const box = document.getElementById('avatarUploadBox');
    box.innerHTML = `<span id="avatarInitials"></span><div class="upload-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">`;
    document.getElementById('createPage').dataset.editing = '';
    document.getElementById('createPage').dataset.editType = '';
    document.getElementById('createPage').classList.add('active');
}

function closeCreatePage(){ document.getElementById('createPage').classList.remove('active'); }

function handleAvatarUpload(event){
    const file = event.target.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            selectedAvatar = e.target.result;
            const box = document.getElementById('avatarUploadBox');
            box.innerHTML = `<img src="${selectedAvatar}"><div class="upload-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">`;
        };
        reader.readAsDataURL(file);
    }
}

function submitCreate(){
    const name = document.getElementById('createName').value.trim();
    const link = document.getElementById('createLink').value.trim();
    const bio = document.getElementById('createBio').value.trim();
    const editingId = document.getElementById('createPage').dataset.editing;
    const editingType = document.getElementById('createPage').dataset.editType;
    if(!name){ showToast('نام را وارد کنید', 'error'); return; }

    if(editingId){
        // ویرایش
        const item = editingType === 'group' ? groups.find(g => g.id === editingId) : channels.find(c => c.id === editingId);
        if(item){
            const oldName = item.name;
            item.name = name;
            item.bio = bio;
            if(selectedAvatar) item.avatar = selectedAvatar;
            if(link && link !== item.link) item.link = link;
            if(oldName !== name) item.messages.push({id:'s'+Date.now(), text:`نام از "${oldName}" به "${name}" تغییر کرد`, time:getCurrentTime(), sent:false, system:true});
            saveData(); showToast('ویرایش شد', 'success');
            closeCreatePage(); renderChats();
            if(currentChat && currentChat.data.id === editingId){
                document.getElementById('chatHeaderName').textContent = name;
                if(selectedAvatar) document.getElementById('chatHeaderAvatar').innerHTML = `<img src="${selectedAvatar}">`;
            }
        }
    } else {
        // ساخت جدید
        const newItem = {
            id: 'c_' + Date.now(),
            name,
            link: link || generateUniqueLink(),
            bio,
            avatar: selectedAvatar,
            ownerId: currentUser.id,
            ownerName: currentUser.name,
            members: createType === 'group' ? [currentUser.id] : [],
            admins: [],
            memberCount: createType === 'group' ? 1 : 0,
            createdAt: getCurrentDate(),
            messages: [{id:'s'+Date.now(), text:`${createType==='group'?'گروه':'کانال'} "${name}" ایجاد شد`, time:getCurrentTime(), sent:false, system:true}],
            hiddenMembers: false,
            pinnedMessage: null,
            restrictCopy: false,
            restrictForward: false,
            restrictScreenshot: false,
            slowMode: 0
        };

        if(createType === 'group'){
            groups.push(newItem);
            localStorage.setItem('iran_groups', JSON.stringify(groups));
        } else {
            channels.push(newItem);
            localStorage.setItem('iran_channels', JSON.stringify(channels));
        }

        myMemberships.push({itemId:newItem.id, type:createType, role:'owner', userId:currentUser.id, joinedAt:new Date().toISOString()});
        localStorage.setItem('iran_memberships_' + currentUser.id, JSON.stringify(myMemberships));

        showToast(`${createType==='group'?'گروه':'کانال'} با موفقیت ایجاد شد`, 'success');
        closeCreatePage();
        renderChats();
        setTimeout(() => openChatPage(createType, newItem.id), 300);
    }
}

// ===== افزودن عضو =====
function openAddMemberModal(){
    if(!currentSheet) return;
    if(!isOwnerOrAdminOf(currentSheet.data)){ showToast('فقط مالک و مدیر', 'error'); return; }
    document.getElementById('addMemberModal').classList.add('active');
    switchAddTab('contacts', document.querySelector('.add-member-tab'));
}
function closeAddMemberModal(){ document.getElementById('addMemberModal').classList.remove('active'); }
function switchAddTab(tab, btn){
    document.querySelectorAll('.add-member-tab').forEach(t => t.classList.remove('active'));
    if(btn) btn.classList.add('active');
    if(tab === 'contacts'){ document.getElementById('addByContacts').style.display = 'block'; document.getElementById('addById').style.display = 'none'; renderAddMemberList(); }
    else { document.getElementById('addByContacts').style.display = 'none'; document.getElementById('addById').style.display = 'block'; }
}
function renderAddMemberList(){
    const users = JSON.parse(localStorage.getItem('iran_users') || '{}');
    const userList = Object.values(users).filter(u => u.id !== currentUser?.id);
    const item = currentSheet.data;
    const existing = myMemberships.filter(m => m.itemId === item.id).map(m => m.userId);
    const available = userList.filter(u => !existing.includes(u.id));
    const list = document.getElementById('addMemberList');
    if(available.length === 0){ list.innerHTML = '<div style="text-align:center;padding:30px;color:#6c7883">مخاطبی نیست</div>'; return; }
    list.innerHTML = available.map(user => {
        const color = getColor(user.name);
        const initials = getInitials(user.name);
        return `<div class="add-member-item" onclick="addMemberToChannel('${user.id}')"><div class="contact-avatar" style="background:${color}">${user.avatar?`<img src="${user.avatar}">`:initials}</div><div class="contact-info"><div class="contact-name">${user.name}</div><div class="contact-status">${user.id}</div></div></div>`;
    }).join('');
}
function addMemberToChannel(userId){
    if(!currentSheet) return;
    const item = currentSheet.data;
    const users = JSON.parse(localStorage.getItem('iran_users') || '{}');
    const user = users[userId];
    const already = myMemberships.some(m => m.itemId === item.id && m.userId === userId);
    if(already){ showToast('قبلاً عضو است', 'error'); return; }
    item.memberCount = (item.memberCount || 0) + 1;
    item.messages.push({id:'s'+Date.now(), text:`${user?user.name:'کاربر'} به کانال اضافه شد`, time:getCurrentTime(), sent:false, system:true});
    myMemberships.push({itemId:item.id, type:'channel', role:'member', userId:userId, joinedAt:new Date().toISOString()});
    saveData(); showToast(`${user?user.name:'کاربر'} اضافه شد`, 'success'); renderSheet(); closeAddMemberModal();
}
function addMemberById(){
    const id = document.getElementById('addByIdInput').value.trim();
    if(!id){ showToast('آیدی را وارد کنید', 'error'); return; }
    const users = JSON.parse(localStorage.getItem('iran_users') || '{}');
    const user = Object.values(users).find(u => u.id === id || u.id === '@' + id);
    if(!user){ showToast('یافت نشد', 'error'); return; }
    addMemberToChannel(user.id);
    document.getElementById('addByIdInput').value = '';
}

// ===== منوی هدر =====
function showHeaderMenu() {
    if (!currentChat) return;
    const menu = document.getElementById('contextMenu');
    let html = '';
    if (currentChat.type === 'personal') {
        const isBlocked = blockedUsers.includes(currentChat.data.id);
        html += `<div class="context-menu-item danger" onclick="deletePVChat()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>حذف گفتگو</div>`;
        html += `<div class="context-menu-item" onclick="toggleBlockUser()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>${isBlocked ? 'رفع مسدودی' : 'مسدود کردن'}</div>`;
        html += `<div class="context-menu-item danger" onclick="openReportModal('personal')"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>گزارش</div>`;
    } else {
        html += `<div class="context-menu-item danger" onclick="openReportModal('${currentChat.type}')"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>گزارش</div>`;
    }
    menu.innerHTML = html;
    const rect = document.querySelector('.chat-header-actions button').getBoundingClientRect();
    menu.style.left = (rect.left - 100) + 'px';
    menu.style.top = (rect.bottom + 5) + 'px';
    menu.classList.add('active');
    setTimeout(() => { document.addEventListener('click', hideContextMenu, {once:true}); }, 10);
}

function deletePVChat() {
    hideContextMenu();
    if (!currentChat || currentChat.type !== 'personal') return;
    chats = chats.filter(c => c.id !== currentChat.data.id);
    saveData();
    closeChat();
    renderChats();
    showToast('گفتگو حذف شد', 'success');
}

function toggleBlockUser() {
    hideContextMenu();
    if (!currentChat || currentChat.type !== 'personal') return;
    const userId = currentChat.data.id;
    const idx = blockedUsers.indexOf(userId);
    if (idx > -1) {
        blockedUsers.splice(idx, 1);
        showToast('کاربر از مسدودی خارج شد', 'success');
    } else {
        blockedUsers.push(userId);
        showToast('کاربر مسدود شد', 'success');
    }
    saveData();
    openChatPage('personal', userId);
}

function openReportModal(type) {
    hideContextMenu();
    window.reportTargetType = type;
    document.getElementById('reportReason').value = 'spam';
    document.getElementById('reportDesc').value = '';
    document.getElementById('reportModal').classList.add('active');
}

function closeReportModal() {
    document.getElementById('reportModal').classList.remove('active');
}

function submitReport() {
    const reason = document.getElementById('reportReason').value;
    const desc = document.getElementById('reportDesc').value.trim();
    if (!desc) { showToast('لطفاً توضیحات را وارد کنید', 'error'); return; }
    console.log('Report:', { type: window.reportTargetType, chatId: currentChat?.data?.id, reason, desc });
    closeReportModal();
    showToast('گزارش شما ثبت شد', 'success');
}

// ===== تنظیمات =====
function openSettings() {
    if (!currentSheet || !isOwnerOrAdminOf(currentSheet.data)) return;
    const data = currentSheet.data;
    document.getElementById('setRestrictCopy').checked = !!data.restrictCopy;
    document.getElementById('setRestrictForward').checked = !!data.restrictForward;
    document.getElementById('setRestrictScreenshot').checked = !!data.restrictScreenshot;
    document.getElementById('setSlowMode').value = data.slowMode || 0;
    document.getElementById('settingsModal').classList.add('active');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
function saveSettings() {
    if (!currentSheet) return;
    const data = currentSheet.data;
    data.restrictCopy = document.getElementById('setRestrictCopy').checked;
    data.restrictForward = document.getElementById('setRestrictForward').checked;
    data.restrictScreenshot = document.getElementById('setRestrictScreenshot').checked;
    data.slowMode = parseInt(document.getElementById('setSlowMode').value);
    if (data.restrictCopy) {
        document.getElementById('messagesArea').style.userSelect = 'none';
        document.getElementById('messagesArea').style.webkitUserSelect = 'none';
    } else {
        document.getElementById('messagesArea').style.userSelect = 'text';
        document.getElementById('messagesArea').style.webkitUserSelect = 'text';
    }
    saveData();
    closeSettings();
    showToast('تنظیمات ذخیره شد', 'success');
}

// ===== جستجوی عمومی =====
function openSearchPage() {
    document.getElementById('searchPage').classList.add('active');
    document.getElementById('searchPageInput').value = '';
    document.getElementById('searchResults').innerHTML = '<div class="search-empty">برای جستجو، کلمه‌ای وارد کنید<br>مثلاً: #ایران</div>';
    setTimeout(() => document.getElementById('searchPageInput').focus(), 300);
}

function closeSearchPage() {
    document.getElementById('searchPage').classList.remove('active');
}

document.getElementById('searchPageInput').addEventListener('input', function(e) {
    const q = e.target.value.trim().toLowerCase();
    const resultsDiv = document.getElementById('searchResults');
    if (!q) {
        resultsDiv.innerHTML = '<div class="search-empty">برای جستجو، کلمه‌ای وارد کنید<br>مثلاً: #ایران</div>';
        return;
    }

    // جستجو فقط در گروه‌ها و کانال‌های عمومی
    const allPublic = [...groups, ...channels];
    const filtered = allPublic.filter(item => {
        const nameMatch = item.name.toLowerCase().includes(q);
        const bioMatch = (item.bio || '').toLowerCase().includes(q);
        return nameMatch || bioMatch;
    });

    if (filtered.length === 0) {
        resultsDiv.innerHTML = '<div class="search-empty">نتیجه‌ای یافت نشد</div>';
        return;
    }

    resultsDiv.innerHTML = filtered.map(item => {
        const color = getColor(item.name);
        const initials = getInitials(item.name);
        const type = groups.includes(item) ? 'group' : 'channel';
        const typeIcon = type === 'group' ? '' : '📢';
        const typeName = type === 'group' ? 'گروه' : 'کانال';
        const isJoined = myMemberships.some(m => m.itemId === item.id) || item.ownerId === currentUser.id;
        return `<div class="chat-item" onclick="openChatPage('${type}','${item.id}');closeSearchPage();">
            <div class="chat-avatar" style="background:${color}">${item.avatar ? `<img src="${item.avatar}">` : initials}</div>
            <div class="chat-info">
                <div class="chat-top"><div class="chat-name">${typeIcon} ${item.name}</div><div class="chat-time">${typeName}</div></div>
                <div class="chat-bottom"><div class="chat-message">${item.bio ? item.bio.substring(0, 50) : 'بدون توضیحات'}</div>${isJoined ? '<div style="color:#2ecc71;font-size:0.75rem">عضو هستید</div>' : ''}</div>
            </div>
        </div>`;
    }).join('');
});

// ===== Toast =====
function showToast(text, type='error'){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== Event Listeners =====
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', function(e){ if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') e.preventDefault(); });
document.addEventListener('touchstart', function(e){ if(e.touches.length > 1) e.preventDefault(); }, {passive:false});
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e){ const now = Date.now(); if(now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, false);

document.addEventListener('keyup', (e) => {
    if (e.key === 'PrintScreen' && currentChat && currentChat.data.restrictScreenshot) {
        e.preventDefault();
        showToast('اسکرین‌شات در این گفتگو غیرمجاز است', 'error');
        document.body.classList.add('screenshot-protected');
        setTimeout(() => document.body.classList.remove('screenshot-protected'), 1500);
    }
});
document.addEventListener('visibilitychange', () => {
    if (currentChat && currentChat.data.restrictScreenshot) {
        if (document.hidden) { document.body.classList.add('screenshot-protected'); }
        else { document.body.classList.remove('screenshot-protected'); }
    }
});

// ===== بررسی لینک در URL =====
window.addEventListener('load', () => {
    const hash = window.location.hash;
    if (hash.startsWith('#/g/')) {
        const linkCode = hash.substring(4);
        setTimeout(() => openGroupByLink(linkCode), 500);
    }
    renderChats();
});

renderChats();
</script>
