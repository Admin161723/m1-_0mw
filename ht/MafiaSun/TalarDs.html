<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d2135">
<title>مافیاسان</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;font-family:Tahoma,'Inter',Arial,sans-serif}
  html,body{height:100%;overflow:hidden;position:fixed;inset:0;background:#071525}
  input,textarea,select{-webkit-user-select:text!important;user-select:text!important;font-size:16px!important}
  .phone{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#0d1f35;overflow:hidden;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column;background:#0d1f35}
  .view.active{display:flex}

  /* ==== TOP BAR - نازک و چسبیده به بالا ==== */
  .list-topbar,.room-top-bar{flex-shrink:0;z-index:20}
  .list-topmain,.room-top-main{
    height:calc(42px + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 8px 0;
    background:linear-gradient(179deg,#074461 0%,#296187 100%);
    border-radius:0 0 12px 12px;
    display:flex;
    align-items:center;
    gap:5px;
    box-shadow:inset 0 2px 4px rgba(255,255,255,.15),0 3px 8px rgba(0,0,0,.3);
  }
  .top-title,.room-lobby-name{flex:1;text-align:center;color:#fff;font-size:14px;font-weight:900;text-shadow:0 2px 5px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
  .top-icon-btn,.back-fab{width:34px;height:34px;border:none;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:900;padding:0;color:#fff;transition:transform .15s}
  .top-icon-btn:active,.back-fab:active{transform:translateY(2px) scale(.96)}
  .panel-btn{background:linear-gradient(180deg,#ffc107,#ff9800);color:#3a2a00;box-shadow:0 3px 0 #6b4f00,inset 0 1px 2px rgba(255,255,255,.4);display:none}
  .panel-btn.show{display:flex}
  .back-fab{background:linear-gradient(180deg,#f44336,#d32f2f);color:#fff;box-shadow:0 3px 0 #4a0a0a,inset 0 1px 2px rgba(255,255,255,.3)}
  .start-top-btn{width:50px;height:34px;border:2px solid #ffd700;border-radius:9px;background:linear-gradient(180deg,#ffc107,#ff9800);color:#3a2a00;font-size:9px;font-weight:900;cursor:pointer;flex-shrink:0;padding:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 2px 0 #6b4f00,0 0 8px rgba(255,193,7,.4);line-height:1}
  .start-top-btn.show{display:flex}
  .start-top-btn.disabled{opacity:.55;filter:grayscale(.6);pointer-events:none}
  .start-top-btn .play-ico{width:0;height:0;border-left:7px solid #3a2a00;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
  .room-icon-btn{width:34px;height:34px;border:2px solid #fff;border-radius:9px;cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:#fff;font-size:16px;transition:transform .15s}
  .room-icon-btn.show{display:flex}
  .room-icon-btn:active{transform:scale(.92)}
  .ghost-btn{background:linear-gradient(180deg,#9c27b0,#7b1fa2);box-shadow:0 3px 0 #3d1050}
  .ghost-btn.on{box-shadow:0 0 12px #b040ff,0 3px 0 #3d1050}
  .settings-btn{background:linear-gradient(180deg,#ffc107,#ff9800);box-shadow:0 3px 0 #6b4f00}
  .ghost-ico{width:15px;height:17px;background:#fff;border-radius:8px 8px 3px 3px;position:relative}
  .ghost-ico::before,.ghost-ico::after{content:'';position:absolute;top:5px;width:3px;height:3px;background:#333;border-radius:50%}
  .ghost-ico::before{left:3px} .ghost-ico::after{right:3px}
  .gear-ico{width:17px;height:17px;background:#5a4500;border-radius:50%;position:relative}
  .gear-ico::before{content:'';position:absolute;inset:4px;background:#ffc107;border-radius:50%}
  .gear-ico::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#5a4500 0 12%,transparent 12% 25%,#5a4500 25% 37%,transparent 37% 50%,#5a4500 50% 62%,transparent 62% 75%,#5a4500 75% 87%,transparent 87%)}

  .search-wrap{margin:10px 12px;position:relative}
  .search-wrap input{width:100%;height:42px;padding:0 40px 0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(180deg,rgba(167,186,196,.35),rgba(2,88,163,.4));color:#fff;font-size:14px;font-weight:800;outline:none;text-align:right}
  .search-wrap input::placeholder{color:rgba(255,255,255,.65)}
  .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:3px solid #7ec3f0;border-radius:50%;pointer-events:none}
  .s-icon::after{content:'';position:absolute;width:8px;height:3px;background:#7ec3f0;bottom:-5px;right:-6px;transform:rotate(45deg);border-radius:2px}

  .rooms-scroll{flex:1;overflow-y:auto;padding:8px 12px 100px;scrollbar-width:none}
  .rooms-scroll::-webkit-scrollbar{display:none}
  .empty-list{text-align:center;color:rgba(255,255,255,.55);padding:60px 20px;font-size:13px;font-weight:700}

  .room-card{position:relative;width:100%;max-width:400px;min-height:104px;margin:0 auto 12px;border-radius:12px;background:linear-gradient(180deg,rgba(167,186,196,.55) 0%,rgba(132,176,191,.55) 27%,rgba(2,88,163,.6) 100%);box-shadow:0 4px 0 #050d18,0 5px 10px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:10px 12px 30px;gap:10px}
  .lc-right{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:hidden;min-width:0}
  .lc-name-row{display:flex;align-items:center;gap:6px}
  .lc-name-tag{background:#642fa8;color:#fff;font-size:9px;font-weight:900;padding:2px 7px;border-radius:8px;flex-shrink:0}
  .lc-name{color:#fff;font-size:14px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .lc-code{color:rgba(255,255,255,.6);font-size:10px;font-weight:800;margin-right:2px}
  .lc-divider{width:1px;height:60px;background:rgba(255,255,255,.35);flex-shrink:0}
  .lc-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex-shrink:0;min-width:80px}
  .lc-top-row{display:flex;align-items:center;justify-content:center;gap:10px}
  .lc-counter{color:#fff;font-size:13px;font-weight:900;background:#1c1c1c;padding:3px 11px;border-radius:8px;box-shadow:inset 0 2px 3px rgba(0,0,0,.6);min-width:50px;text-align:center;letter-spacing:.8px;display:flex;align-items:center;justify-content:center;gap:3px}
  .lc-counter .cnt-dot{width:9px;height:9px;border-radius:50%;background:#4aa3e0;display:inline-block}
  .lc-super{color:#ffd700;font-size:11px;font-weight:900;background:rgba(255,215,0,.12);border:1px solid #d4b42a;border-radius:8px;padding:2px 8px;white-space:nowrap}
  .lc-join{padding:8px 18px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:900;color:#fff;background:linear-gradient(180deg,#a677ed 0%,#642fa8 100%);box-shadow:0 3px 0 #3d1a6b,0 4px 8px rgba(100,47,168,.5);white-space:nowrap;min-width:80px;font-family:Tahoma,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .lc-join:active{transform:translateY(2px);box-shadow:0 1px 0 #3d1a6b}
  .lc-join.locked{background:linear-gradient(180deg,#6a6a6a 0%,#3a3a3a 100%);box-shadow:0 3px 0 #1a1a1a,0 4px 8px rgba(0,0,0,.5)}
  .lc-owner-badge{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,rgba(255,217,74,.18) 0%,rgba(179,134,0,.18) 100%);padding:2px 10px;border-radius:8px;border:1px solid rgba(255,217,74,.35);font-size:10px;font-weight:900;color:#ffd94a;text-shadow:0 1px 3px rgba(0,0,0,.95);white-space:nowrap;pointer-events:none;max-width:85%;overflow:hidden;text-overflow:ellipsis}
  .lc-owner-crown{font-size:11px;line-height:1;display:inline-block}
  .lc-owner-name{color:#fff;font-size:10px;font-weight:900;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .lc-owner-rank{color:#e1bee7;font-size:9px;font-weight:900;padding:0 4px;border-right:1px solid rgba(255,255,255,.3);margin-right:4px}

  .delete-room-btn{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#e74c3c,#c0392b);border:2px solid #ff6b6b;color:white;font-size:13px;font-weight:900;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;padding-bottom:2px}
  .delete-room-btn.show{display:flex}

  .tick-img{width:13px;height:13px;object-fit:contain;vertical-align:middle}
  .crown{display:inline-block;width:15px;height:12px;position:relative;vertical-align:middle;flex-shrink:0;background:linear-gradient(180deg,#FFE066 0%,#FFC107 45%,#B8860B 100%);-webkit-clip-path:polygon(0% 100%,0% 35%,14% 60%,28% 15%,50% 55%,72% 15%,86% 60%,100% 35%,100% 100%);clip-path:polygon(0% 100%,0% 35%,14% 60%,28% 15%,50% 55%,72% 15%,86% 60%,100% 35%,100% 100%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}

  .list-bottombar{position:absolute;bottom:0;left:0;right:0;background:#052a42;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .list-bottommain{height:64px;background:linear-gradient(179deg,#074461 0%,#296187 100%);border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px;box-shadow:inset 0 2px 4px rgba(255,255,255,.15),0 -3px 10px rgba(0,0,0,.3)}
  .fab{width:50px;height:50px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:white;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.2)}
  .fab:active{transform:translateY(2px)}
  .fab-refresh{background:linear-gradient(180deg,#ff9500,#ff6a00)}
  .fab-refresh.spinning span{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fab-add{background:linear-gradient(180deg,#4aa3e0,#2a7fb8);font-size:32px;padding-bottom:6px}

  .middle{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;background:#23356b;overflow:hidden;padding-top:8px}
  #group{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;justify-content:space-evenly;padding:6px 10px 4px;gap:3px}
  .row{direction:ltr;display:flex;justify-content:space-between;align-items:flex-start;width:100%}
  .row.observers{justify-content:center;gap:28px;margin-bottom:2px}
  .slot-wrap{width:calc(50% - 6px);max-width:145px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;position:relative}
  .slot{position:relative;width:clamp(60px,11.5vh,86px);height:clamp(60px,11.5vh,86px);aspect-ratio:1/1;border-radius:50%;background:#1d294f;box-shadow:inset 0 5px 7px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.35);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:visible;transition:transform .15s}
  .slot:active{transform:scale(.95)}
  .slot.observer{background:#23315c}
  .slot.filled{background:linear-gradient(180deg,#3a5a8f,#24375a)}
  .slot.ready-green{animation:readyG 2s ease-in-out infinite}
  .slot.ready-red{animation:readyR 2s ease-in-out infinite}
  @keyframes readyG{0%,100%{box-shadow:inset 0 5px 7px rgba(0,0,0,.35),0 0 0 2px #4CAF50,0 0 22px 6px rgba(76,175,80,.55),0 0 45px 14px rgba(76,175,80,.22)}50%{box-shadow:inset 0 5px 7px rgba(0,0,0,.35),0 0 0 2px #66BB6A,0 0 32px 10px rgba(76,175,80,.95),0 0 65px 20px rgba(76,175,80,.45)}}
  @keyframes readyR{0%,100%{box-shadow:inset 0 5px 7px rgba(0,0,0,.35),0 0 0 2px #f44336,0 0 22px 6px rgba(244,67,54,.55),0 0 45px 14px rgba(244,67,54,.22)}50%{box-shadow:inset 0 5px 7px rgba(0,0,0,.35),0 0 0 2px #ef5350,0 0 32px 10px rgba(244,67,54,.95),0 0 65px 20px rgba(244,67,54,.45)}}
  .slot .avatar-wrap{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .slot img.avatar-mini,.slot video.avatar-mini{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .num{position:absolute;top:-7px;left:-7px;width:22px;height:22px;background:#304380;border-radius:50%;color:#cddcf5;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.15);z-index:5;pointer-events:none}
  .slot.observer .num{background:#5c4a8a}
  .top-badges{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:3px;z-index:22;pointer-events:none;max-width:140%;white-space:nowrap}
  .rank-medal{padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#9c27b0,#6a1b9a);border:1px solid #ce93d8;box-shadow:0 0 6px rgba(156,39,176,.8);font-size:7px;font-weight:900;color:#fff;white-space:nowrap;line-height:1.35}
  .rank-medal .rm-rank{font-size:7px;color:#fff;font-weight:900}
  .top-badges .clan-tag{font-size:7px;padding:1px 5px;border-radius:6px;background:#000;border:1px solid #333;display:inline-flex;align-items:center;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.75);line-height:1.35}
  .top-badges .clan-tag .role-lbl{font-size:6px;color:#fff;opacity:.9;font-weight:900}
  .top-badges .clan-tag.owner .tag-txt{color:#ffd700}
  .top-badges .clan-tag.deputy .tag-txt{color:#42a5f5}
  .top-badges .clan-tag.member .tag-txt{color:#66bb6a}
  .top-badges .clan-tag.noColor .tag-txt{color:#fff}
  .voice-indicator{position:absolute;width:22px;height:22px;top:-8px;right:-8px;display:none;align-items:center;justify-content:center;z-index:15;background:rgba(15,173,7,.9);border-radius:50%;border:2px solid #81c784;box-shadow:0 0 10px rgba(15,173,7,.9);font-size:11px;color:#fff}
  .voice-indicator.speaking{display:flex;animation:voicePulse .8s ease-in-out infinite}
  @keyframes voicePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  .reaction-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;overflow:hidden;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none}
  .reaction-overlay.show{display:flex;animation:reactionFade 3.5s ease-out forwards}
  .reaction-overlay img{width:100%;height:100%;object-fit:cover;border-radius:50%;filter:drop-shadow(0 4px 12px rgba(0,0,0,.85))}
  @keyframes reactionFade{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}16%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
  .disconnected-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);border-radius:50%;display:none;align-items:center;justify-content:center;z-index:12;color:#f44336;font-weight:900;font-size:22px}
  .disconnected-overlay.show{display:flex}
  .name-wrap{direction:rtl;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;max-width:135px;padding:0 2px}
  .name{width:100%;font-size:clamp(9px,1.5vh,12px);color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;gap:3px}
  .name.me{color:#ffd94a;font-weight:900}
  .name.manager{color:#ffd700;font-weight:900}
  .name .nm-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}

  .room-bottom-bar{flex-shrink:0;background:#052a42;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .room-bottom-main{height:58px;background:linear-gradient(179deg,#074461 0%,#296187 100%);border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px;box-shadow:inset 0 2px 4px rgba(255,255,255,.15),0 -3px 10px rgba(0,0,0,.3)}
  .bottom-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .bottom-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .action-btn{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.1);padding:0;flex-shrink:0;transition:transform .15s,opacity .2s}
  .action-btn img{width:100%;height:100%;object-fit:contain;border-radius:50%}
  .action-btn:active{transform:scale(.9)}
  .action-btn.small{width:34px;height:34px}
  .action-btn.mic-on{background:linear-gradient(180deg,#4CAF50,#388e3c);border-color:#81c784;box-shadow:0 0 20px rgba(76,175,80,.9)}
  .action-btn.mic-on img{filter:brightness(0) invert(1)}
  .action-btn.cooling{opacity:.35;pointer-events:none}
  .chat-ico{width:20px;height:20px;background:white;border-radius:5px;position:relative}
  .chat-ico::after{content:'';position:absolute;bottom:-4px;left:3px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:5px solid white}
  .chat-ico::before{content:'';position:absolute;top:5px;left:4px;width:12px;height:2px;background:#2a5a8a;box-shadow:0 3px 0 #2a5a8a,0 6px 0 #2a5a8a}
  .ready-btn{min-width:100px;padding:10px 10px;border:none;border-radius:10px;font-size:12px;font-weight:900;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
  .ready-btn.not{background:linear-gradient(180deg,#f44336,#d32f2f);box-shadow:0 3px 0 #4a0a0a}
  .ready-btn.yes{background:linear-gradient(180deg,#55b055,#3f8f3f);box-shadow:0 3px 0 #1a4a1a}
  .ready-btn.disabled{background:linear-gradient(180deg,#888,#555);cursor:not-allowed;opacity:.7;box-shadow:0 3px 0 #222}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.active{display:flex}
  .overlay.higher{z-index:1100}
  .modal{background:linear-gradient(180deg,#1e3a5f,#0d2135);border:2px solid #3f8fd4;border-radius:18px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto;padding:22px 18px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.75);color:#fff}
  .modal-close{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#d32f2f,#7f1a1a);border:2px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:900;padding-bottom:2px;z-index:5}
  .modal-title{color:#ffd700;font-size:18px;font-weight:900;text-align:center;margin-bottom:16px}
  .form-label{color:rgba(255,255,255,.8);font-size:12px;font-weight:800;display:block;margin-bottom:6px;margin-top:8px}
  .form-input{width:100%;height:48px;border-radius:12px;border:none;background:rgba(255,255,255,.95);color:#0d1a30;font-size:15px;font-weight:800;padding:0 14px;outline:none;text-align:center;margin-bottom:12px}
  .btn-green{width:100%;height:48px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(180deg,#0fad07,#136b0e 50%,#084001);box-shadow:0 4px 0 #042000}
  .btn-green:active{transform:translateY(3px)}
  .btn-red{width:100%;height:48px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(180deg,#d32f2f,#7f1a1a);box-shadow:0 4px 0 #4a0a0a;margin-top:8px}
  .btn-select{width:100%;height:52px;border:none;border-radius:12px;cursor:pointer;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#4a9eff,#1565c0 50%,#0d47a1);box-shadow:0 4px 0 #0a2f6b;display:flex;align-items:center;justify-content:center;padding:0 18px;margin-bottom:12px}
  .btn-select.selected{background:linear-gradient(180deg,#0fad07,#136b0e 50%,#084001);box-shadow:0 4px 0 #042000}
  .lock-row{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.3);border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
  .lock-row-label{color:#fff;font-size:13px;font-weight:800}

    for(const g of gs){
      if(!g)continue;
      if(g.owner===phone){clanRoleCache[phone]={group:g,role:'owner'};return clanRoleCache[phone]}
      if(g.members&&g.members.includes(phone)){
        const role=(g.deputies&&g.deputies.includes(phone))?'deputy':'member';
        clanRoleCache[phone]={group:g,role};return clanRoleCache[phone]
      }
    }
    clanRoleCache[phone]=null;return null
  }catch(e){return null}
}
function roleLabel(role){if(role==='owner')return 'مالک';if(role==='deputy')return 'معاون';return 'عضو'}
function clanTagTopHtml(gi){
  if(!gi)return '';
  const role=gi.role;const tag=gi.group.tag||gi.group.name||'';
  const shortTag=tag.length>6?tag.substring(0,6)+'…':tag;
  const cls=role==='owner'?'owner':(role==='deputy'?'deputy':'member');
  return '<span class="clan-tag '+cls+'"><span class="role-lbl">'+roleLabel(role)+'</span><span class="tag-txt">'+esc(shortTag)+'</span></span>';
}

async function deleteRoomFromList(id){

function mySeat(room){
  if(!room)return null;
  for(const[i,p]of Object.entries(room.seats||{}))if(p===me.phone)return{type:'player',idx:+i};
  for(const[i,p]of Object.entries(room.supers||{}))if(p===me.phone)return{type:'super',idx:+i};
  return null;
}
function myRoom(rs){for(const r of Object.values(rs)){if((r.status==='waiting'||r.status==='pending')&&mySeat(r))return r}return null}
function myRoomsCount(rs){return Object.values(rs).filter(r=>r.managerPhone===me.phone&&(r.status==='waiting'||r.status==='pending')).length}

async function joinRoom(id){
  const rs=await getRooms();const r=rs[id];
  if(!r||r.status!=='waiting')return;
  if((r.blocked||[]).includes(me.phone))return;
  const al=myRoom(rs);if(al&&al.id!==id)return;
  if(r.password&&r.managerPhone!==me.phone){const p=prompt('رمز:');if(p===null||p!==r.password)return}
  let seat=null;
  if(!mySeat(r)){for(let i=1;i<=MAX_PLAYERS;i++){if(!r.seats[i]&&!r.bots[i]){seat=i;break}}if(!seat){showModal('⚠️','پره');return}r.seats[seat]=me.phone}
  if(r.kicked&&r.kicked[me.phone])delete r.kicked[me.phone];
  await saveRooms(rs);
  localStorage.setItem('current_in_lobby',id);
  openRoom(id,r);
  const ld=await getLive(id);if(!ld.seats)ld.seats={};if(seat)ld.seats[seat]=me.phone;await setLive(id,ld);
}
async function createRoom(){
  if(isProcessingAction)return;isProcessingAction=true;
  try{
    const rs=await getRooms();
    if(myRoom(rs)){showModal('⚠️','شما در لابی هستید');isProcessingAction=false;return}
    if(myRoomsCount(rs)>=MAX_ROOMS_PER_USER){showModal('⚠️','حداکثر');isProcessingAction=false;return}
    if(!selectedName){showModal('⚠️','اول نام انتخاب کن');isProcessingAction=false;return}
    const pass=passOn?$('lobbyPassInput').value.trim():null;
    if(passOn&&!pass){showModal('⚠️','رمز حداقل ۲');isProcessingAction=false;return}
    const id='R'+Date.now();
    const code=String(Math.floor(1000+Math.random()*9000));
    rs[id]={id,name:selectedName,code:code,managerPhone:me.phone,creatorName:me.name,creatorRank:me.rank,password:pass,seats:{1:me.phone},bots:{},supers:{},ready:{},ghost:[],blocked:[],kicked:{},status:'waiting',createdAt:Date.now()};
    await saveRooms(rs);
    await setLive(id,{seats:{1:me.phone},supers:{},ready:{},reactions:{},chat:[]});
    localStorage.setItem('current_in_lobby',id);
    $('createModal').classList.remove('active');
    openRoom(id,rs[id]);
  }finally{setTimeout(()=>{isProcessingAction=false},300)}
}
function openRoom(id,rd){

  $('viewList').classList.remove('active');

  $('kickOverlay').classList.remove('show');
  $('deletedOverlay').classList.remove('show');

  if(rd)renderRoom(rd,usersCache.data||{});
  if(!roomTimer)roomTimer=setInterval(refreshRoom,10000);

  loadAgora().then(()=>initVoice());

async function refreshRoom(){
  if(!currentRoomId||overlayShown)return;
  const rs=await getRooms();const r=rs[currentRoomId];
  if(!r){
    if(localStorage.getItem('current_in_lobby')===currentRoomId){setTimeout(refreshRoom,2000);return;}
    startListView();return;
  }
  if(r.status==='deleted'){overlayShown=true;stopTimers();disconnectVoice();$('deletedReason').textContent='دلیل: '+(r.deleteReason||'نامشخص');$('deletedOverlay').classList.add('show');return}
  if(r.kicked&&r.kicked[me.phone]&&!mySeat(r)){overlayShown=true;stopTimers();disconnectVoice();$('kickOverlay').classList.add('show');return}
  if(!mySeat(r)){
    let seat=null;
    for(let i=1;i<=MAX_PLAYERS;i++){if(!r.seats[i]&&!r.bots[i]){seat=i;break}}
    if(seat){r.seats[seat]=me.phone;await saveRooms(rs)}
    else if(r.managerPhone!==me.phone){stopTimers();disconnectVoice();startListView();return}
  }
  if(r.status==='playing'){localStorage.setItem('current_game_room',currentRoomId);$('startOverlay').classList.add('show');return}
  const ld=await getLive(currentRoomId);
  if(ld.seats)r.seats=ld.seats;if(ld.supers)r.supers=ld.supers;if(ld.ready)r.ready=ld.ready;
  const hash=JSON.stringify({s:r.seats,ss:r.supers,rd:r.ready,g:r.ghost,n:r.name,st:r.status});
  if(hash===window._lastRoomHash)return;
  window._lastRoomHash=hash;
  const u=await getUsersCached(false);
  renderRoom(r,u);
}
async function renderRoom(room,allUsers){
  $('roomNameTop').textContent=room.name;

  const canGhost=myLvl>=RANK_LEVEL['ناظر'];
  $('btnGhost').classList.toggle('show',canGhost);
  $('btnGhost').classList.toggle('on',(room.ghost||[]).includes(me.phone));
  const stb=$('btnStartTop');
  if(isMgr){
    const hum=Object.values(room.seats||{}).filter(Boolean);

  }else stb.classList.remove('show');
  const allP=new Set();
  Object.values(room.seats||{}).forEach(p=>{if(p)allP.add(p)});

  for(const ph of allP){if(!allUsers[ph]){const u=await getUser(ph);if(u)allUsers[ph]=u}}
  const groupCache={};

  for(const ph of allP){if(ph)gps.push((async()=>{groupCache[ph]=await findUserGroup(ph)})())}
  await Promise.all(gps);
  function buildSlot(type,idx,phone){
    const isSup=type==='super';

      const gi=groupCache[phone];
      let rankBadge='';

      if(rankBadge||clanBadge)topBadges='<div class="top-badges">'+rankBadge+clanBadge+'</div>';
      if(u.avatar){
        const av=u.avatar;
        if(av.endsWith('.webm')||av.endsWith('.mp4'))inner='<div class="avatar-wrap"><video class="avatar-mini" src="'+esc(av)+'" autoplay muted loop playsinline></video></div>';
        else inner='<div class="avatar-wrap"><img class="avatar-mini" src="'+esc(av)+'" onerror="this.style.display=\'none\'"></div>';
      }
    }else if(botAt){
      cls+=' filled ready-green';nameText='بات';nameCls='staff';
    }
    const isMgrOwner = phone && phone===room.managerPhone;
    const crownBeside = isMgrOwner ? crownHtml() : '';
    const nameRow = '<div class="name '+nameCls+'">'+nameText+tickHtml+crownBeside+'</div>';
    return '<div class="slot-wrap"><div class="'+cls+'" data-slot-type="'+type+'" data-slot-idx="'+idx+'"'+dp+'>'+

      inner+
      '<div class="voice-indicator">🎤</div>'+

      '</div>'+
      '<div class="name-wrap">'+nameRow+'</div></div>';
  }
  $('supersRow').innerHTML=buildSlot('super',1,room.supers&&room.supers[1])+buildSlot('super',2,room.supers&&room.supers[2]);
  for(let r=1;r<=5;r++){
    const a=(r-1)*2+1;const b=a+1;

  }

  document.querySelectorAll('.slot[data-slot-type="super"]').forEach(el=>{el.onclick=()=>{playClick();tapSuper(parseInt(el.dataset.slotIdx))}});
  document.querySelectorAll('img.tick-img').forEach(i=>applyTick(i,i.dataset.tick.split(',')));

async function updateRoom(fn){if(!currentRoomId)return;const rs=await getRooms();const r=rs[currentRoomId];if(!r)return;fn(r);await saveRooms(rs);window._lastRoomHash=null}
async function tapSeat(i){
  if(!currentRoomId)return;
  const rs=await getRooms();const r=rs[currentRoomId];if(!r)return;
  const ph=r.seats[i],bot=r.bots[i],my=mySeat(r);
  const isMgr=r.managerPhone===me.phone;
  if(bot){if(isMgr){if(confirm('بات حذف شود؟')){delete r.bots[i];await saveRooms(rs);window._lastRoomHash=null;refreshRoom()}}return}
  if(my){if(ph)openUserMenu({phone:ph});return}
  if(ph){openUserMenu({phone:ph});return}
  r.seats[i]=me.phone;await saveRooms(rs);window._lastRoomHash=null;refreshRoom();
}
async function tapSuper(i){
  if(!currentRoomId)return;
  const rs=await getRooms();const r=rs[currentRoomId];if(!r)return;
  const ph=r.supers[i],my=mySeat(r);
  const isMgr=r.managerPhone===me.phone;
  if(my){if(ph){if(isMgr&&ph===me.phone){delete r.supers[i];let f=null;for(let x=1;x<=MAX_PLAYERS;x++){if(!r.seats[x]&&!r.bots[x]){f=x;break}}if(f)r.seats[f]=me.phone;await saveRooms(rs);window._lastRoomHash=null;refreshRoom();return}openUserMenu({phone:ph})}return}
  if(ph){openUserMenu({phone:ph});return}
  if(!isMgr)return;
  r.supers[i]=me.phone;await saveRooms(rs);window._lastRoomHash=null;refreshRoom();
}
async function toggleReady(){
  if(!currentRoomId)return;
  const rs=await getRooms();const r=rs[currentRoomId];
  if(!r)return;
  r.ready=r.ready||{};r.ready[me.phone]=!(r.ready[me.phone]===true);
  await saveRooms(rs);window._lastRoomHash=null;refreshRoom();
}
async function startGame(){
  await updateRoom(r=>{
    const hum=Object.values(r.seats||{}).filter(Boolean);
    const bots=Object.keys(r.bots||{}).length;
    if(hum.length+bots<MAX_PLAYERS)return;
    for(const p of hum){if(p!==r.managerPhone&&!((r.ready||{})[p]===true))return}
    r.status='playing';
  });
  refreshRoom();
}
async function leaveRoom(toMain){

async function showReactionOnProfile(type){
  if(!currentRoomId)return;
  const now=Date.now();

  const btn=$(btnId);
  if(type==='dislike'&&now-lastDislikeTime<REACTION_COOLDOWN){if(btn)btn.classList.add('cooling');return}
  if(type==='like'&&now-lastLikeTime<REACTION_COOLDOWN){if(btn)btn.classList.add('cooling');return}
  const ld=await getLive(currentRoomId);
  if(!ld.reactions)ld.reactions={};
  ld.reactions[me.phone]={type,time:now};
  await setLive(currentRoomId,ld);
  if(type==='dislike')lastDislikeTime=now;else lastLikeTime=now;
  if(btn){btn.classList.add('cooling');setTimeout(()=>btn.classList.remove('cooling'),REACTION_COOLDOWN)}

    const ov=document.createElement('div');ov.className='reaction-overlay show';
    const img=document.createElement('img');img.src=type==='dislike'?'like3.gif':'like1.gif';
    ov.appendChild(img);el.appendChild(ov);setTimeout(()=>ov.remove(),3500);
  }

async function syncLiveState(){

  const ld=await getLive(currentRoomId);if(!ld)return;
  if(ld.reactions){
    const now=Date.now();
    document.querySelectorAll('.slot[data-phone]').forEach(el=>{
      const p=el.getAttribute('data-phone');const r=ld.reactions[p];
      if(r&&now-r.time<3500&&!el.querySelector('.reaction-overlay')){
        const ov=document.createElement('div');ov.className='reaction-overlay show';
        const im=document.createElement('img');im.src=r.type==='dislike'?'like3.gif':'like1.gif';
        ov.appendChild(im);el.appendChild(ov);setTimeout(()=>ov.remove(),3500);
      }
    });
  }
  if(ld.chat){
    const nm=ld.chat.filter(m=>!chatMessages.some(c=>c.time===m.time&&c.phone===m.phone&&c.text===m.text));
    if(nm.length){chatMessages.push(...nm);if($('chatMenu').classList.contains('show'))renderChatMessages()}
  }
  if(ld.seats||ld.supers||ld.ready){
    if(!window._lastL)window._lastL={};
    const ch=(ld.seats&&JSON.stringify(ld.seats)!==JSON.stringify(window._lastL.seats))||(ld.supers&&JSON.stringify(ld.supers)!==JSON.stringify(window._lastL.supers))||(ld.ready&&JSON.stringify(ld.ready)!==JSON.stringify(window._lastL.ready));
    if(ch){
      const rs=await getRooms();const r=rs[currentRoomId];
      if(r){if(ld.seats)r.seats=ld.seats;if(ld.supers)r.supers=ld.supers;if(ld.ready)r.ready=ld.ready;window._lastRoomHash=null;const u=await getUsersCached(false);renderRoom(r,u)}
    }
    window._lastL=ld;
  }
}

  $('backRoomBtn').onclick=()=>{playClick();leaveRoom(false)};
  $('btnManagerSettings').onclick=openManager;
  $('closeManager').onclick=()=>$('managerModal').classList.remove('active');
  $('btnGhost').onclick=async()=>{
    const myLvl=RANK_LEVEL[me.rank]||0;
    if(myLvl<RANK_LEVEL['ناظر'])return;
    await updateRoom(r=>{
      r.ghost=r.ghost||[];
      if(r.ghost.includes(me.phone))r.ghost=r.ghost.filter(x=>x!==me.phone);
      else r.ghost.push(me.phone);
    });
    refreshRoom();
  };
  $('micBtn').onclick=toggleMic;
  $('closeUserMenu').onclick=closeUm;
  $('closeProfile').onclick=()=>$('profileModal').classList.remove('active');
  $('closeReport').onclick=()=>$('reportModal').classList.remove('active');
  $('sendReportBtn').onclick=sendReport;
  $('btnCreatorPanel').onclick=openCreatorPanel;
  $('closeCreatorPanel').onclick=()=>$('creatorPanelModal').classList.remove('active');
  $('closeAdminUser').onclick=()=>$('adminUserModal').classList.remove('active');
  $('closeBan').onclick=()=>$('banModal').classList.remove('active');
  $('doBanBtn').onclick=doBan;
  $('kickGoMain').onclick=()=>location.href='TalarDs.html';
  $('deletedGoMain').onclick=()=>location.href='TalarDs.html';
  $('enterGameBtn').onclick=()=>{localStorage.setItem('current_game_room',currentRoomId);location.href='Safe Game.html'};
  $('dislikeBtn').onclick=()=>{playClick();showReactionOnProfile('dislike')};
  $('likeBtn').onclick=()=>{playClick();showReactionOnProfile('like')};
  $('chatBtn').onclick=()=>{playClick();openChat()};
  $('closeChat').onclick=closeChat;
  $('sendChat').onclick=sendChatMessage;
  $('chatInput').onkeypress=e=>{if(e.key==='Enter')sendChatMessage()};
  $('emojiBtn').onclick=()=>{};
});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
</script>
</body>
</html>
